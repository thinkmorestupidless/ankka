# The subset of the build that runs without Docker-in-Docker. The k3s suites (three modules'
# worth, each starting a Kubernetes node in a container) stay local for now: see CLAUDE.md,
# "Commands". The Scala template suite runs in its own job, and the Python, TypeScript and Rust
# template suites in their SDK's job.
#
# Only what a change can break is built. The `changes` job maps the files a pull request touched
# onto the jobs below, and a job whose inputs are untouched is skipped — which GitHub counts as a
# pass for a required status check, so a Python-only change merges on the Python job alone. A matrix
# job is the exception: skipped, it never reports its expanded names, so the required check for one
# is a summary job that always runs (`template-scala`). The map
# is the whole of that argument, and it errs towards running: a job's inputs are everything the job
# reads or builds, not only the directory named after it. The Scala job reads `docs/` (the
# descriptors shown in the docs and the generated reference pages are asserted by suites),
# `homebrew/` (the formula's placeholders) and `kustomization/` (the DDL and the CRD are symlinked
# into the modules; the overlays are rendered by a suite); both SDK jobs build the sidecar and the
# sample images from the Scala tree. A change to this file runs everything.
#
# Pushes to `main` are not built. The branch is protected: a pull request merges only when these
# checks have passed on a head that is up to date with `main`, so the merge commit's tree is the
# tree that was tested, and a second run of it would be the same minutes spent on the same answer.
# `workflow_dispatch` runs every job regardless of what changed, for a full build on demand.
name: ci
on:
  pull_request:
  workflow_dispatch:
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      scala: ${{ steps.filter.outputs.scala == 'true' || github.event_name == 'workflow_dispatch' }}
      docs: ${{ steps.filter.outputs.docs == 'true' || github.event_name == 'workflow_dispatch' }}
      sdk-python: ${{ steps.filter.outputs.sdk-python == 'true' || github.event_name == 'workflow_dispatch' }}
      sdk-typescript: ${{ steps.filter.outputs.sdk-typescript == 'true' || github.event_name == 'workflow_dispatch' }}
      sdk-rust: ${{ steps.filter.outputs.sdk-rust == 'true' || github.event_name == 'workflow_dispatch' }}
      console: ${{ steps.filter.outputs.console == 'true' || github.event_name == 'workflow_dispatch' }}
      template-scala: ${{ steps.filter.outputs.template-scala == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      # The map below is only as good as its coverage: a tracked file no filter claims is a file whose
      # change runs nothing, and a pattern that matches no file can never fire. Both would pass
      # silently, so this refuses both before the map is used.
      - uses: actions/checkout@v7
      - run: python3 .github/ci-coverage.py
      # On a pull request the action lists the changed files through the API against the base
      # branch; on a manual run there is no diff and every output is true.
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
              - '.github/ci-coverage.py'
            # Everything that goes into `sbt compile test`, and everything a suite reads back out of
            # the tree. The sidecar image the SDK jobs build is a subset of the same inputs.
            scala-build: &scala-build
              - 'build.sbt'
              - 'project/**'
              - '.scalafmt.conf'
              - 'modules/**'
              - 'protocol/**'
              - 'sidecar/**'
              - 'samples/**'
              - 'kustomization/components/postgres/ddl/**'
            scala:
              - *workflow
              - *scala-build
              - 'controlplane/**'
              - 'controlplane-api/**'
              - 'cli/**'
              - 'crd/**'
              - 'operator/**'
              - 'kustomization/**'
              - 'docs/**'
              - 'homebrew/**'
              # The GitHub Action, whose placeholders and install script `ActionSuite` runs.
              - 'action/**'
              # `RemoteOverlaySuite` checks the compose file runs the release's images.
              - 'docker-compose.yml'
              # The wire fixtures the console's client is held to are written by a controlplane-api suite.
              - 'console/package/fixtures/**'
              # The living features and the glossary their steps are written in: `GherkinSuite`s run
              # the features, and suites named for a scenario are held to its words.
              - 'features/**'
              - 'GLOSSARY.md'
            # Pages, the tool, the included samples and the files the generated tables are read from.
            docs:
              - *workflow
              - 'docs/**'
              - 'tools/docs/**'
              - 'mkdocs.yml'
              - 'modules/**'
              - 'samples/**'
              - 'sdks/**'
              - 'protocol/**'
              - 'cli/**'
              - 'marketplace/**'
              - 'ankka.g8/**'
              - 'console/**'
              # One of the files outside docs/ whose links to the site the check holds to it.
              - 'README.md'
            # What `ankka init --language` renders, and the suites that run the result: each SDK job
            # proves its language's template against the SDK and sidecar it has just built.
            templates: &templates
              - 'cli/src/main/templates/common/**'
              - 'cli/src/main/scala/**/cli/Init.scala'
              - 'cli/src/main/scala/**/cli/Scaffold.scala'
              - 'cli/src/main/scala/**/cli/Main.scala'
              - 'cli/src/test/scala/**/cli/PolyglotTemplateSuite.scala'
              - 'cli/src/test/scala/**/cli/TemplateSwitch.scala'
              - 'marketplace/plugins/ankka/skills/**'
            sdk-python:
              - *workflow
              - *scala-build
              - *templates
              - 'sdks/python/**'
              - 'cli/src/main/templates/python/**'
              - 'cli/src/test/scala/**/cli/PythonTemplateSuite.scala'
            sdk-typescript:
              - *workflow
              - *scala-build
              - *templates
              - 'sdks/typescript/**'
              - 'cli/src/main/templates/typescript/**'
              - 'cli/src/test/scala/**/cli/TypeScriptTemplateSuite.scala'
            # The host is in `sidecar/`, which `scala-build` covers, so a change to it runs this job
            # as well as the Scala one: the module mode is proved against the crate that targets it.
            sdk-rust:
              - *workflow
              - *scala-build
              - *templates
              - 'sdks/rust/**'
              - 'cli/src/main/templates/rust/**'
              - 'cli/src/test/scala/**/cli/RustTemplateSuite.scala'
            # The console: its workspace, the realm client it signs in as, and the route reference its
            # parity check reads. Its fakes stand in for the control plane, so no Scala is built.
            console:
              - *workflow
              - 'console/**'
              - 'kustomization/components/console/**'
              - 'kustomization/components/keycloak/realm-import.json'
              - 'docs/reference/control-plane-api.md'
            # `ankka init` for Scala: the Giter8 template, the command that expands it with `sbt new`,
            # the suite, and everything the expansion builds against — the modules this commit
            # publishes locally, and the descriptor rules its service.json is checked with.
            template-scala:
              - *workflow
              - *scala-build
              - 'ankka.g8/**'
              - 'controlplane-api/**'
              - 'cli/src/main/scala/**/cli/Init.scala'
              - 'cli/src/main/scala/**/cli/Main.scala'
              - 'cli/src/main/scala/**/mcp/McpInstall.scala'
              - 'cli/src/test/scala/**/cli/TemplateSuite.scala'
              - 'cli/src/test/scala/**/cli/TemplateSwitch.scala'
            # Files no job reads, each for a reason. No job uses this output; it exists so that
            # `ci-coverage.py` can tell a file left out on purpose from one nobody thought about.
            unchecked:
              - '.github/workflows/release.yml'   # runs only on a tag; nothing a pull request builds executes it
              - '.githooks/**'                    # the pre-commit hook runs on a developer's machine
              - 'Justfile'                        # thin wrappers over commands the jobs run directly
              - '.gitignore'
              - 'LICENSE.md'
              - 'CLAUDE.md'
              - 'assets/**'                       # images for the repository's own pages, not the site's
              - '.claude/**'                      # spec-kit's commands for developing ankka
              - '.specify/**'
              - 'specs/**'                        # feature records; nothing builds from them

  build:
    needs: changes
    if: needs.changes.outputs.scala == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # sbt-dynver derives the version from tags; a shallow clone sees none
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt -Dankka.cluster.tests=off -Dankka.template.tests=off scalafmtCheckAll scalafmtSbtCheck compile test

  # The Scala template, the one `ankka init` expands with `sbt new`: this commit's six libraries
  # published locally, the template expanded by the real command into a directory outside this build,
  # and the expansion made to pass its own tests and build its image. It runs beside `build` rather
  # than inside it, because it is minutes of its own. `sbt new` runs outside any build, so the
  # launcher is the sbt that expands it, and the two launcher lines differ in exactly the way that
  # once broke `ankka init` for every sbt 2 user: both are run. Naming `scala` in the switch makes a
  # missing sbt a failure rather than a skipped suite reported green.
  template-scala:
    needs: changes
    if: needs.changes.outputs.template-scala == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sbt-runner: ["1.12.15", "2.0.9"]
    name: template-scala (sbt ${{ matrix.sbt-runner }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the published version, and the one the expansion asks for, come from tags
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: ${{ matrix.sbt-runner }}
      - run: sbt --script-version
      - run: sbt -Dankka.cluster.tests=off -Dankka.template.tests=scala 'cli/testOnly com.thinkmorestupidless.ankka.cli.TemplateSuite'

  # The check branch protection requires for the Scala template, in place of the matrix's own names.
  # A matrix job skipped by the path filter is skipped before it expands, so it reports once, under
  # its unexpanded name (`template-scala (sbt ${{ matrix.sbt-runner }})`), and the expanded names
  # never appear: required by name, they blocked every pull request that did not touch the template.
  # This job always runs, and passes when both launcher lines passed or the template was untouched.
  template-scala-result:
    name: template-scala
    needs: [changes, template-scala]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "changes: ${{ needs.changes.result }}, template-scala: ${{ needs.template-scala.result }}"
          # A failed `changes` job skips the template too; that is not a pass.
          [ "${{ needs.changes.result }}" = success ] || exit 1
          case "${{ needs.template-scala.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac

  # The documentation: every page's rules, every included sample against its source, every generated
  # table against the code, the rendered skill, and a strict site build. The JVM-generated reference
  # pages and the descriptors shown in the docs are checked by the `build` job's suites.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv run --project tools/docs pytest tools/docs
      - run: uv run --project tools/docs docs build
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: target/docs-site

  # The Python SDK: its own tests (the unit testkits, the encoding fixtures, the sample through the
  # real sidecar image), and the conformance suite driving the Python reference through the sidecar
  # — the one definition of a compatible SDK. Docker is on the runner; the sidecar image is built
  # here so the SDK is tested against the sidecar of the same commit.
  sdk-python:
    needs: changes
    if: needs.changes.outputs.sdk-python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      # The SDK carries a copy of the protocol artifact so it can be built alone; a drift between
      # the copy and `protocol/` is a bug in whichever side forgot to run `scripts/proto.py`.
      - run: diff -r protocol/src/main/protobuf sdks/python/proto/src/main/protobuf
      - run: diff -r protocol/fixtures sdks/python/proto/fixtures
      # `tests/test_journal_portable.py` runs the Scala cart on the journal the Python cart wrote,
      # and the reverse, so it needs the sample's image as well as the sidecar's.
      - run: sbt -Dankka.cluster.tests=off -Dankka.template.tests=off sidecar/docker:publishLocal shoppingCart/docker:publishLocal
      - run: uv sync
        working-directory: sdks/python
      - run: uv run python scripts/proto.py
        working-directory: sdks/python
      # The package as PyPI would receive it: built, then imported from an isolated interpreter with
      # nothing but the wheel and its declared dependencies, so a stub the wheel does not carry or an
      # undeclared dependency fails on the commit that introduced it, not on the tag that ships it.
      - run: |
          uv build
          uv run --isolated --no-project --with dist/ankka-0.0.0-py3-none-any.whl python -c "import ankka, ankka.service, ankka.testkit; print(ankka.__file__)"
        working-directory: sdks/python
      - run: uv run mypy
        working-directory: sdks/python
      - run: uv run pytest -q
        working-directory: sdks/python
      - run: uv run conformance
        working-directory: sdks/python
      # `ankka init --language python`, rendered and then made to pass its own mypy and pytest against
      # this SDK and the sidecar image built above. The list form of the switch runs this template's
      # suite alone, without the Scala template's local publish.
      - run: sbt -Dankka.cluster.tests=off -Dankka.template.tests=python 'cli/testOnly *PythonTemplateSuite'

  # The TypeScript SDK: the same proof as the Python job, on the two Node lines the package supports —
  # the floor (22) and the line the docs show (24) — so `engines.node` is a fact and not a claim. The
  # fast tests, the fixtures, the typecheck and the packaging smoke run on both; the Docker-backed tests
  # and the conformance suite, which need the sidecar image built from this commit, run on 24 only.
  sdk-typescript:
    needs: changes
    if: needs.changes.outputs.sdk-typescript == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        if: matrix.node == 24
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
        if: matrix.node == 24
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      # The SDK carries a copy of the protocol artifact so it can be built alone; a drift between the copy
      # and `protocol/` is a bug in whichever side forgot to run `npm run proto`.
      - run: diff -r protocol/src/main/protobuf sdks/typescript/proto/src/main/protobuf
      - run: diff -r protocol/fixtures sdks/typescript/proto/fixtures
      - run: npm ci
        working-directory: sdks/typescript
      - run: npm run proto
        working-directory: sdks/typescript
      - run: npm run typecheck
        working-directory: sdks/typescript
      - run: npm test
        working-directory: sdks/typescript
      # The package as npm would receive it: built, packed, installed into an empty directory with nothing
      # but the tarball and its declared dependencies, imported from both entry points.
      - run: |
          set -euo pipefail
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke" && npm init -y >/dev/null
          npm install "$RUNNER_TEMP/ankka-0.0.0.tgz" --no-save --ignore-scripts
          node --input-type=module -e "import { Ankka, VERSION } from 'ankka'; import { EventSourcedTestKit } from 'ankka/testkit'; console.log('ankka', VERSION, typeof Ankka.service, typeof EventSourcedTestKit.of)"
        working-directory: sdks/typescript
      # Docker-backed: the sidecar and the Scala cart of this commit, the slow tests, the conformance suite.
      # `sidecar/docker:publishLocal` tags the images `:latest`, which is what the testkit's defaults name.
      - if: matrix.node == 24
        run: sbt -Dankka.cluster.tests=off -Dankka.template.tests=off sidecar/docker:publishLocal shoppingCart/docker:publishLocal
      - if: matrix.node == 24
        run: npm run test:slow
        working-directory: sdks/typescript
      - if: matrix.node == 24
        run: npm run conformance
        working-directory: sdks/typescript
      # `ankka init --language typescript`, rendered and then made to pass its own typecheck and tests
      # against this SDK (built above) and the sidecar image. See the Python job.
      - if: matrix.node == 24
        run: sbt -Dankka.cluster.tests=off -Dankka.template.tests=typescript 'cli/testOnly *TypeScriptTemplateSuite'

  # The Rust crate for the WebAssembly hosting mode: its own tests (the unit testkit, the encoding
  # fixtures both ways), the example built to a module and run through the runtime image of this
  # commit, the conformance suite against that module in both guest shapes, the crate as crates.io
  # would receive it, the template, and the host's own suite where cargo is present to build the
  # example it drives end to end.
  sdk-rust:
    needs: changes
    if: needs.changes.outputs.sdk-rust == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdks/rust
      # The crate carries a copy of the protocol artifact so it builds from crates.io alone; a drift
      # between the copy and `protocol/` is a bug in whichever side forgot to run `scripts/proto.sh`.
      - run: |
          diff -r ../../protocol/src/main/protobuf ankka/protocol/src/main/protobuf
          diff -r ../../protocol/fixtures ankka/protocol/fixtures
          diff ../../protocol/ENCODING.md ankka/protocol/ENCODING.md
          diff ../../protocol/WASM-ABI.md ankka/protocol/WASM-ABI.md
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features ankka/testkit -- -D warnings
      - run: cargo test -p ankka
      # What docs.rs will build for the published crate, held to no warnings.
      - run: cargo doc -p ankka --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      # The runtime image the integration tests run the module in, and the Scala cart the journal
      # portability test shares a database with, both from this commit.
      - run: sbt -Dankka.cluster.tests=off -Dankka.template.tests=off sidecar/docker:publishLocal shoppingCart/docker:publishLocal
        working-directory: .
      - run: cargo build -p shopping-cart --release --target wasm32-unknown-unknown
      - run: cargo test -p shopping-cart --features slow
      - run: ./conformance.sh
      # The crate as crates.io would receive it, built for the WebAssembly target from an empty
      # directory with nothing but the package, so an undeclared dependency or a file its `include`
      # misses fails on the commit that introduced it, not on the tag that ships it.
      - run: |
          set -euo pipefail
          cargo package -p ankka --allow-dirty
          mkdir "$RUNNER_TEMP/crate" && tar -xzf target/package/ankka-0.0.0.crate -C "$RUNNER_TEMP/crate"
          cd "$RUNNER_TEMP/crate/ankka-0.0.0" && cargo build --target wasm32-unknown-unknown
      # `ankka init --language rust`, rendered and made to pass its own clippy, build and slow tests
      # against this crate and the runtime image above.
      - run: sbt -Dankka.cluster.tests=off -Dankka.template.tests=rust 'cli/testOnly *RustTemplateSuite'
        working-directory: .
      # The host's own suite, whose end-to-end case builds the example with cargo — skipped, and
      # saying so, in the Scala job, which has no Rust toolchain.
      - run: sbt -Dankka.cluster.tests=off -Dankka.template.tests=off 'sidecar/testOnly *WasmHostSuite'
        working-directory: .

  # The installation's console: the package's unit tests, the host's build, and the Playwright suite
  # with scripts on and off against the package's own fakes — every acceptance scenario, an axe audit
  # of every page, and a check that the suite exercised every control plane route. Then the package
  # as npm would receive it, and the image. The compose-stack run of the same suite is local
  # (`just test-console-compose`), as the k3s suites are.
  console:
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # With the package packed and installed into an empty directory, as npm would receive it.
      - run: npm test
        env:
          CONSOLE_PACK: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: console-e2e-report
          path: |
            console/e2e/report
            console/e2e/test-results
      - run: docker build -t ankka-console:ci .
