# Re-runs the failed jobs of a `cluster` run, once. A run of about a hundred k3s jobs nearly always
# has one or two that fail for the runner's sake (Maven Central answering 429, an image pull, a slow
# node) and pass when re-run, and that re-run was done by hand every morning. Only a run's first
# attempt is retried, so a suite that fails twice stays red: that is a regression or a flake worth an
# issue, not noise. A cancelled run is not retried.
#
# `workflow_run` fires only for workflow files on the default branch, so this applies to the nightly
# run and to runs on demand alike, whichever branch they name.
name: cluster-retry
on:
  workflow_run:
    workflows: [cluster]
    types: [completed]
permissions:
  actions: write
jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN" --failed --repo "$GITHUB_REPOSITORY"
