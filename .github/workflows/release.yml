# A tag `v*` publishes the six application-facing modules to Maven Central through the Sonatype
# Central Portal, signed. Everything else in the build carries `publish / skip`.
#
# Waits on one thing outside this repository: the `com.thinkmorestupidless` namespace must be
# claimed on the Central Portal (https://central.sonatype.com) — a one-time action by the
# maintainer — and the four secrets below set on the repository:
#   PGP_SECRET          gpg --armor --export-secret-keys <id> | base64
#   PGP_PASSPHRASE      the key's passphrase
#   SONATYPE_USERNAME   the user-token *username* from the portal (not the account name)
#   SONATYPE_PASSWORD   the user-token *password*
# Until then, the same path is proven locally: `sbt -Dankka.release.local=/tmp/ankka-repo
# publishSigned` with a throwaway key (specs/006-external-applications/quickstart.md, Tier 4).
#
# A tag is the only thing that publishes. Commits to main used to publish `-SNAPSHOT`s to the
# portal's snapshot repository, which answers 403 for this namespace — it was claimed through the
# legacy OSSRH process in 2023, and snapshot publishing on the Central Portal is a separate
# entitlement from releases. That made every push to main a red build, which is how a real failure
# goes unnoticed. Snapshots are a local concern now: `sbt publishLocal` puts them in ~/.ivy2/local,
# which is what the samples and TemplateSuite resolve anyway.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # dynver needs the tags
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # dynver appends a timestamp and -SNAPSHOT when the working tree is dirty, so a dirty tree
      # turns a tag into a snapshot and ci-release then takes the snapshot path. v0.1.0 published
      # 0.1.0+0-963a43e8+20260919-1005-SNAPSHOT that way. The cause was this build's own
      # `templateVersion` task, now deleted — it rewrote a tracked file during publish, and
      # ci-release reloads before publishing, so dynver re-derived from the tree that task had
      # just dirtied. This guard would not have caught that (the tree is clean here, and only
      # dirtied later by sbt) but it does catch a genuinely dirty checkout, which is worth a
      # named failure rather than a release that is quietly a snapshot.
      - name: The version comes from a clean tree, or not at all
        run: |
          git update-index -q --refresh
          if ! git diff-index --quiet HEAD --; then
            echo "::error::working tree is dirty; dynver would build a -SNAPSHOT, not a release"
            git status --porcelain
            git diff --stat
            exit 1
          fi
          echo "clean: $(git describe --long --tags --abbrev=8 --match 'v[0-9]*' --always --dirty=+DIRTY)"
      - run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          # A tag publishes. ci-release runs sbt's own `sonaRelease`, which uploads the bundle to
          # the Central Portal and publishes it; `sonaUpload` is the same upload that stops short
          # and waits for the Publish button. v0.1.0 went out under `CI_SONATYPE_RELEASE:
          # sonaUpload` because that path had never completed and a first attempt whose failure
          # mode is "permanently published" is the wrong first attempt. It has completed now, so
          # the gate is gone — put the line back for a release worth rehearsing.
  images:
    # The four images, pushed to the shared registry in the ankka-ops project — the operator, the
    # control plane and the shopping cart sample — tagged with the release version and `latest`.
    #
    # No key anywhere: the job asks GitHub for its own OIDC token and exchanges it, through the
    # workload identity federation defined in ankka-deployments (environments/ops), for a
    # short-lived credential of a service account whose only role is writer on this one
    # repository. The federation's condition admits a run on a `v*` tag of exactly this repository
    # and nothing else, so a fork or a pull request cannot push. The two values below are not
    # secrets — they name the identity, they do not grant it — which is why they are in the file.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the OIDC token the exchange starts from
    env:
      DOCKER_REPOSITORY: europe-west2-docker.pkg.dev/ankka-ops/ankka
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # dynver needs the tags: Docker / version is the release version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: projects/846467939619/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: ankka-release@ankka-ops.iam.gserviceaccount.com
          token_format: access_token
      - name: Log docker in to the registry with the exchanged token
        run: echo '${{ steps.auth.outputs.access_token }}' | docker login -u oauth2accesstoken --password-stdin europe-west2-docker.pkg.dev
      # The same clean-tree rule as the publish job: an image tagged with a -SNAPSHOT version is
      # not a release image, and the registry should never hold one under a release's name.
      - name: The version comes from a clean tree, or not at all
        run: |
          git update-index -q --refresh
          git diff-index --quiet HEAD -- || { echo "::error::working tree is dirty"; git status --porcelain; exit 1; }
      - run: sbt operator/Docker/publish controlPlane/Docker/publish shoppingCart/Docker/publish sidecar/Docker/publish

  template:
    # The template as its own repository, so `sbt new thinkmorestupidless/ankka.g8` works: sbt's
    # Giter8 resolver accepts only `owner/repo.g8` (or a `.g8` file path), never a subdirectory of
    # another repository. Pushed from ankka.g8/ on every tag, after the artifacts it names exist.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # actions/checkout otherwise persists the workflow's own token as
          # `http.https://github.com/.extraheader`, which applies to *every* github.com URL and
          # takes precedence over the `x-access-token:<token>@` credentials in a push URL. The
          # push to ankka.g8 then authenticates as github-actions[bot], which has no access to
          # that repository: "Permission to thinkmorestupidless/ankka.g8.git denied to
          # github-actions[bot]" — a 403 that looks like a missing repository and is not one.
          # With this off, the token below is the one git uses.
          persist-credentials: false
      - run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git config user.name "ankka release"
          git config user.email "release@ankka.invalid"
          # The template resolves the artifacts the publish job just released, so its default must
          # name that version. It is written here rather than by the build: this job checks out
          # afresh, so anything the publish job wrote to its own workspace is gone — and writing to
          # a tracked file *there* is what made dynver see a dirty tree and publish a snapshot.
          # `subtree split` reads committed history, so the change is committed first. The commit
          # is local to this runner and never reaches main; only the split branch is pushed.
          sed -i "s/^ankka_version=.*/ankka_version=$version/" ankka.g8/src/main/g8/default.properties
          git add ankka.g8/src/main/g8/default.properties
          git commit -m "ankka_version=$version"
          grep -n "^ankka_version=" ankka.g8/src/main/g8/default.properties
          git subtree split --prefix ankka.g8 -b ankka-g8
          git push --force "https://x-access-token:${{ secrets.TEMPLATE_REPO_TOKEN }}@github.com/thinkmorestupidless/ankka.g8.git" ankka-g8:main
          git tag -f "${GITHUB_REF_NAME}" ankka-g8
          git push --force "https://x-access-token:${{ secrets.TEMPLATE_REPO_TOKEN }}@github.com/thinkmorestupidless/ankka.g8.git" "${GITHUB_REF_NAME}"

  marketplace:
    # The Claude Code marketplace as its own repository, so `/plugin marketplace add
    # thinkmorestupidless/ankka-marketplace` installs the plugin whose skills hold the documentation of
    # a released version rather than whatever is on main. Pushed from marketplace/ on every tag, the same
    # way the template is: a subtree split of committed history, after the version has been written in.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # See the template job: with credentials persisted, the push below authenticates as
          # github-actions[bot] and is refused.
          persist-credentials: false
      - run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git config user.name "ankka release"
          git config user.email "release@ankka.invalid"
          # The plugin's version is the platform version whose documentation it carries. It is 0.0.0 in
          # the tree and written here, by the same rule as the template's ankka_version: a tracked file
          # rewritten by the build would dirty the tree and turn the release into a snapshot.
          sed -i "s/\"version\": \"0.0.0\"/\"version\": \"$version\"/" \
            marketplace/.claude-plugin/marketplace.json marketplace/plugins/ankka/.claude-plugin/plugin.json
          grep -n "\"version\": \"$version\"" marketplace/.claude-plugin/marketplace.json marketplace/plugins/ankka/.claude-plugin/plugin.json
          git add marketplace
          git commit -m "ankka $version"
          git subtree split --prefix marketplace -b ankka-marketplace
          git push --force "https://x-access-token:${{ secrets.TEMPLATE_REPO_TOKEN }}@github.com/thinkmorestupidless/ankka-marketplace.git" ankka-marketplace:main
          git tag -f "${GITHUB_REF_NAME}" ankka-marketplace
          git push --force "https://x-access-token:${{ secrets.TEMPLATE_REPO_TOKEN }}@github.com/thinkmorestupidless/ankka-marketplace.git" "${GITHUB_REF_NAME}"

  cli:
    # The CLI as a Homebrew formula: `brew install thinkmorestupidless/tap/ankka`. The zip that
    # sbt-native-packager builds (`cli/Universal/packageBin`: bin/ankka and lib/*.jar, needing only a
    # JDK 21) is attached to a GitHub release for the tag, and the formula — canonical in homebrew/
    # here, with version 0.0.0 and a checksum of zeros — is written with the tag's version and the
    # zip's SHA-256 and pushed to thinkmorestupidless/homebrew-tap, the way the template and the
    # marketplace are. It waits for the publish job because `ankka init` writes this version into
    # every project it creates, and those resolve the libraries from Maven Central.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release and its asset, with the workflow's own token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # dynver needs the tags: the zip's name and `ankka version` are the release version
          # See the template job: with credentials persisted, the push to the tap below authenticates
          # as github-actions[bot] and is refused.
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: The version comes from a clean tree, or not at all
        run: |
          git update-index -q --refresh
          git diff-index --quiet HEAD -- || { echo "::error::working tree is dirty"; git status --porcelain; exit 1; }
      - run: sbt cli/Universal/packageBin
      - name: Attach the zip to the tag's GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          zip="cli/target/universal/ankka-cli-$version.zip"
          test -f "$zip" || { echo "::error::no $zip — the build's version is not the tag's"; ls cli/target/universal; exit 1; }
          # A re-run of this job finds the release it made last time; the asset is replaced, not duplicated.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "ankka $version" --generate-notes "$zip"
          fi
          echo "SHA256=$(sha256sum "$zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Write the formula and push the tap
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git config user.name "ankka release"
          git config user.email "release@ankka.invalid"
          # The two placeholders, by the same rule as the template's ankka_version and the plugin's
          # version: written here, never by the build, so no tracked file is dirtied during publish.
          # HomebrewFormulaSuite pins both placeholders, so a formula this cannot rewrite fails `cli/test`.
          sed -i "s/0\.0\.0/$version/g; s/0\{64\}/$SHA256/" homebrew/Formula/ankka.rb
          grep -n "releases/download/v$version/ankka-cli-$version.zip" homebrew/Formula/ankka.rb
          grep -n "sha256 \"$SHA256\"" homebrew/Formula/ankka.rb
          git add homebrew/Formula/ankka.rb
          git commit -m "ankka $version"
          git subtree split --prefix homebrew -b homebrew-tap
          git push --force "https://x-access-token:${{ secrets.TEMPLATE_REPO_TOKEN }}@github.com/thinkmorestupidless/homebrew-tap.git" homebrew-tap:main
          git tag -f "${GITHUB_REF_NAME}" homebrew-tap
          git push --force "https://x-access-token:${{ secrets.TEMPLATE_REPO_TOKEN }}@github.com/thinkmorestupidless/homebrew-tap.git" "${GITHUB_REF_NAME}"

  docs:
    # The documentation site — pages, llms.txt, llms-full.txt, raw Markdown per page and
    # docs-index.json — for the release just tagged, to GitHub Pages. Needs Pages enabled on the
    # repository with "GitHub Actions" as its source, a one-time setting. It waits for the publish
    # job because a release that never reached Maven Central should not be documented as released.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv run --project tools/docs docs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/docs-site
      - id: deploy
        uses: actions/deploy-pages@v4
