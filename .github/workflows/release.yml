# A tag `v*` publishes the eleven application-facing modules to Maven Central through the Sonatype
# Central Portal, signed. Everything else in the build carries `publish / skip`.
#
# Waits on one thing outside this repository: the `com.thinkmorestupidless` namespace must be
# claimed on the Central Portal (https://central.sonatype.com) — a one-time action by the
# maintainer — and the four secrets below set on the repository:
#   PGP_SECRET          gpg --armor --export-secret-keys <id> | base64
#   PGP_PASSPHRASE      the key's passphrase
#   SONATYPE_USERNAME   the user-token *username* from the portal (not the account name)
#   SONATYPE_PASSWORD   the user-token *password*
# Until then, the same path is proven locally: `sbt -Dankka.release.local=/tmp/ankka-repo
# publishSigned` with a throwaway key (specs/006-external-applications/quickstart.md, Tier 4).
#
# A tag is the only thing that publishes. Commits to main used to publish `-SNAPSHOT`s to the
# portal's snapshot repository, which answers 403 for this namespace — it was claimed through the
# legacy OSSRH process in 2023, and snapshot publishing on the Central Portal is a separate
# entitlement from releases. That made every push to main a red build, which is how a real failure
# goes unnoticed. Snapshots are a local concern now: `sbt publishLocal` puts them in ~/.ivy2/local,
# which is what the samples and TemplateSuite resolve anyway.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-24.04
    # Upload, and stop. sbt's `sonaRelease` uploads the bundle in seconds and then polls the portal
    # every 30s until Sonatype reports it PUBLISHED — the sync to repo1, which is minutes on a good
    # day and was an hour of a runner doing nothing on a bad one (v0.4.0, v0.5.0). The portal
    # publishes an AUTOMATIC deployment on its own once it validates; nothing here needs to watch
    # it. So ci-release stops at `sonaBundle` and the step after it uploads the zip through the
    # portal's own API with publishingType=AUTOMATIC, which answers with the deployment id at once.
    # The bound below is for a stuck upload, not a wait.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # dynver needs the tags
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # dynver appends a timestamp and -SNAPSHOT when the working tree is dirty, so a dirty tree
      # turns a tag into a snapshot and ci-release then takes the snapshot path. v0.1.0 published
      # 0.1.0+0-963a43e8+20260919-1005-SNAPSHOT that way. The cause was this build's own
      # `templateVersion` task, now deleted — it rewrote a tracked file during publish, and
      # ci-release reloads before publishing, so dynver re-derived from the tree that task had
      # just dirtied. This guard would not have caught that (the tree is clean here, and only
      # dirtied later by sbt) but it does catch a genuinely dirty checkout, which is worth a
      # named failure rather than a release that is quietly a snapshot.
      - name: The version comes from a clean tree, or not at all
        run: |
          git update-index -q --refresh
          if ! git diff-index --quiet HEAD --; then
            echo "::error::working tree is dirty; dynver would build a -SNAPSHOT, not a release"
            git status --porcelain
            git diff --stat
            exit 1
          fi
          echo "clean: $(git describe --long --tags --abbrev=8 --match 'v[0-9]*' --always --dirty=+DIRTY)"
      # A release that reached Central and was cut off while sbt waited for the portal (above) needs
      # the jobs behind this one to run without uploading again: the portal refuses a version it
      # already holds, and nothing on Central can be replaced. A re-run of the tag — or the tag moved
      # to a commit that changes nothing the jars are built from — therefore asks repo1 first.
      - name: Is this version already on Maven Central?
        id: central
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://repo1.maven.org/maven2/com/thinkmorestupidless/ankka-core_3/$version/ankka-core_3-$version.pom"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
          echo "$url -> $code"
          if [ "$code" = "200" ]; then
            echo "::notice::$version is already on Maven Central; not uploading it again"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: sbt ci-release
        if: steps.central.outputs.published != 'true'
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          # ci-release imports the key, runs publishSigned into the local staging directory, and
          # then the command named here. `sonaBundle` zips that directory and stops; `sonaUpload`
          # would upload it and leave it waiting for the Publish button, `sonaRelease` would upload
          # and poll until published. The upload is the next step.
          CI_SONATYPE_RELEASE: sonaBundle
      - name: Upload the bundle to the Central Portal, to be published automatically
        if: steps.central.outputs.published != 'true'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          bundle=$(find . -path '*/sona-bundle/bundle.zip' -type f | head -1)
          if [ -z "$bundle" ]; then echo "::error::sonaBundle wrote no bundle.zip"; find . -name '*.zip' -path '*target*' | head; exit 1; fi
          echo "bundle: $bundle ($(du -h "$bundle" | cut -f1))"
          version="${GITHUB_REF_NAME#v}"
          token=$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 | tr -d '\n')
          # AUTOMATIC: validated, then published, by the portal — no one has to watch. The answer is
          # the deployment id; anything but a 201 is the failure, with the portal's own message.
          code=$(curl -sS -o upload.out -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -F "bundle=@$bundle" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=ankka-$version" || true)
          echo "portal answered $code: $(cat upload.out)"
          [ "$code" = "201" ] || exit 1
          deployment=$(cat upload.out)
          echo "::notice::$version uploaded as deployment $deployment; the portal publishes it and repo1 follows in minutes to an hour"
          # One look, not a wait: the state right now, for the log.
          curl -sS -o status.out -w '%{http_code}\n' -H "Authorization: Bearer $token" -X POST \
            "https://central.sonatype.com/api/v1/publisher/status?id=$deployment" || true
          cat status.out; echo
  images:
    # The six images — the operator, the control plane, the sidecar, the proxy, the console and the shopping cart sample —
    # published to GitHub Container Registry, public, tagged with the release version and `latest`.
    # Public because a Python or TypeScript developer runs the sidecar on their own machine, and a
    # pull there should need no account anywhere. The workflow's own token pushes them: each image
    # carries org.opencontainers.image.source naming this repository (build.sbt), which links the
    # package to it.
    #
    # The clusters do not pull from ghcr.io. They pull through a remote repository in the ankka-ops
    # project that caches it (ankka-deployments, modules/artifact-registry) — in-region, and still
    # served when ghcr.io is not. A version is cached only once something has pulled it, so the last
    # steps here pull every image through the cache: no cluster depends on ghcr.io being up for a
    # version it has not run before. That pull is a read, done as the release identity through
    # workload identity federation: no key anywhere, and the federation's condition admits a run on
    # a `v*` tag of exactly this repository and nothing else. The two values below name the
    # identity, they do not grant it, which is why they are in the file.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # publish the images to this repository's packages on ghcr.io
      id-token: write   # the OIDC token the cache pull's credential is exchanged from
    env:
      DOCKER_REPOSITORY: ghcr.io/thinkmorestupidless
      GHCR_CACHE: europe-west2-docker.pkg.dev/ankka-ops/ghcr
      IMAGES: ankka-operator ankka-controlplane ankka-sidecar ankka-proxy ankka-storage-mover sample-shopping-cart ankka-console
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # dynver needs the tags: Docker / version is the release version
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # The same clean-tree rule as the publish job: an image tagged with a -SNAPSHOT version is
      # not a release image, and the registry should never hold one under a release's name.
      - name: The version comes from a clean tree, or not at all
        run: |
          git update-index -q --refresh
          git diff-index --quiet HEAD -- || { echo "::error::working tree is dirty"; git status --porcelain; exit 1; }
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: sbt operator/Docker/publish controlPlane/Docker/publish shoppingCart/Docker/publish sidecar/Docker/publish proxy/Docker/publish storageMover/Docker/publish
      # The console (feature 017) is a Node image built by Docker from console/, tagged exactly as
      # the sbt images are: the release version and `latest`.
      - name: Publish the console image
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          docker build -t "$DOCKER_REPOSITORY/ankka-console:$version" -t "$DOCKER_REPOSITORY/ankka-console:latest" console
          docker push --all-tags "$DOCKER_REPOSITORY/ankka-console"
      # A package ghcr.io has never seen is created private, whatever its source repository is, and
      # a private package is invisible both to a developer and to the cache (which pulls
      # anonymously). Asked of ghcr.io with no credential at all, so the answer is what a stranger
      # gets; the fix is one click per package, once, and the error names the page.
      - name: Every image is publicly pullable
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for image in $IMAGES; do
            # A private or unknown package is refused at the token endpoint already; carry on with no
            # token, so the manifest request below fails and the error names the fix.
            token="$(curl -sS "https://ghcr.io/token?scope=repository:thinkmorestupidless/$image:pull" | jq -r '.token // empty' || true)"
            status="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/thinkmorestupidless/$image/manifests/$version")"
            if [ "$status" != 200 ]; then
              echo "::error::ghcr.io/thinkmorestupidless/$image:$version is not publicly pullable ($status). Make the package public once, at https://github.com/users/thinkmorestupidless/packages/container/$image/settings, then re-run this job."
              exit 1
            fi
            echo "public: ghcr.io/thinkmorestupidless/$image:$version"
          done
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: projects/846467939619/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: ankka-release@ankka-ops.iam.gserviceaccount.com
          token_format: access_token
      - name: Warm the clusters' cache, and check it serves what was published
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo '${{ steps.auth.outputs.access_token }}' | docker login -u oauth2accesstoken --password-stdin europe-west2-docker.pkg.dev
          for image in $IMAGES; do
            # A full pull, not a manifest read: the cache stores the layers it has served, and the
            # layers are what a node needs when ghcr.io is down.
            docker pull -q "$GHCR_CACHE/thinkmorestupidless/$image:$version"
            published="$(docker buildx imagetools inspect "ghcr.io/thinkmorestupidless/$image:$version" --format '{{json .Manifest.Digest}}')"
            cached="$(docker buildx imagetools inspect "$GHCR_CACHE/thinkmorestupidless/$image:$version" --format '{{json .Manifest.Digest}}')"
            if [ "$published" != "$cached" ]; then
              echo "::error::the cache serves $cached for $image:$version, and ghcr.io serves $published"
              exit 1
            fi
            echo "cached: $image:$version $cached"
          done

  template:
    # The template as its own repository, so `sbt new thinkmorestupidless/ankka.g8` works: sbt's
    # Giter8 resolver accepts only `owner/repo.g8` (or a `.g8` file path), never a subdirectory of
    # another repository. Pushed from ankka.g8/ on every tag, after the artifacts it names exist.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # actions/checkout otherwise persists the workflow's own token as
          # `http.https://github.com/.extraheader`, which applies to *every* github.com URL and
          # takes precedence over the `x-access-token:<token>@` credentials in a push URL. The
          # push to ankka.g8 then authenticates as github-actions[bot], which has no access to
          # that repository: "Permission to thinkmorestupidless/ankka.g8.git denied to
          # github-actions[bot]" — a 403 that looks like a missing repository and is not one.
          # With this off, the token below is the one git uses.
          persist-credentials: false
      - run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git config user.name "ankka release"
          git config user.email "release@ankka.invalid"
          # The template resolves the artifacts the publish job just released, so its default must
          # name that version. It is written here rather than by the build: this job checks out
          # afresh, so anything the publish job wrote to its own workspace is gone — and writing to
          # a tracked file *there* is what made dynver see a dirty tree and publish a snapshot.
          # `subtree split` reads committed history, so the change is committed first. The commit
          # is local to this runner and never reaches main; only the split branch is pushed.
          sed -i "s/^ankka_version=.*/ankka_version=$version/" ankka.g8/src/main/g8/default.properties
          git add ankka.g8/src/main/g8/default.properties
          git commit -m "ankka_version=$version"
          grep -n "^ankka_version=" ankka.g8/src/main/g8/default.properties
          git subtree split --prefix ankka.g8 -b ankka-g8
          git push --force "https://x-access-token:${{ secrets.TEMPLATE_REPO_TOKEN }}@github.com/thinkmorestupidless/ankka.g8.git" ankka-g8:main
          git tag -f "${GITHUB_REF_NAME}" ankka-g8
          git push --force "https://x-access-token:${{ secrets.TEMPLATE_REPO_TOKEN }}@github.com/thinkmorestupidless/ankka.g8.git" "${GITHUB_REF_NAME}"

  marketplace:
    # The Claude Code marketplace is its own repository, thinkmorestupidless/ankka-marketplace, so
    # `/plugin marketplace add thinkmorestupidless/ankka-marketplace` installs plugins whose skills hold
    # the documentation of a released version rather than whatever is on main. It holds one plugin per
    # project — ankka's, satisfactory's, ankka-flow's — and each project's release publishes only its own: this job
    # clones the marketplace, replaces `plugins/ankka/` with the rendered plugin, writes ankka's entry
    # into the manifest's `plugins` list without touching the others, and pushes an ordinary commit.
    # No subtree split and no force push, because either would erase the other projects' plugins.
    # The manifest's name, owner and description are ankka's, from marketplace/ here, as is the
    # README, which describes every plugin the marketplace carries.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # See the template job: with credentials persisted, the push below authenticates as
          # github-actions[bot] and is refused.
          persist-credentials: false
      - run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          remote="https://x-access-token:${{ secrets.TEMPLATE_REPO_TOKEN }}@github.com/thinkmorestupidless/ankka-marketplace.git"
          # The plugin's version is the platform version whose documentation it carries. It is 0.0.0 in
          # the tree and written here, by the same rule as the template's ankka_version: a tracked file
          # rewritten by the build would dirty the tree and turn the release into a snapshot.
          sed -i "s/\"version\": \"0.0.0\"/\"version\": \"$version\"/" marketplace/plugins/ankka/.claude-plugin/plugin.json
          grep -n "\"version\": \"$version\"" marketplace/plugins/ankka/.claude-plugin/plugin.json
          # A full clone, not --depth 1: when another project's release lands between the clone and
          # the push, the retry rebases, and git refuses to push a tag from a shallow clone across
          # that boundary ("missing necessary objects" — ankka-flow v0.5.0 hit it). The marketplace
          # is small; its history is cheap.
          git clone "$remote" "$RUNNER_TEMP/marketplace"
          cd "$RUNNER_TEMP/marketplace"
          git config user.name "ankka release"
          git config user.email "release@ankka.invalid"
          rm -rf plugins/ankka
          mkdir -p plugins .claude-plugin
          cp -R "$GITHUB_WORKSPACE/marketplace/plugins/ankka" plugins/ankka
          cp "$GITHUB_WORKSPACE/marketplace/README.md" README.md
          # The entry is the plugin's own manifest, as the marketplace lists it. Everything else in the
          # `plugins` list belongs to another project and is kept as found; the list is sorted so two
          # projects releasing in either order produce the same file.
          entry="$(jq -c '{name, source: ("./plugins/" + .name), description, version}' plugins/ankka/.claude-plugin/plugin.json)"
          existing="$( [ -f .claude-plugin/marketplace.json ] && cat .claude-plugin/marketplace.json || echo '{"plugins":[]}' )"
          jq --argjson entry "$entry" --argjson ours "$(cat "$GITHUB_WORKSPACE/marketplace/.claude-plugin/marketplace.json")" \
            '{name: $ours.name, owner: $ours.owner, metadata: $ours.metadata,
              plugins: ([.plugins[] | select(.name != $entry.name)] + [$entry] | sort_by(.name))}' \
            <<< "$existing" > .claude-plugin/marketplace.json
          jq . .claude-plugin/marketplace.json
          git add -A
          git commit -m "ankka $version"
          # Another project's release may have pushed since the clone; rebase onto it and try again.
          for attempt in 1 2 3; do
            git push "$remote" HEAD:main && break
            [ "$attempt" = 3 ] && exit 1
            git pull --rebase "$remote" main
          done
          git tag -f "ankka-${GITHUB_REF_NAME}"
          git push --force "$remote" "ankka-${GITHUB_REF_NAME}"

  cli:
    # The CLI as a zip: `cli/Universal/packageBin` (bin/ankka and lib/*.jar, needing only a JDK 21)
    # attached to a GitHub release for the tag, which this job creates. It is the install route for a
    # platform with no native build; the native builds (`cli-native`), the Homebrew formula
    # (`homebrew`) and the action all attach to or read from the release this job makes. It waits
    # for the publish job because `ankka init` writes this version into every project it creates, and
    # those resolve the libraries from Maven Central.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the release and its asset, with the workflow's own token
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # dynver needs the tags: the zip's name and `ankka version` are the release version
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: The version comes from a clean tree, or not at all
        run: |
          git update-index -q --refresh
          git diff-index --quiet HEAD -- || { echo "::error::working tree is dirty"; git status --porcelain; exit 1; }
      - run: sbt cli/Universal/packageBin
      - name: Attach the zip to the tag's GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          zip="cli/target/universal/ankka-cli-$version.zip"
          test -f "$zip" || { echo "::error::no $zip — the build's version is not the tag's"; ls cli/target/universal; exit 1; }
          # The checksum beside the zip, for whoever downloads it to verify it. Written from *inside*
          # the directory so the line names the bare file — a
          # `sha256sum --check` elsewhere reads the name in the file and looks for it relative to
          # the working directory, and a path from this repository's tree would never resolve there.
          ( cd cli/target/universal && sha256sum "ankka-cli-$version.zip" > "ankka-cli-$version.zip.sha256" )
          # A re-run of this job finds the release it made last time; the asset is replaced, not duplicated.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" "$zip.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "ankka $version" --generate-notes "$zip" "$zip.sha256"
          fi

  cli-native:
    # The CLI as one executable per platform, needing no JVM: GraalVM's native-image over the same
    # jar the zip carries. native-image cannot cross-compile, so each platform builds on its own
    # runner. Each binary is attached to the tag's GitHub release as
    # ankka-cli-<version>-<platform>.tar.gz (a tarball, so the executable bit survives the download)
    # with a .sha256 beside it. It waits for the `cli` job because that job creates the release.
    needs: cli
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      # One platform's failure must not cancel the others: a re-run of the failed leg finishes the
      # release, and the upload replaces rather than duplicates.
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: the binary links the build machine's glibc, and an older one runs on
          # more distributions. Alpine (musl) runs none of these.
          - { platform: linux-x64, runner: ubuntu-22.04 }
          - { platform: linux-arm64, runner: ubuntu-22.04-arm }
          - { platform: macos-arm64, runner: macos-14 }
          - { platform: macos-x64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write   # the release's assets, with the workflow's own token
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # dynver needs the tags: `ankka version` is the release version
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          cache: sbt
          github-token: ${{ github.token }}
      - uses: sbt/setup-sbt@v1
      - name: The version comes from a clean tree, or not at all
        run: |
          git update-index -q --refresh
          git diff-index --quiet HEAD -- || { echo "::error::working tree is dirty"; git status --porcelain; exit 1; }
      - run: sbt cli/GraalVMNativeImage/packageBin
      # A native image builds successfully with a resource missing; this asks the binary for each one.
      - run: cli/native-smoke.sh cli/target/graalvm-native-image/ankka "${GITHUB_REF_NAME#v}"
      - name: Attach the binary to the tag's GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="ankka-cli-$version-${{ matrix.platform }}.tar.gz"
          # From inside the directory, for the same reason as the zip's checksum: the line names the
          # bare file. shasum, not sha256sum, because macOS runners carry only the first.
          ( cd cli/target/graalvm-native-image \
              && tar -czf "$archive" ankka \
              && shasum -a 256 "$archive" > "$archive.sha256" )
          gh release upload "$GITHUB_REF_NAME" \
            "cli/target/graalvm-native-image/$archive" \
            "cli/target/graalvm-native-image/$archive.sha256" \
            --clobber

  homebrew:
    # The CLI as a Homebrew formula: `brew install thinkmorestupidless/tap/ankka`. The formula —
    # canonical in homebrew/ here, with version 0.0.0 and a checksum of zeros per platform — installs
    # the native build for the machine it runs on, so it waits for every leg of `cli-native` and
    # takes each checksum from the .sha256 that leg published beside its tarball. It is then committed
    # to thinkmorestupidless/homebrew-tap the way the marketplace is: the tap is cloned, the one file
    # written, and an ordinary commit pushed — never a force push, which would erase the other
    # formulae the tap holds (ankka-flow ships through the same tap).
    needs: cli-native
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # See the template job: with credentials persisted, the push to the tap below authenticates
          # as github-actions[bot] and is refused.
          persist-credentials: false
      - name: Write the formula and push the tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          git config user.name "ankka release"
          git config user.email "release@ankka.invalid"
          # The placeholders, by the same rule as the template's ankka_version and the plugin's
          # version: written here, never by the build, so no tracked file is dirtied during publish.
          # Each checksum line names its platform in a comment, which is what this matches on.
          # HomebrewFormulaSuite pins that shape, so a formula this cannot rewrite fails `cli/test`.
          sed -i "s/version \"0\.0\.0\"/version \"$version\"/" homebrew/Formula/ankka.rb
          mkdir -p "$RUNNER_TEMP/sums"
          for platform in macos-arm64 macos-x64 linux-arm64 linux-x64; do
            archive="ankka-cli-$version-$platform.tar.gz"
            gh release download "$GITHUB_REF_NAME" --pattern "$archive.sha256" --dir "$RUNNER_TEMP/sums" --clobber
            sum="$(cut -d' ' -f1 "$RUNNER_TEMP/sums/$archive.sha256")"
            [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::$archive.sha256 holds no checksum: '$sum'"; exit 1; }
            sed -i "s/0\{64\}\(\" # $platform\)$/$sum\1/" homebrew/Formula/ankka.rb
          done
          # A placeholder left behind is a formula that installs nothing on that platform.
          if grep -n '0\{64\}' homebrew/Formula/ankka.rb; then
            echo "::error::a checksum placeholder survived"; exit 1
          fi
          grep -n "version \"$version\"" homebrew/Formula/ankka.rb
          remote="https://x-access-token:${{ secrets.TEMPLATE_REPO_TOKEN }}@github.com/thinkmorestupidless/homebrew-tap.git"
          git clone --depth 1 "$remote" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          git config user.name "ankka release"
          git config user.email "release@ankka.invalid"
          mkdir -p Formula
          cp "$GITHUB_WORKSPACE/homebrew/Formula/ankka.rb" Formula/ankka.rb
          # The tap's README is ankka's to publish; every other file in the tap is another project's
          # and is kept as found.
          cp "$GITHUB_WORKSPACE/homebrew/README.md" README.md
          git add Formula/ankka.rb README.md
          git commit -m "ankka $version"
          # Another project's release may have pushed between the clone and here: one rebase and retry.
          git push origin HEAD:main || { git fetch --depth 1 origin main && git rebase origin/main && git push origin HEAD:main; }

  action:
    # The GitHub Action as its own repository, so a workflow can say
    # `uses: thinkmorestupidless/ankka-action@v1` — an action can only be referenced as
    # owner/repo@ref, which is why this is a subtree push like the template, the marketplace and the
    # tap rather than a directory people reference in place.
    #
    # It needs `cli-native`, not just `publish`: the action downloads the native build for its runner
    # and the checksum beside it, so publishing an action whose default version points at a release
    # without those assets would ship something that cannot install anything.
    #
    # Two tags move: v<version> pins, and v<major> is what a workflow normally follows.
    needs: [publish, cli-native]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # See the template job: with credentials persisted, the push below authenticates as
          # github-actions[bot] and is refused.
          persist-credentials: false
      - run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"
          git config user.name "ankka release"
          git config user.email "release@ankka.invalid"
          # The action installs the CLI of the release it was published beside, so its default
          # version is written here — 0.0.0 in the tree, by the same rule as the template's
          # ankka_version, the plugin's version and the formula's: a tracked file rewritten by the
          # build would dirty the tree and turn the release into a snapshot. ActionSuite pins the
          # placeholder, so an action this cannot rewrite fails `cli/test`.
          sed -i "s/default: \"0\.0\.0\"/default: \"$version\"/" action/action.yml
          grep -n "default: \"$version\"" action/action.yml
          git add action/action.yml
          git commit -m "ankka $version"
          git subtree split --prefix action -b ankka-action
          git push --force "https://x-access-token:${{ secrets.TEMPLATE_REPO_TOKEN }}@github.com/thinkmorestupidless/ankka-action.git" ankka-action:main
          git tag -f "${GITHUB_REF_NAME}" ankka-action
          git tag -f "v$major" ankka-action
          git push --force "https://x-access-token:${{ secrets.TEMPLATE_REPO_TOKEN }}@github.com/thinkmorestupidless/ankka-action.git" "${GITHUB_REF_NAME}" "v$major"

  sdk-python:
    # The Python SDK to PyPI, as the package `ankka`: https://pypi.org/project/ankka/. The version is
    # `__version__` in sdks/python/src/ankka/__init__.py — 0.0.0 in the tree, written here from the
    # tag by the same rule as the template, the plugin and the formula, and read by hatchling as the
    # package version — so the version the SDK reports to the sidecar in discovery is the one on PyPI.
    # The gRPC stubs are generated from this commit's `protocol/`, so the wheel speaks the protocol
    # of the release it is named after, which is what the ci workflow's sdk-python job tests.
    #
    # No token anywhere: PyPI trusts this workflow directly (trusted publishing, OIDC), the same
    # shape as the images job. It needs one thing outside this repository, once: on
    # https://pypi.org/manage/account/publishing/ a publisher for project `ankka`, owner
    # `thinkmorestupidless`, repository `ankka`, workflow `release.yml`, environment `pypi` — a
    # "pending" publisher until the first upload creates the project. The `pypi` environment on the
    # repository is where a required reviewer would go, if a release ever wants a Publish button.
    #
    # It waits for the publish job for the reason the docs job does: a release that never reached
    # Maven Central should not exist on PyPI either. A version can never be re-uploaded to PyPI, only
    # superseded, so a failed smoke test below is the last point at which a release can be withdrawn.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/ankka/
    permissions:
      contents: read
      id-token: write   # the OIDC token PyPI verifies
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - name: Write the version, generate the stubs, build the wheel
        working-directory: sdks/python
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^__version__ = \"0.0.0\"/__version__ = \"$version\"/" src/ankka/__init__.py
          grep -n "^__version__ = \"$version\"" src/ankka/__init__.py
          uv sync
          uv run python scripts/proto.py
          uv build
          ls -l dist
          test -f "dist/ankka-$version-py3-none-any.whl" || { echo "::error::the wheel is not versioned as the tag"; exit 1; }
      - name: The wheel installs on its own and is the release it claims to be
        working-directory: sdks/python
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # An isolated interpreter with only the wheel and its declared dependencies: no checkout on
          # the path, so a stub the wheel does not carry or a dependency pyproject does not declare
          # fails here rather than on a user's first `uv add ankka`.
          uv run --isolated --no-project --with "dist/ankka-$version-py3-none-any.whl" python - "$version" <<'PY'
          import sys
          import ankka, ankka.service, ankka.testkit
          assert ankka.__version__ == sys.argv[1], (ankka.__version__, sys.argv[1])
          print("ankka", ankka.__version__, "from", ankka.__file__)
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist

  sdk-typescript:
    # The TypeScript SDK to npm, as the package `ankka`: https://www.npmjs.com/package/ankka. The version
    # is `version` in sdks/typescript/package.json — 0.0.0 in the tree, written here from the tag by the
    # same rule as the template, the plugin, the formula and the Python SDK — and `src/version.ts` is
    # generated from it by `npm run proto`, so the version the SDK reports to the sidecar in discovery
    # is the one on npm. The stubs are generated from this commit's `protocol/`, as the ci job tests.
    #
    # No token: npm trusts this workflow directly (trusted publishing, OIDC), the same shape as the
    # PyPI job. Unlike PyPI, npm cannot create a package this way: the FIRST publish of `ankka` was
    # made by hand, at the tag's version, after that tag's `publish` job succeeded
    # (.claude/rules/build-and-release.md, Publishing), and the trusted publisher was attached
    # afterwards — owner `thinkmorestupidless`, repository `ankka`, workflow `release.yml`,
    # environment `npm`, with `npm publish` allowed (a new configuration defaults to stage-only).
    # Node 24 because trusted publishing needs npm 11.5.1 or later, and Node 22 bundles 10.
    #
    # It waits for the publish job for the reason the Python job does: a release that never reached Maven
    # Central should not exist on npm either. A version can never be re-uploaded to npm, only superseded,
    # so the smoke test below is the last point at which a release can be withdrawn; the `npm view` guard
    # lets a re-run of the tag finish what a cancelled run left without a second upload.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/ankka
    permissions:
      contents: read
      id-token: write   # the OIDC token npm verifies
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Write the version, generate the stubs, build, pack
        working-directory: sdks/typescript
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version
          grep -q "\"version\": \"$version\"" package.json
          npm ci
          npm run proto
          grep -q "VERSION = \"$version\"" src/version.ts
          npm run build
          mkdir -p dist-pack && npm pack --pack-destination dist-pack
          ls -l dist-pack
          test -f "dist-pack/ankka-$version.tgz" || { echo "::error::the tarball is not versioned as the tag"; exit 1; }
      - name: The tarball installs on its own and is the release it claims to be
        working-directory: sdks/typescript
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # An empty project with only the tarball and its declared dependencies: no checkout on the path,
          # so a file the tarball does not carry or a dependency package.json does not declare fails here
          # rather than on a user's first `npm install ankka`.
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke" && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/sdks/typescript/dist-pack/ankka-$version.tgz" --no-save --ignore-scripts
          node --input-type=module -e "import { VERSION } from 'ankka'; import 'ankka/testkit'; if (VERSION !== '$version') { console.error('VERSION is', VERSION); process.exit(1) } console.log('ankka', VERSION)"
      - name: Publish, unless this version is already on npm
        working-directory: sdks/typescript
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if npm view "ankka@$version" version >/dev/null 2>&1; then
            echo "ankka@$version is already on npm; nothing to publish"
            exit 0
          fi
          # `./`, not a bare relative path: npm reads `dist-pack/ankka-0.6.0.tgz` as the GitHub shorthand
          # `owner/repo` and runs `git ls-remote ssh://git@github.com/dist-pack/…`, which the runner answers
          # with "Permission denied (publickey)" — v0.6.0's first run failed on exactly that, having never
          # reached npm. A spec is a file only when it starts with `./`, `../`, `/` or `~/`.
          npm publish "./dist-pack/ankka-$version.tgz" --access public

  sdk-rust:
    # The Rust crate to crates.io, as `ankka`: https://crates.io/crates/ankka. Its version is `version` in
    # sdks/rust/ankka/Cargo.toml — 0.0.0 in the tree, written here from the tag by the same rule as the
    # other SDKs — and the crate reports `env!("CARGO_PKG_VERSION")` in discovery, so the version a module
    # declares is the one on crates.io. The crate carries its own copy of the protocol, checked here
    # against this commit's `protocol/` as the ci job checks it.
    #
    # No token of the repository's: crates.io trusts this workflow directly (trusted publishing,
    # OIDC, exchanged for a short-lived token by rust-lang/crates-io-auth-action), the same shape as
    # the PyPI and npm jobs. Like npm, crates.io attaches a trusted publisher only to a crate that
    # exists: the FIRST publish of `ankka` is made by hand after that tag's `publish` job succeeds
    # (.claude/rules/build-and-release.md, Publishing), and the publisher is configured afterwards —
    # owner `thinkmorestupidless`, repository `ankka`, workflow `release.yml`, environment
    # `crates-io`.
    #
    # It waits for the publish job for the reason the other SDK jobs do. A version can never be re-uploaded
    # to crates.io, only yanked, so the isolated build below is the last point at which a release can be
    # withdrawn; the crates.io guard lets a re-run of the tag finish what a cancelled run left.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: crates-io
      url: https://crates.io/crates/ankka
    permissions:
      contents: read
      id-token: write   # the OIDC token crates.io verifies
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Write the version, and check the protocol copy is this commit's
        working-directory: sdks/rust
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \"0.0.0\"/version = \"$version\"/" ankka/Cargo.toml
          grep -q "^version = \"$version\"" ankka/Cargo.toml || { echo "::error::the crate's version was not written"; exit 1; }
          diff -r ../../protocol/src/main/protobuf ankka/protocol/src/main/protobuf
          diff -r ../../protocol/fixtures ankka/protocol/fixtures
          diff ../../protocol/ENCODING.md ankka/protocol/ENCODING.md
          diff ../../protocol/WASM-ABI.md ankka/protocol/WASM-ABI.md
      - name: Test, package, and build the package alone for the WebAssembly target
        working-directory: sdks/rust
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo test -p ankka
          cargo package -p ankka --allow-dirty
          mkdir "$RUNNER_TEMP/crate" && tar -xzf "target/package/ankka-$version.crate" -C "$RUNNER_TEMP/crate"
          (cd "$RUNNER_TEMP/crate/ankka-$version" && cargo build --target wasm32-unknown-unknown)
      - name: Is this version already on crates.io?
        id: published
        # crates.io's API, not `cargo info`: inside the workspace `cargo info` answers from the local
        # package, which the first step has just given this very version, so it reported every release
        # as already published and nothing was ever uploaded. Anything but a 200 or a 404 fails the job
        # rather than guessing.
        run: |
          version="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'ankka release (github.com/thinkmorestupidless/ankka)' \
            "https://crates.io/api/v1/crates/ankka/$version" || true)
          case "$code" in
            200) echo "ankka@$version is already on crates.io; nothing to publish"
                 echo "already=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "already=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "::error::crates.io answered $code for ankka@$version"; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.already == 'false'
        id: auth
      - name: Publish
        if: steps.published.outputs.already == 'false'
        working-directory: sdks/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p ankka --allow-dirty

  console-package:
    # The console as a package, `ankka-console` on npm: the client, sign-in and sessions, and the pages
    # a React Router host mounts (feature 017). Its version is the platform's, written from the tag as
    # every other placeholder is, so a product built on it pins the release its installation runs.
    #
    # Trusted publishing, exactly as the TypeScript SDK: the FIRST publish of `ankka-console` is by
    # hand, after that tag's `publish` job succeeds (.claude/rules/build-and-release.md,
    # Publishing), and the trusted publisher — repository `ankka`, workflow `release.yml`,
    # environment `npm` — is attached afterwards.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/ankka-console
    permissions:
      contents: read
      id-token: write   # the OIDC token npm verifies
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Write the version, build, pack
        working-directory: console
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version -w package
          grep -q "\"version\": \"$version\"" package/package.json
          npm ci
          npm run build -w package
          mkdir -p package/dist-pack && (cd package && npm pack --pack-destination dist-pack)
          test -f "package/dist-pack/ankka-console-$version.tgz" || { echo "::error::the tarball is not versioned as the tag"; exit 1; }
      - name: The tarball installs on its own and every entry point imports
        working-directory: console
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke" && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/console/package/dist-pack/ankka-console-$version.tgz" react-router@^8.4.0 @react-router/node@^8.4.0 react@^19 react-dom@^19 --no-save --ignore-scripts
          node --input-type=module -e "await import('ankka-console'); const s = await import('ankka-console/server'); await import('ankka-console/client'); await import('ankka-console/testing'); console.log('ankka-console', s.consoleRoutes().length, 'routes')"
      - name: Publish, unless this version is already on npm
        working-directory: console/package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if npm view "ankka-console@$version" version >/dev/null 2>&1; then
            echo "ankka-console@$version is already on npm; nothing to publish"
            exit 0
          fi
          npm publish "./dist-pack/ankka-console-$version.tgz" --access public

  docs:
    # The documentation site — pages, llms.txt, llms-full.txt, raw Markdown per page and
    # docs-index.json — for the release just tagged, to GitHub Pages. Needs Pages enabled on the
    # repository with "GitHub Actions" as its source, a one-time setting. It waits for the publish
    # job because a release that never reached Maven Central should not be documented as released.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv run --project tools/docs docs build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/docs-site
      - id: deploy
        uses: actions/deploy-pages@v5
