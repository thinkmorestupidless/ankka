# Scala Steward's settings for this repository, read by `.github/workflows/scala-steward.yml`.
# Versions live in `project/Dependencies.scala`, `project/plugins.sbt` and `project/build.properties`;
# the Pekko line is the family's, so a Pekko bump lands here first and is mirrored downstream.

# One pull request a week per group, rebased only when it no longer merges.
pullRequests.frequency = "7 days"
updatePullRequests = "on-conflicts"
pullRequests.customLabels = [ "dependencies", "scala" ]

# Commit messages and titles are Conventional Commits, `build(deps): ...`, like every commit here;
# the group titles below carry the same header.
commits.message = "build(deps): update ${artifactName} to ${nextVersion}"

# Pekko checks at startup that each family (actor, http, ...) is on one version, so a family moves
# in one pull request or not at all. jackson must match the databind fabric8 resolves (see `V.jackson`),
# so the two move together. scalafmt comes alone, because Steward reformats the tree with it. The
# rest is batched when it is a minor or patch update; a major update of anything outside the groups
# above matches no group and gets a pull request of its own, so one breaking change cannot hold up
# the routine ones.
pullRequests.grouping = [
  { name = "pekko", title = "build(deps): pekko updates", filter = [ { group = "org.apache.pekko" } ] },
  { name = "fabric8-jackson", title = "build(deps): fabric8 and jackson updates", filter = [ { group = "io.fabric8" }, { group = "com.fasterxml.jackson*" } ] },
  { name = "grpc", title = "build(deps): grpc and scalapb updates", filter = [ { group = "io.grpc" }, { group = "com.thesamet*" } ] },
  { name = "scalafmt", title = "build(deps): scalafmt update", filter = [ { group = "org.scalameta", artifact = "scalafmt-core" } ] },
  { name = "all", title = "build(deps): dependency updates", filter = [ { version = "minor" }, { version = "patch" } ] }
]

updates.pin = [
  # The 2.0.0 milestones pull a different Pekko; see `V.pekkoMgmt`.
  { groupId = "org.apache.pekko", artifactId = "pekko-management", version = "1." },
  { groupId = "org.apache.pekko", artifactId = "pekko-management-cluster-http", version = "1." },
  { groupId = "org.apache.pekko", artifactId = "pekko-management-cluster-bootstrap", version = "1." },
  { groupId = "org.apache.pekko", artifactId = "pekko-discovery-kubernetes-api", version = "1." },
  # 0.11 is ScalaPB's Scala 3 line, on protobuf-java 3.25 with grpc-java; see `V.grpc`.
  { groupId = "com.thesamet.scalapb", version = "0.11." },
  # fabric8 8 is on Jackson 3 (`tools.jackson`), and the build is on Jackson 2 with the Scala module
  # `V.jackson` matches to fabric8's databind; moving is a migration of its own (#141).
  { groupId = "io.fabric8", version = "7." },
  # sbt 2 is a migration, not an update.
  { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." }
]
