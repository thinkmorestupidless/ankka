version = "3.9.4"
runner.dialect = scala3
maxColumn = 100
align.preset = more
docstrings.style = Asterisk
# SortModifiers is deliberately absent: it rewrites `private[nakka] final` to
# `final private[nakka]`, which is scalafmt's canonical order but reads worse, and it
# churned 99 declarations for no benefit.
rewrite.rules = [RedundantBraces, RedundantParens]
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = false
