version = "3.11.5"
runner.dialect = scala3
maxColumn = 100
align.preset = more
docstrings.style = Asterisk
# SortModifiers is deliberately absent: it rewrites `private[ankka] final` to
# `final private[ankka]`, which is scalafmt's canonical order but reads worse, and it
# churned 99 declarations for no benefit.
rewrite.rules = [RedundantBraces, RedundantParens]
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = false
# The CLI's templates are rendered into other builds: a project's sbt plugin is Scala 2.12 for sbt 1,
# which the Scala 3 rewrites above would break.
fileOverride {
  "glob:**/cli/src/main/templates/project/project/**" {
    runner.dialect = scala212
    rewrite.scala3.convertToNewSyntax = false
    rewrite.rules = []
  }
}
