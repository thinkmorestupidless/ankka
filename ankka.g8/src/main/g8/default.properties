# Parameters of the ankka service template. Expand with
#   sbt new thinkmorestupidless/ankka.g8 --name=orders
# or, with the CLI on PATH, `ankka init orders`.
#
# `ankka_version` is the platform version this template was released with: the artifact version
# the generated build resolves AND the runtime version the generated descriptor declares — one
# parameter, two places, so they cannot drift. Rewritten from the build's version by the
# `templateVersion` task on every release; `ankka init` passes its own version instead. Do not edit
# it by hand.
name=my-service
package=com.example.$name;format="word,lower"$
ankka_version=0.0.0
description=An ankka service
