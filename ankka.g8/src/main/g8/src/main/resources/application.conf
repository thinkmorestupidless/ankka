# Your service's configuration. Anything here sits above ankka's defaults (ankka-runtime's
# reference.conf, which documents every key) and above the platform's cluster overlay, so it wins.
#
# Nothing is needed to start. The database defaults to localhost:5432, ankka/ankka/ankka — what
# docker-compose.yml starts — and in an ankka deployment the platform sets ANKKA_DB_HOST,
# ANKKA_DB_PORT, ANKKA_DB_NAME, ANKKA_DB_USER and ANKKA_DB_PASSWORD from the database it provisioned.
# To point a local run elsewhere, set those variables rather than editing keys here.
#
# The HTTP port defaults to 9000 and is set by ANKKA_HTTP_PORT; the platform sets that too.

# The service's name for a local run: each view or consumer that reads a topic does so under a
# consumer group named for it, so two services on one broker never share one. A deployed service's
# name comes from the platform, and this key is not read there.
ankka.service.name = "$name;format="norm"$"
