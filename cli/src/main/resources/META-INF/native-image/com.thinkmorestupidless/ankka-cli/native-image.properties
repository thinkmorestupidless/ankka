# How `native-image` builds the ankka CLI, read from the jar by any native build of it.
#
# --no-fallback: an image that cannot be built fails, rather than producing a JVM launcher in disguise.
# --enable-url-protocols: java.net.http is the CLI's only HTTP client, and native images carry no
#   protocol handlers unless asked.
# -march=compatibility: the default x64 target needs AVX2, and a binary for anyone's machine cannot.
# -Dsun.misc.unsafe.memory.access=allow: Scala 3's lazy vals use sun.misc.Unsafe, and a JDK 24+ base
#   otherwise prints a deprecation warning on every command.
Args = --no-fallback \
       --enable-url-protocols=https,http \
       -march=compatibility \
       -Dsun.misc.unsafe.memory.access=allow
