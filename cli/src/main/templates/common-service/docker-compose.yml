# Everything {{name}} needs to run on this machine except itself: Postgres, and the ankka sidecar
# that owns the journal, the views, HTTP and the rest, and dials your process on port 9010 — or, for
# a service built to a WebAssembly module, the same runtime with the module loaded into it.
#
#   docker compose up -d        # then start your process; the service answers on localhost:9000
#   docker compose up -d runtime   # a module instead: no process, the service answers on :9000
#
# The sidecar is the one published with this project's ankka version, pulled from ghcr.io on first
# use; set ANKKA_SIDECAR_IMAGE to run another. The database schema comes out of that same image, so it
# always matches the sidecar that uses it. Postgres applies its init directory only to an empty
# volume: after changing the sidecar's version, `docker compose down -v`.
services:
  # Copies the schema out of the sidecar image into a volume Postgres initialises from, then exits.
  schema:
    image: ${ANKKA_SIDECAR_IMAGE:-ghcr.io/thinkmorestupidless/ankka-sidecar:{{ankka_version}}}
    user: root
    entrypoint: ["sh", "-c", "cp -R /opt/docker/ddl/. /ddl/ && chmod -R a+rX /ddl"]
    volumes:
      - ddl:/ddl

  postgres:
    image: postgres:17-alpine
    depends_on:
      schema:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ankka
      POSTGRES_PASSWORD: ankka
      POSTGRES_DB: ankka
    ports:
      - "5432:5432"
    volumes:
      - ddl:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ankka -d ankka"]
      interval: 5s
      timeout: 5s
      retries: 20

  sidecar:
    image: ${ANKKA_SIDECAR_IMAGE:-ghcr.io/thinkmorestupidless/ankka-sidecar:{{ankka_version}}}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Your process, on the host. extra_hosts is what makes the name resolve on Linux; Docker
      # Desktop provides it anyway.
      ANKKA_PROCESS_ADDRESS: host.docker.internal:9010
      ANKKA_SIDECAR_BIND: 0.0.0.0
      ANKKA_HTTP_PORT: "9000"
      ANKKA_DB_HOST: postgres
      ANKKA_DB_PORT: "5432"
      ANKKA_DB_NAME: ankka
      ANKKA_DB_USER: ankka
      ANKKA_DB_PASSWORD: ankka
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9000:9000"
      # The port your process calls back on, published on loopback only.
      - "127.0.0.1:9011:9011"

  # For a Rust service, built to a WebAssembly module: the same image loads the module into itself
  # instead of dialling a process. Started by name, `docker compose up -d runtime`, which starts
  # Postgres with it and not the sidecar above; `cargo module` builds what it loads.
  runtime:
    profiles: ["wasm"]
    image: ${ANKKA_SIDECAR_IMAGE:-ghcr.io/thinkmorestupidless/ankka-sidecar:{{ankka_version}}}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANKKA_WASM_MODULE: /module/service.wasm
      ANKKA_HTTP_PORT: "9000"
      ANKKA_DB_HOST: postgres
      ANKKA_DB_PORT: "5432"
      ANKKA_DB_NAME: ankka
      ANKKA_DB_USER: ankka
      ANKKA_DB_PASSWORD: ankka
    ports:
      - "9000:9000"
    # Refused, naming the file, until `cargo module` has built it: otherwise Docker would create a
    # directory where the module goes, and the next `cargo module` could not write the module there.
    volumes:
      - type: bind
        source: ./target/wasm32-unknown-unknown/release/{{module_snake}}.wasm
        target: /module/service.wasm
        read_only: true
        bind:
          create_host_path: false

volumes:
  ddl:
  pgdata:
