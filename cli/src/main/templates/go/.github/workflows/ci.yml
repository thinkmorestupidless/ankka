# Vet and test on every push and pull request. Needs no secrets, so it is green from the first push,
# before anything about a control plane has been configured.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # `go mod verify` checks the downloaded modules against go.sum: commit the go.sum `go mod tidy` wrote.
      - run: go mod verify
      - run: go vet ./...
      # ANKKA_SLOW=1 runs the integration test too: it starts Postgres and the published sidecar through
      # testcontainers, which a GitHub-hosted runner can do, since Docker is already there.
      - run: go test ./...
        env:
          ANKKA_SLOW: "1"

  # Every commit of a pull request, and its title, is a Conventional Commit: the check the commit-msg
  # hook makes, for a clone that did not enable it. The title matters because the squash merge makes
  # it the commit on main. README.md, "Commits and pull requests", says what to write.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: .githooks/check-commits "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
