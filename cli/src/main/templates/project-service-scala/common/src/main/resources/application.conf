# {{service}}'s configuration. Anything here sits above ankka's defaults (ankka-runtime's
# reference.conf, which documents every key) and above the platform's cluster overlay, so it wins.
#
# Nothing is needed to start. `scripts/run.sh {{service}}` at the project's root gives this service
# its own database, `{{service}}`, in the project's Postgres, its HTTP port from service.json and the
# project's Kafka. In an ankka deployment the platform sets every ANKKA_* variable instead.

# The service's name for a local run: the local console lists it under this name, another service of
# the project finds it by it, and each view or consumer that reads a topic does so under a consumer
# group named for it. A deployed service's name comes from the platform, and this key is not read there.
ankka.service.name = "{{service}}"
