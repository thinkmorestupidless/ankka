[project]
name = "{{name}}"
version = "0.1.0"
description = "An ankka service."
requires-python = ">=3.12"
# The ankka SDK at the version of the platform this project was created for. Move it together with
# `runtime` in service.json — see README.md, "Upgrading ankka".
dependencies = ["ankka=={{ankka_version}}"]

[dependency-groups]
dev = [
  "ankka[testkit]=={{ankka_version}}",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{module}}"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
