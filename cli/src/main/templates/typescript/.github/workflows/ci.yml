# Type-check and test on every push and pull request. Needs no secrets, so it is green from the first
# push — before anything about a control plane has been configured.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # `npm ci` installs exactly what package-lock.json names; commit the lockfile `npm install` wrote.
      - run: npm ci
      - run: npm run typecheck
      # The integration test needs the sidecar image; where it is not available it is reported as
      # skipped, with the reason, rather than failing.
      - run: npm test
