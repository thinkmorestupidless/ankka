# Type-check, test and build on every push and pull request. Needs no secrets, so it is green from the
# first push — before anything about a control plane has been configured.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      # `npm ci` installs exactly what package-lock.json names; commit the lockfile `npm install` wrote.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Every commit of a pull request, and its title, is a Conventional Commit: the check the commit-msg
  # hook makes, for a clone that did not enable it. The title matters because the squash merge makes
  # it the commit on main. README.md, "Commits and pull requests", says what to write.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: .githooks/check-commits "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
