# Defaults for the nakka control plane.
#
# The control plane is an ordinary nakka application, so everything in nakka-runtime's
# reference.conf applies unchanged — this file only adds what is specific to it.

nakka.controlplane {
  # The shared bearer token the API requires.
  #
  # Deliberately empty, which makes startup fail rather than serve a cluster-wide delete
  # API to anyone who can reach the port. Set it, or pass an Acl explicitly when
  # assembling the service.
  auth.token = ""
  auth.token = ${?NAKKA_CONTROLPLANE_TOKEN}

  kubernetes {
    # Services are deployed into "{namespace-prefix}-{projectId}", one namespace per
    # project. Replaces an earlier single `namespace` key, which declared one namespace
    # for every service and so could not isolate projects from each other.
    #
    # This MUST match the operator's nakka.operator.namespace-prefix.
    namespace-prefix = "nakka"
    namespace-prefix = ${?NAKKA_K8S_NAMESPACE_PREFIX}

    # How often every service is re-projected and swept for drift. A desired-state
    # change does not wait for this — a consumer on the service journal projects
    # immediately; this is the backstop.
    sweep-interval = 30s

    # Backoff after a failed projection, per service.
    retry-min-backoff = 5s
    retry-max-backoff = 2m

    # Carried into the resource as spec.progressDeadlineSeconds, so Kubernetes owns the
    # not-progressing clock and the control plane does not run a second one that could
    # disagree with it.
    progress-deadline = 10m

    # Whether to refuse to start when the cluster is unreachable.
    #
    # Off, deliberately. Recording intent durably is the control plane's job, and an
    # apply has to succeed when the cluster is down — that is the whole reason desired
    # state is persisted separately from acting on it.
    fail-fast-on-unreachable-cluster = false
  }
}
