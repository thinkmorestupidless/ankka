# Defaults for the ankka control plane.
#
# The control plane is an ordinary ankka application, so everything in ankka-runtime's
# reference.conf applies unchanged — this file only adds what is specific to it.

# How soon a node sees what another node wrote (feature 013).
#
# Every control plane node replays the deploy token journal into its own memory so that its ACL
# can verify a token without touching the database, and then *follows* that journal. A live
# `eventsBySlices` query polls, so a revocation reaches other nodes one poll after it is written:
# measured at p50 3,021ms under the 3s default, which is a long time for a credential someone has
# just taken away.
#
# This is the polling knob, and NOT `behind-current-time` — the guard against reading events whose
# commit timestamp is still in flight, which .claude/rules/runtime.md records as never to be tuned
# down (it made a suite 15x slower and it protects correctness, not latency). Shortening the poll
# costs more queries from every live stream this process runs: the token index and the three listing
# views. The control plane's journal is tenancy changes rather than traffic, so six times almost
# nothing is still almost nothing.
#
# The node that handled the revoke does not wait for any of this: its endpoint evicts the token
# from its own index write-through, so `revoke` followed by a call on the same node is refused
# immediately whatever this is set to.
pekko.persistence.r2dbc.refresh-interval = 500ms

ankka.controlplane {
  # Who may call the API: holders of an OpenID Connect access token issued by the installation's
  # own identity provider (Keycloak, feature 008). There is no shared token any more and no
  # compatibility mode for one — a secret shared by everyone who operates a platform is not
  # identity, and the control plane's journal is only an audit trail once every write has an actor.
  auth {
    # The issuer a token's `iss` must equal: https://auth.<base domain>[:<port>]/realms/ankka.
    # Deliberately empty, which makes startup fail rather than serve a cluster-wide delete API
    # to anyone who can reach the port.
    issuer = ""
    issuer = ${?ANKKA_AUTH_ISSUER}

    # Where the realm's signing keys are fetched from. Differs from the issuer inside a cluster:
    # tokens name the external, TLS, gateway-routed address, while keys are read over the plain
    # in-cluster service address with no certificate to trust. Empty means
    # <issuer>/protocol/openid-connect/certs.
    jwks-url = ""
    jwks-url = ${?ANKKA_AUTH_JWKS_URL}

    # The authority the key fetch trusts, and nothing else (feature 014): in a cluster the identity
    # provider serves its in-cluster address over TLS with a certificate from the installation's
    # service authority, and this names that authority's root. Empty means the JVM's own trust
    # store — right for a public issuer, and for the compose Keycloak's plain HTTP.
    jwks-ca = ""
    jwks-ca = ${?ANKKA_AUTH_JWKS_CA}

    # The audience a token must carry — the `ankka-controlplane` client scope in the realm puts it
    # there for every client meant for this API, so adding a CI client is a Keycloak operation only.
    audience = "ankka-controlplane"
    audience = ${?ANKKA_AUTH_AUDIENCE}

    # The public client `ankka login` uses; advertised by GET /auth so the CLI needs no new setting.
    client-id = "ankka-cli"
    client-id = ${?ANKKA_AUTH_CLIENT_ID}

    # The realm named in the WWW-Authenticate challenge.
    realm-hint = "ankka"

    # Tolerance on exp/nbf for clocks that disagree a little.
    clock-skew = 60s
  }

  organizations {
    # Who may create an organization: "open" — anyone logged in, who becomes its first owner — or
    # "platform-admin", holders of the platform-admin realm role only. A hosted installation sets
    # the latter, so that a registered user cannot create a tenancy past the product's checkout:
    # the product's own service account, an administrator, creates one for them. Nothing else
    # changes with this setting; every other route answers as it does when it is open.
    creation = "open"
    creation = ${?ANKKA_ORGANIZATION_CREATION}

    # Where a refused caller is sent, appended to the refusal as "; sign up at <url>". Empty means
    # the refusal names no address. Unused when creation is open.
    signup-url = ""
    signup-url = ${?ANKKA_SIGNUP_URL}
  }

  # What a topic's first declaration is given for a setting it leaves out, and the bounds every
  # declaration is checked against (TopicPolicy). The shipped values are a laptop's: an installation
  # serving long-lived facts raises default-retention and longest-retention before its first topic
  # is declared, since a change here changes no topic already declared. Durations are <n>ms|s|m|h|d,
  # sizes <n>B|KiB|MiB|GiB|TiB; "everything" keeps every message, "none" sets no limit. The
  # three-node broker component sets default-copies to 3 and default-min-in-sync to 2.
  topics {
    default-retention = "7d"
    default-retention = ${?ANKKA_TOPIC_DEFAULT_RETENTION}
    default-retention-size = "none"
    default-retention-size = ${?ANKKA_TOPIC_DEFAULT_RETENTION_SIZE}
    default-cleanup = "delete"
    default-cleanup = ${?ANKKA_TOPIC_DEFAULT_CLEANUP}
    default-tombstone-window = "1d"
    default-tombstone-window = ${?ANKKA_TOPIC_DEFAULT_TOMBSTONE_WINDOW}
    default-min-compaction-lag = "0s"
    default-min-compaction-lag = ${?ANKKA_TOPIC_DEFAULT_MIN_COMPACTION_LAG}
    default-max-compaction-lag = "none"
    default-max-compaction-lag = ${?ANKKA_TOPIC_DEFAULT_MAX_COMPACTION_LAG}
    default-copies = 1
    default-copies = ${?ANKKA_TOPIC_DEFAULT_COPIES}
    default-min-in-sync = 1
    default-min-in-sync = ${?ANKKA_TOPIC_DEFAULT_MIN_IN_SYNC}
    longest-retention = "everything"
    longest-retention = ${?ANKKA_TOPIC_LONGEST_RETENTION}
    largest-retention-size = "none"
    largest-retention-size = ${?ANKKA_TOPIC_LARGEST_RETENTION_SIZE}
    most-copies = 3
    most-copies = ${?ANKKA_TOPIC_MOST_COPIES}
    # A view reading a topic that keeps less than this is warned in its service's status.
    warning-threshold = "30d"
    warning-threshold = ${?ANKKA_TOPIC_WARNING_THRESHOLD}
  }

  kubernetes {
    # Services are deployed into "{namespace-prefix}-{projectId}", one namespace per
    # project. Replaces an earlier single `namespace` key, which declared one namespace
    # for every service and so could not isolate projects from each other.
    #
    # This MUST match the operator's ankka.operator.namespace-prefix.
    namespace-prefix = "ankka"
    namespace-prefix = ${?ANKKA_K8S_NAMESPACE_PREFIX}

    # How often every service is re-projected and swept for drift. A desired-state
    # change does not wait for this — a consumer on the service journal projects
    # immediately; this is the backstop.
    sweep-interval = 30s

    # Backoff after a failed projection, per service.
    retry-min-backoff = 5s
    retry-max-backoff = 2m

    # Carried into the resource as spec.progressDeadlineSeconds, so Kubernetes owns the
    # not-progressing clock and the control plane does not run a second one that could
    # disagree with it.
    progress-deadline = 10m

    # Whether to refuse to start when the cluster is unreachable.
    #
    # Off, deliberately. Recording intent durably is the control plane's job, and an
    # apply has to succeed when the cluster is down — that is the whole reason desired
    # state is persisted separately from acting on it.
    fail-fast-on-unreachable-cluster = false

    # The domain every exposed service's hostname sits under: <service>-<project>.<base-domain>,
    # with the control plane itself at api.<base-domain>. Unset means nothing can be exposed, and
    # `services expose` says so. Must match the operator's ANKKA_BASE_DOMAIN — the operator
    # derives the same hostname to render the route (feature 005).
    base-domain = ""
    base-domain = ${?ANKKA_BASE_DOMAIN}

    # The port clients reach HTTPS on, for the URL `services expose` prints. 443 is omitted from
    # the URL; anything else (kind publishes the gateway on 8443) is appended.
    https-port = 443
    https-port = ${?ANKKA_HTTPS_PORT}
  }
}
