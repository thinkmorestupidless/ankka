# Local persistence for the ankka runtime — event journal, snapshots, durable state, view row tables
# and projection offsets — and, for the control plane, the identity provider it verifies callers
# against (feature 008).
services:
  postgres:
    image: postgres:17-alpine
    container_name: ankka-postgres
    environment:
      POSTGRES_USER: ankka
      POSTGRES_PASSWORD: ankka
      POSTGRES_DB: ankka
    ports:
      - "5432:5432"
    volumes:
      # Canonical DDL, shared with the test kit via the runtime's classpath.
      - ./modules/runtime/src/main/resources/ankka/ddl:/docker-entrypoint-initdb.d:ro
      - ankka-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ankka -d ankka"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Keycloak in development mode, with the platform's realm imported from the same file the
  # Keycloak operator imports in a cluster (kustomization/components/keycloak/realm-import.json —
  # one copy, so keycloak-realm below takes the realm out of the resource with jq). Port 8081 on
  # the host so it never collides with a service on 8080. Point the control plane at it:
  #
  #   ANKKA_AUTH_ISSUER=http://localhost:8081/realms/ankka sbt controlPlane/run
  #   ankka config set url http://localhost:9000
  #   ankka login                       # user dev, password dev (created by keycloak-init below)
  #
  # The version is build.sbt's keycloakVersion; RemoteOverlaySuite checks the two agree.
  # Takes the realm out of the import resource for Keycloak's import directory. Alpine plus jq
  # from its package index, because the Keycloak image carries no JSON tool and there is no
  # official jq image to pin; the package is a few hundred kilobytes, fetched on every `up`.
  keycloak-realm:
    image: alpine:3.22
    container_name: ankka-keycloak-realm
    volumes:
      - ./kustomization/components/keycloak/realm-import.json:/realm-import.json:ro
      - ankka-keycloak-import:/import
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache --quiet jq && jq .spec.realm /realm-import.json > /import/ankka-realm.json

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: ankka-keycloak
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-realm:
        condition: service_completed_successfully
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
    ports:
      - "8081:8080"
    # No volume for Keycloak's embedded database, deliberately: a named volume arrives root-owned
    # and Keycloak runs unprivileged, so it could not create its files. Development mode needs
    # nothing kept — the realm is re-imported and keycloak-init re-creates the user on every start.
    volumes:
      - ankka-keycloak-import:/opt/keycloak/data/import:ro
    healthcheck:
      # The realm answering is the whole readiness story: the import ran and the server is up.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/ankka HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 60

  # The development user, created after import rather than shipped in the realm: the realm file
  # carries no users at all, so a remote installation cannot inherit one (research R2). Runs once,
  # idempotently, and exits.
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: ankka-keycloak-init
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cd /opt/keycloak/bin
        ./kcadm.sh config credentials --server http://keycloak:8080 --realm master --user admin --password admin
        if ./kcadm.sh get users -r ankka -q username=dev -q exact=true | grep -q '"username" : "dev"'; then
          echo "user dev already exists"
        else
          ./kcadm.sh create users -r ankka -s username=dev -s email=dev@example.test -s emailVerified=true -s firstName=Dev -s lastName=User -s enabled=true
          ./kcadm.sh set-password -r ankka --username dev --new-password dev
          ./kcadm.sh add-roles -r ankka --uusername dev --rolename platform-admin
          echo "created user dev (password dev, platform-admin)"
        fi

  # The sidecar for a service written in another language (feature 009), under a profile so
  # `docker compose up` alone is unchanged:
  #
  #   docker compose --profile polyglot up -d
  #   uv run --directory sdks/python python -m examples.shopping_cart.main   # or any process on 9010
  #   curl localhost:9000/carts/c1
  #
  # It dials the developer's process on the host at 9010 through host.docker.internal (the
  # extra_hosts line is what Linux needs; Docker Desktop provides the name anyway). The callback
  # port is published on the host's loopback only, which is the same guarantee the sidecar gives
  # in a pod by binding loopback itself.
  sidecar:
    profiles: ["polyglot"]
    image: ankka-sidecar:latest
    container_name: ankka-sidecar
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANKKA_PROCESS_ADDRESS: host.docker.internal:9010
      ANKKA_SIDECAR_BIND: 0.0.0.0
      ANKKA_HTTP_PORT: "9000"
      ANKKA_DB_HOST: postgres
      ANKKA_DB_PORT: "5432"
      ANKKA_DB_NAME: ankka
      ANKKA_DB_USER: ankka
      ANKKA_DB_PASSWORD: ankka
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9000:9000"
      - "127.0.0.1:9011:9011"

volumes:
  ankka-pgdata:
  # The realm as keycloak-realm rendered it; rewritten on every `up`, kept nowhere else.
  ankka-keycloak-import:
