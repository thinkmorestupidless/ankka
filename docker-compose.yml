# Local persistence for the ankka runtime: event journal, snapshots,
# durable state, view row tables, and projection offsets all live here.
services:
  postgres:
    image: postgres:17-alpine
    container_name: ankka-postgres
    environment:
      POSTGRES_USER: ankka
      POSTGRES_PASSWORD: ankka
      POSTGRES_DB: ankka
    ports:
      - "5432:5432"
    volumes:
      # Canonical DDL, shared with the test kit via the runtime's classpath.
      - ./modules/runtime/src/main/resources/ankka/ddl:/docker-entrypoint-initdb.d:ro
      - ankka-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ankka -d ankka"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ankka-pgdata:
