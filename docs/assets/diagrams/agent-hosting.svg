<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 560" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" aria-labelledby="title desc">
  <title id="title">Where an agent runs: Scala; Python or TypeScript; and Rust as a WebAssembly module</title>
  <desc id="desc">In Scala, the agent and the ankka runtime run in one JVM in one container: the agent's handler returns an effect describing the request, and the runtime runs the loop, calling the agent's tool and guardrail as ordinary method calls. In Python or TypeScript, the pod has two containers: your process, listening on loopback port 9010, and the runtime as a sidecar, listening on 9011. They speak protobuf over gRPC on loopback: the sidecar asks the process to Plan a request, InvokeTool and CheckGuardrail, and the process's tool calls other components through the sidecar's Client Invoke. In Rust, the pod has one container: the runtime, with your service's WebAssembly module loaded into its JVM. They speak the same protobuf messages across the module's memory, with no network: the runtime calls the module's exports ankka1_plan, ankka1_invoke_tool and ankka1_check_guardrail, and the tool calls other components through the ankka1 invoke import. In all three, only the runtime calls the model provider and writes to the service's Postgres.</desc>
