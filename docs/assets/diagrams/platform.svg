  <rect class="box" x="24" y="150" width="170" height="70" rx="8"/>
  <text class="title ink" x="109" y="178" text-anchor="middle">Developer</text>
  <text class="small muted" x="109" y="198" text-anchor="middle">ankka CLI · signed-in token</text>

  <rect class="box" x="24" y="262" width="170" height="70" rx="8"/>
  <text class="title ink" x="109" y="290" text-anchor="middle">CI job</text>
  <text class="small muted" x="109" y="310" text-anchor="middle">ankka CLI · deploy token</text>

  <rect class="box" x="24" y="585" width="170" height="70" rx="8"/>
  <text class="title ink" x="109" y="613" text-anchor="middle">Callers</text>
  <text class="small muted" x="109" y="633" text-anchor="middle">browsers, other systems</text>

  <!-- The cluster -->
  <rect class="cluster" x="240" y="40" width="940" height="850" rx="14"/>
  <text class="label muted" x="258" y="64">KUBERNETES CLUSTER</text>

  <!-- Gateway -->
  <rect class="ns" x="258" y="84" width="176" height="790" rx="10"/>
  <text class="small muted" x="346" y="104" text-anchor="middle">ankka-gateway</text>
  <rect class="box" x="272" y="114" width="148" height="746" rx="8"/>
  <text class="title ink" x="346" y="140" text-anchor="middle">Gateway</text>
  <text class="small muted" x="346" y="158" text-anchor="middle">Envoy Gateway</text>
  <text class="small muted" x="346" y="174" text-anchor="middle">TLS for *.&lt;base&gt;</text>
  <text class="small ink" x="412" y="233" text-anchor="end">auth.&lt;base&gt;</text>
  <text class="small ink" x="412" y="283" text-anchor="end">api.&lt;base&gt;</text>
  <text class="small ink" x="412" y="603" text-anchor="end">&lt;service&gt;-</text>
  <text class="small ink" x="412" y="618" text-anchor="end">&lt;project&gt;.&lt;base&gt;</text>

  <!-- Outside -> gateway -->
  <line class="line" x1="194" y1="185" x2="270" y2="185" marker-end="url(#a)"/>
  <text class="small muted" x="235" y="178" text-anchor="end">HTTPS</text>
  <line class="line" x1="194" y1="297" x2="270" y2="297" marker-end="url(#a)"/>
  <text class="small muted" x="235" y="290" text-anchor="end">HTTPS</text>
  <line class="line" x1="194" y1="620" x2="270" y2="620" marker-end="url(#a)"/>
  <text class="small muted" x="235" y="613" text-anchor="end">HTTPS</text>

  <!-- Keycloak -->
  <rect class="ns" x="454" y="84" width="306" height="100" rx="10"/>
  <text class="small muted" x="466" y="102">ankka-auth</text>
  <rect class="box" x="470" y="110" width="274" height="62" rx="8"/>
  <text class="title ink" x="607" y="136" text-anchor="middle">Keycloak</text>
  <text class="small muted" x="607" y="155" text-anchor="middle">who is a user · signs their tokens</text>

  <!-- Controllers strip -->
  <rect class="ns" x="780" y="84" width="380" height="100" rx="10"/>
  <text class="small muted" x="792" y="102">controllers the platform stands on</text>
  <rect class="box" x="794" y="110" width="84" height="62" rx="8"/>
  <text class="small ink" x="836" y="137" text-anchor="middle">Cloud</text>
  <text class="small ink" x="836" y="152" text-anchor="middle">NativePG</text>
  <rect class="box" x="886" y="110" width="84" height="62" rx="8"/>
  <text class="small ink" x="928" y="137" text-anchor="middle">cert-</text>
  <text class="small ink" x="928" y="152" text-anchor="middle">manager</text>
  <rect class="box" x="978" y="110" width="84" height="62" rx="8"/>
  <text class="small ink" x="1020" y="137" text-anchor="middle">Envoy</text>
  <text class="small ink" x="1020" y="152" text-anchor="middle">Gateway</text>
  <rect class="box" x="1070" y="110" width="76" height="62" rx="8"/>
  <text class="small ink" x="1108" y="137" text-anchor="middle">Keycloak</text>
  <text class="small ink" x="1108" y="152" text-anchor="middle">operator</text>

  <!-- Control plane namespace -->
  <rect class="ns" x="454" y="204" width="306" height="186" rx="10"/>
  <text class="small muted" x="466" y="222">ankka-controlplane</text>
  <rect class="hot" x="470" y="232" width="164" height="96" rx="8"/>
  <text class="title ink" x="552" y="258" text-anchor="middle">Control plane</text>
  <text class="small muted" x="552" y="277" text-anchor="middle">an ankka application</text>
  <text class="small muted" x="552" y="294" text-anchor="middle">desired state · who</text>
  <text class="small muted" x="552" y="310" text-anchor="middle">may do what</text>
  <rect class="box" x="648" y="232" width="96" height="96" rx="8"/>
  <text class="small ink" x="696" y="266" text-anchor="middle">Postgres</text>
  <text class="small muted" x="696" y="284" text-anchor="middle">its journal:</text>
  <text class="small muted" x="696" y="299" text-anchor="middle">the audit</text>
  <text class="small muted" x="696" y="314" text-anchor="middle">trail</text>
  <line class="line" x1="634" y1="280" x2="646" y2="280"/>

  <!-- gateway -> keycloak / control plane -->
  <line class="line" x1="420" y1="229" x2="468" y2="160" marker-end="url(#a)"/>
  <line class="line" x1="420" y1="279" x2="468" y2="279" marker-end="url(#a)"/>

  <!-- control plane verifies tokens against keycloak -->
  <line class="dash" x1="610" y1="230" x2="610" y2="174" marker-end="url(#m)"/>
  <text class="small muted" x="616" y="197">verifies tokens</text>

  <!-- Operator namespace -->
  <rect class="ns" x="780" y="204" width="380" height="186" rx="10"/>
  <text class="small muted" x="792" y="222">ankka-operator</text>
  <rect class="hot" x="820" y="232" width="300" height="96" rx="8"/>
  <text class="title ink" x="970" y="258" text-anchor="middle">Operator</text>
  <text class="small muted" x="970" y="277" text-anchor="middle">watches AnkkaService resources</text>
  <text class="small muted" x="970" y="294" text-anchor="middle">owns everything below them</text>
  <text class="small muted" x="970" y="310" text-anchor="middle">no entities, no journal, no cluster</text>

  <!-- Project namespace, with a second one behind it -->
  <rect class="ns" x="466" y="424" width="706" height="450" rx="10"/>
  <rect class="bg" x="454" y="414" width="706" height="450" rx="10"/>
  <rect class="ns" x="454" y="414" width="706" height="450" rx="10"/>
  <text class="small muted" x="632" y="432">ankka-checkout — one namespace per project</text>

  <!-- AnkkaService resources -->
  <rect class="hot" x="470" y="444" width="274" height="62" rx="8"/>
  <text class="title ink" x="607" y="469" text-anchor="middle">AnkkaService: one per service</text>
  <text class="small muted" x="607" y="489" text-anchor="middle">cart, orders, payments · spec in, status out</text>

  <!-- control plane -> resource -->
  <line class="line" x1="490" y1="330" x2="490" y2="442" marker-end="url(#a)"/>
  <text class="small ink" x="498" y="365">writes spec</text>
  <text class="small muted" x="498" y="380">(and the namespace)</text>
  <line class="dash" x1="620" y1="442" x2="620" y2="330" marker-end="url(#m)"/>
  <text class="small muted" x="628" y="365">reads status</text>

  <!-- operator <-> resource -->
  <path class="line" d="M 880 330 L 880 475 L 746 475" marker-end="url(#a)"/>
  <text class="small ink" x="752" y="467">writes status</text>
  <path class="dash" d="M 746 494 L 900 494 L 900 332" marker-end="url(#m)"/>
  <text class="small muted" x="752" y="510">watches</text>

  <!-- operator creates workloads -->
  <line class="line" x1="1040" y1="330" x2="1040" y2="524"/>
  <line class="line" x1="700" y1="524" x2="1054" y2="524"/>
  <line class="line" x1="700" y1="524" x2="700" y2="538" marker-end="url(#a)"/>
  <line class="line" x1="853" y1="524" x2="853" y2="538" marker-end="url(#a)"/>
  <line class="line" x1="1054" y1="524" x2="1054" y2="538" marker-end="url(#a)"/>
  <text class="small ink" x="1048" y="440">creates</text>
  <text class="small ink" x="1048" y="455">and owns</text>

  <!-- cart: Scala, three instances -->
  <rect class="deploy" x="470" y="540" width="274" height="160" rx="8"/>
  <text class="title ink" x="484" y="562">cart</text>
  <text class="small muted" x="520" y="562">Scala · Deployment of 3</text>
  <rect class="box" x="490" y="578" width="72" height="56" rx="6"/>
  <text class="small ink" x="526" y="603" text-anchor="middle">instance</text>
  <text class="small muted" x="526" y="620" text-anchor="middle">JVM</text>
  <rect class="box" x="571" y="578" width="72" height="56" rx="6"/>
  <text class="small ink" x="607" y="603" text-anchor="middle">instance</text>
  <text class="small muted" x="607" y="620" text-anchor="middle">JVM</text>
  <rect class="box" x="652" y="578" width="72" height="56" rx="6"/>
  <text class="small ink" x="688" y="603" text-anchor="middle">instance</text>
  <text class="small muted" x="688" y="620" text-anchor="middle">JVM</text>
  <path class="dash" d="M 526 636 L 526 648 L 688 648 L 688 636"/>
  <line class="dash" x1="607" y1="636" x2="607" y2="648"/>
  <text class="small muted" x="607" y="668" text-anchor="middle">one Pekko cluster:</text>
  <text class="small muted" x="607" y="684" text-anchor="middle">entities sharded by id</text>

  <!-- gateway -> cart -->
  <line class="line" x1="420" y1="606" x2="488" y2="606" marker-end="url(#a)"/>
  <text class="small muted" x="454" y="598" text-anchor="middle">route</text>

  <!-- orders: Python, app + sidecar -->
  <rect class="deploy" x="756" y="540" width="194" height="160" rx="8"/>
  <text class="title ink" x="770" y="562">orders</text>
  <text class="small muted" x="822" y="562">Python · 1 pod</text>
  <rect class="box" x="771" y="578" width="164" height="40" rx="6"/>
  <text class="small ink" x="853" y="595" text-anchor="middle">your process</text>
  <text class="small muted" x="853" y="610" text-anchor="middle">handlers, tools</text>
  <rect class="box" x="771" y="636" width="164" height="48" rx="6"/>
  <text class="small ink" x="853" y="655" text-anchor="middle">sidecar: the runtime</text>
  <text class="small muted" x="853" y="672" text-anchor="middle">journal, cluster, HTTP</text>
  <line class="line" x1="853" y1="620" x2="853" y2="634"/>
  <text class="small muted" x="859" y="631">gRPC</text>

  <!-- payments: Rust, a WebAssembly module in the runtime -->
  <rect class="deploy" x="962" y="540" width="184" height="160" rx="8"/>
  <text class="title ink" x="976" y="562">payments</text>
  <text class="small muted" x="1048" y="562">Rust · 1 pod</text>
  <rect class="box" x="972" y="578" width="164" height="40" rx="6"/>
  <text class="small ink" x="1054" y="595" text-anchor="middle">init: your image</text>
  <text class="small muted" x="1054" y="610" text-anchor="middle">copies in service.wasm</text>
  <rect class="box" x="972" y="636" width="164" height="48" rx="6"/>
  <text class="small ink" x="1054" y="655" text-anchor="middle">the runtime</text>
  <text class="small muted" x="1054" y="672" text-anchor="middle">your module in its JVM</text>
  <line class="line" x1="1054" y1="620" x2="1054" y2="634" marker-end="url(#a)"/>
  <text class="small muted" x="1063" y="631">emptyDir</text>

  <!-- project Postgres, one database per service -->
  <rect class="box" x="470" y="724" width="676" height="92" rx="8"/>
  <rect class="bg" x="537" y="740" width="140" height="30" rx="5"/>
  <rect class="deploy" x="537" y="740" width="140" height="30" rx="5"/>
  <text class="small ink" x="607" y="760" text-anchor="middle">database: cart</text>
  <rect class="bg" x="783" y="740" width="140" height="30" rx="5"/>
  <rect class="deploy" x="783" y="740" width="140" height="30" rx="5"/>
  <text class="small ink" x="853" y="760" text-anchor="middle">database: orders</text>
  <rect class="bg" x="984" y="740" width="140" height="30" rx="5"/>
  <rect class="deploy" x="984" y="740" width="140" height="30" rx="5"/>
  <text class="small ink" x="1054" y="760" text-anchor="middle">database: payments</text>
  <text class="title ink" x="808" y="796" text-anchor="middle">Postgres ankka-db <tspan class="small muted" font-weight="400">· CloudNativePG · each service its own database · mutual TLS · certificate login</tspan></text>

  <!-- services -> their databases -->
  <line class="line" x1="607" y1="700" x2="607" y2="738" marker-end="url(#a)"/>
  <line class="line" x1="853" y1="700" x2="853" y2="738" marker-end="url(#a)"/>
  <line class="line" x1="1054" y1="700" x2="1054" y2="738" marker-end="url(#a)"/>

  <text class="small muted" x="466" y="850">also per service: in-cluster Service, ServiceAccount, certificates, network policy, and an HTTPRoute once exposed</text>
</svg>
