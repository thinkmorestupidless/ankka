<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" aria-labelledby="title desc">
  <title id="title">How the runtime hosts a WebAssembly module</title>
  <desc id="desc">How the ankka runtime hosts a service built to a WebAssembly module. One container runs one JVM: the runtime, with the module read once and compiled once, and instances built from it. The runtime's entity and workflow hosts hold each loaded entity's encoded state, and call the exports ankka1_handle and ankka1_fold on a command pool of reused instances, sized by ANKKA_WASM_INSTANCES: a stateless command takes any free instance, a stateful component's entity is pinned to one, and a trapped instance is discarded and replaced while the held state survives, handed to whichever instance serves the next call. Everything that may wait on the runtime — workflow steps, views, consumers, timed actions, HTTP routes, an agent's plan, tools and guardrails, and an autonomous agent's result check — runs on a fresh instance built for the call and discarded after it, so a call blocked in an import holds no command instance. From inside an export the module calls back through the ankka1 imports: invoke, send and query for the component client, invoke_stream with a streaming reply collected whole, schedule and cancel for timers, config for descriptor variables with reserved names answered absent, and log to the logger ankka.module; the calling virtual thread parks while it waits, and the imports reach the rest of the runtime, the same code a process is served by. Every call crosses the instance's linear memory as protobuf: the runtime allocates with ankka1_alloc, writes the request, calls the export with its pointer and length, and reads the reply from the returned i64, the pointer shifted left 32 bits or'd with the length.</desc>
