# One Kafka, in KRaft mode, on one node that is both controller and broker. An installation that
# wants more raises the node pool's replicas and the replication settings together.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  namespace: ankka-broker
  labels:
    strimzi.io/cluster: ankka
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi
        deleteClaim: false
        kraftMetadata: shared
  jvmOptions:
    -Xms: 256m
    -Xmx: 512m
  resources:
    requests:
      memory: 768Mi
      cpu: 250m
    limits:
      memory: 1Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: ankka
  namespace: ankka-broker
spec:
  kafka:
    version: 4.3.1
    listeners:
      # The one listener services use. It serves the certificate cert-manager issued (certificate.yaml)
      # and requires a client certificate from the installation's service authority, trusted by that
      # authority's certificate alone: the ca.crt of the same Secret, mounted below. A service is known
      # by its certificate's common name, <project>.<service>, which is its KafkaUser's name.
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: custom
          sasl: false
          listenerConfig:
            ssl.client.auth: required
            ssl.truststore.type: PEM
            ssl.truststore.location: /mnt/ankka-service-ca/ca.crt
        configuration:
          brokerCertChainAndKey:
            secretName: ankka-broker-tls
            certificate: tls.crt
            key: tls.key
        # Who may connect at all. Strimzi writes the listener's network policy itself, and without
        # this it admits every pod in the cluster; a second, stricter policy of ankka's could not
        # take that away, since policies only add. Pods of ankka workloads in ankka's namespaces.
        networkPolicyPeers:
          - namespaceSelector:
              matchLabels:
                app.kubernetes.io/managed-by: ankka
            podSelector:
              matchLabels:
                app.kubernetes.io/managed-by: ankka
    authorization:
      type: simple
    config:
      # A topic is made only by declaring it: a component that names one nobody declared waits.
      auto.create.topics.enable: false
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
    template:
      pod:
        volumes:
          - name: ankka-service-ca
            secret:
              secretName: ankka-broker-tls
              items:
                - key: ca.crt
                  path: ca.crt
      kafkaContainer:
        volumeMounts:
          - name: ankka-service-ca
            mountPath: /mnt/ankka-service-ca
  entityOperator:
    # Strimzi's topic and user operators: they turn the KafkaTopic and KafkaUser resources ankka's
    # operator writes into topics and permissions on the broker.
    topicOperator:
      resources:
        requests: { memory: 256Mi, cpu: 50m }
        limits: { memory: 384Mi }
    userOperator:
      resources:
        requests: { memory: 256Mi, cpu: 50m }
        limits: { memory: 384Mi }
