# The console's address: https://console.<base domain>. One label, like api and auth, so it can never
# collide with a service's <service>-<project> hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ankka-console
  namespace: ankka-console
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ankka
      namespace: ankka-gateway
      sectionName: https
  hostnames:
    - console.BASE_DOMAIN
  rules:
    - backendRefs:
        - name: ankka-console
          port: 9000
