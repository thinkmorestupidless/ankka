# Development values, public in this repository, like the identity provider's admin secret: right for a
# laptop's kind cluster and for nothing else. An installation anywhere else deletes this Secret in its
# overlay (overlays/cloud shows how) and creates it out of band:
#
#   kubectl -n ankka-console create secret generic ankka-console-secrets \
#     --from-literal=clientSecret="<the ankka-console client's secret in the realm>" \
#     --from-literal=sessionSecret="$(openssl rand -base64 48)"
#
# Changing sessionSecret signs everyone out of the console at once, and nothing else.
apiVersion: v1
kind: Secret
metadata:
  name: ankka-console-secrets
  namespace: ankka-console
  labels:
    app.kubernetes.io/managed-by: ankka
type: Opaque
stringData:
  clientSecret: dev
  sessionSecret: development-only-session-secret-do-not-use-elsewhere
