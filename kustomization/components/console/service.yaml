apiVersion: v1
kind: Service
metadata:
  name: ankka-console
  namespace: ankka-console
  labels:
    app.kubernetes.io/managed-by: ankka
    app.kubernetes.io/name: ankka-console
spec:
  selector:
    app.kubernetes.io/name: ankka-console
  ports:
    # Named, so the gateway's BackendTLSPolicy can target it.
    - name: http
      port: 9000
      targetPort: http
