# What the control plane may do in the cluster, and nothing more.
#
# It projects desired state into AnkkaService resources and reads their status back. It never
# creates a workload, never reads a secret, and never writes a status — so even fully
# compromised it can only ask for services, not make them. The operator, which does make them,
# holds credentials the control plane never sees.
#
# Since feature 004 it also reads the pods of ITS OWN namespace — a Role at the bottom, not a
# ClusterRole — so its instances can find each other. That reaches no project namespace, so
# "cannot touch a workload" stays true.
#
# Apply this only when the control plane runs inside the cluster. Outside it, the same
# permissions should be what its kubeconfig user has.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ankka-controlplane
  namespace: ankka-controlplane
  labels:
    app.kubernetes.io/managed-by: ankka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ankka-controlplane
  labels:
    app.kubernetes.io/managed-by: ankka
rules:
  - apiGroups: ["ankka.thinkmorestupidless.com"]
    resources: ["ankkaservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read-only on status: the operator writes it, the control plane consumes it.
  - apiGroups: ["ankka.thinkmorestupidless.com"]
    resources: ["ankkaservices/status"]
    verbs: ["get", "list", "watch"]
  # A project's namespace has to exist before its resource can be written into it, and the
  # operator cannot create it first — it only learns a project exists by seeing the resource.
  # Still no workload access: it can make a namespace and ask for a service, not run one.
  #
  # "patch" is required, not optional: ensureNamespace uses server-side apply, which always
  # issues a PATCH under the hood even for an object that does not exist yet. Granting only
  # "create" here produces a 403 the very first time a project's namespace is missing — which
  # is every time, since that is the one case this rule exists for.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch"]
  # `ankka services logs`, and nothing more than reading.
  #
  # This is a change in what a compromised control plane DISCLOSES, and not in what it can DO.
  # The invariant that matters — and that buys "a control plane that holds no credential able to
  # create a workload" — is about mutating verbs, and none are granted here: no create, no update,
  # no patch, no delete, and pointedly no pods/exec, which would be a shell in every service in
  # the installation. `get` on pods/log lets it read what an application printed.
  #
  # The alternative was to have the operator proxy logs, since it already has the pod access. That
  # was rejected: the operator has no API surface at all, and is deliberately "a process whose
  # entire job is to keep working while other things are broken". Giving it an HTTP server and an
  # auth story to serve a convenience is a large change with a small motivation.
  #
  # The developer's own kubeconfig was the other option, and it fails the requirement: logs have
  # to work on a machine with no cluster credentials, using the same token that deploys a service.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ankka-controlplane
  labels:
    app.kubernetes.io/managed-by: ankka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ankka-controlplane
subjects:
  - kind: ServiceAccount
    name: ankka-controlplane
    namespace: ankka-controlplane
---
# Its instances discover each other through the API server: read-only, on pods, in this
# namespace only. A Role, so the grant cannot reach a project's workloads — the same three verbs
# on the same resource the operator gives every service it deploys.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ankka-controlplane-peers
  namespace: ankka-controlplane
  labels:
    app.kubernetes.io/managed-by: ankka
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ankka-controlplane-peers
  namespace: ankka-controlplane
  labels:
    app.kubernetes.io/managed-by: ankka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ankka-controlplane-peers
subjects:
  - kind: ServiceAccount
    name: ankka-controlplane
    namespace: ankka-controlplane
