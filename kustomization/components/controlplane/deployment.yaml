apiVersion: apps/v1
kind: Deployment
metadata:
  name: ankka-controlplane
  namespace: ankka-controlplane
  labels:
    app.kubernetes.io/managed-by: ankka
    app.kubernetes.io/name: ankka-controlplane
spec:
  # Three, forming one cluster (feature 004): the control plane is an ankka application and runs
  # on the same mechanism as any service. Odd, because the partition strategy keeps the
  # majority. Memory on a laptop's kind: three of the limits below.
  replicas: 3
  # One at a time. A surge pod joins the existing cluster and is Ready before an old one
  # leaves, so a deploy is no longer an outage; Recreate was right only while a pod joined
  # itself.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ankka-controlplane
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: ankka
        app.kubernetes.io/name: ankka-controlplane
        # Only pods carrying this are contact points for Cluster Bootstrap (see the selector
        # below). A pod from an older template — no management port — must not be asked, or the
        # new pods wait on it forever and the roll never completes. Found upgrading a real cluster.
        ankka.thinkmorestupidless.com/formation: bootstrap
        # Mutual TLS between the control plane's own instances (feature 014). In the contact-point
        # selector too, so a TLS node never probes a plain one; an installation moving across it
        # stops the old instances first — deploy-local.sh does, and upgrading.md says how.
        ankka.thinkmorestupidless.com/transport: tls
    spec:
      # Its own identity, distinct from the operator's — see controlplane-rbac.yaml for why
      # the two must never share a ServiceAccount: this one cannot touch a workload at all.
      serviceAccountName: ankka-controlplane
      # The control plane does not retry an r2dbc connection refused at startup — it fails
      # deep inside actor-system initialization, past the point a clean restart is triggered,
      # so the pod is left half-alive rather than crash-looping into a fix. Applying the CNPG
      # Cluster and the control plane together (one kubectl apply -k) starts both at once with
      # no ordering guarantee, so this waits for the *port*, not just the Service existing.
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          env:
            - name: ANKKA_DB_HOST
              valueFrom:
                secretKeyRef: { name: ankka-controlplane-db-app, key: host }
            - name: ANKKA_DB_PORT
              valueFrom:
                secretKeyRef: { name: ankka-controlplane-db-app, key: port }
            - name: ANKKA_DB_USER
              valueFrom:
                secretKeyRef: { name: ankka-controlplane-db-app, key: username }
          command:
            - sh
            - -c
            - until pg_isready -h "$ANKKA_DB_HOST" -p "$ANKKA_DB_PORT" -U "$ANKKA_DB_USER"; do sleep 1; done
      containers:
        - name: ankka-controlplane
          image: ankka-controlplane:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
            # The NAME "management" is load-bearing: Kubernetes API discovery finds a pod's
            # contact point by looking for a container port called exactly that.
            - name: management
              containerPort: 7626
            - name: remoting
              containerPort: 17355
            # Readiness, on a plain listener: management requires the control plane's own cluster
            # certificate, which the kubelet does not hold (feature 014).
            - name: probe
              containerPort: 7627
          env:
            # Identity (feature 008). The issuer tokens must name is derived in-process from
            # ANKKA_BASE_DOMAIN and ANKKA_HTTPS_PORT below — https://auth.<base>[:port]/realms/ankka
            # — so nothing here has to be replaced by the overlay a second time. Keys are read over
            # the plain in-cluster address: no gateway, no TLS, no certificate to trust.
            # The identity provider's TLS port, verified against the service authority alone
            # (feature 014): its certificate is issued by that authority for this very address.
            - name: ANKKA_AUTH_JWKS_URL
              value: "https://ankka-keycloak-service.ankka-auth.svc:8443/realms/ankka/protocol/openid-connect/certs"
            - name: ANKKA_AUTH_JWKS_CA
              value: "/var/run/secrets/ankka/service/ca.crt"
            # Must match the operator's ANKKA_K8S_NAMESPACE_PREFIX. A mismatch presents as
            # every service reporting "no operator has reported on this service".
            - name: ANKKA_K8S_NAMESPACE_PREFIX
              value: "ankka"
            # Must match the operator's ANKKA_BASE_DOMAIN: the control plane derives an exposed
            # service's hostname to show it and to refuse a collision; the operator derives the
            # same one to render the route. Replaced by the overlay from ankka-platform.
            - name: ANKKA_BASE_DOMAIN
              value: "BASE_DOMAIN"
            # The port clients reach HTTPS on, so the URL `services expose` prints is the one
            # that works; replaced by the overlay from ankka-platform.httpsPort.
            - name: ANKKA_HTTPS_PORT
              value: "443"
            # Where the control plane, an ankka service itself, exports its telemetry, and what
            # it sends with it. The address is replaced by the overlay from
            # ankka-platform.otlpEndpoint; empty names no collector, and nothing is exported. The
            # headers are a credential, from the installation's own ankka-telemetry Secret in this
            # namespace when the collector wants one.
            - name: ANKKA_OTLP_ENDPOINT
              value: ""
            - name: ANKKA_OTLP_HEADERS
              valueFrom:
                secretKeyRef: { name: ankka-telemetry, key: headers, optional: true }
            # The installation's secret store and cloud settings (feature 038), replaced by the overlay
            # from ankka-platform; empty is the default.
            - name: ANKKA_SECRET_BACKEND
              value: ""
            - name: ANKKA_SECRET_RECORD_RETENTION
              value: ""
            - name: ANKKA_CLOUD_PROVIDER
              value: ""
            - name: ANKKA_CLOUD_ACCOUNT
              value: ""
            - name: ANKKA_CLOUD_LOCATION
              value: ""
            # How this pod finds its peers — the same five variables the operator injects into
            # every service (feature 004). ANKKA_CLUSTER_MODE selects the Kubernetes overlay.
            - name: ANKKA_CLUSTER_MODE
              value: kubernetes
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - name: ANKKA_CLUSTER_SERVICE
              value: ankka-controlplane
            - name: ANKKA_CLUSTER_POD_SELECTOR
              value: "app.kubernetes.io/name=ankka-controlplane,ankka.thinkmorestupidless.com/formation=bootstrap,ankka.thinkmorestupidless.com/transport=tls"
            - name: ANKKA_CLUSTER_CONTACT_POINTS
              value: "2"
            # CNPG's bootstrap.initdb generates this secret itself (contracts/credentials.md)
            # under its own key names, mapped one-for-one onto the runtime's ANKKA_DB_* — the
            # runtime cannot tell a CNPG-managed database from any other kind, which is exactly
            # what makes this mapping the whole migration.
            - name: ANKKA_DB_HOST
              valueFrom:
                secretKeyRef: { name: ankka-controlplane-db-app, key: host }
            - name: ANKKA_DB_PORT
              valueFrom:
                secretKeyRef: { name: ankka-controlplane-db-app, key: port }
            - name: ANKKA_DB_NAME
              valueFrom:
                secretKeyRef: { name: ankka-controlplane-db-app, key: dbname }
            - name: ANKKA_DB_USER
              valueFrom:
                secretKeyRef: { name: ankka-controlplane-db-app, key: username }
            - name: ANKKA_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: ankka-controlplane-db-app, key: password }
          # Cluster membership, plus "the HTTP server is bound" — the runtime's own readiness
          # check, served by Pekko Management. Not the tcpSocket it used to be: a member that
          # is not yet listening must not receive traffic, and a pod that is listening but not
          # yet a member must not either.
          readinessProbe:
            httpGet:
              path: /ready
              port: probe
            periodSeconds: 5
          volumeMounts:
            - name: ankka-cluster-tls
              mountPath: /var/run/secrets/ankka/cluster
              readOnly: true
            - name: ankka-service-tls
              mountPath: /var/run/secrets/ankka/service
              readOnly: true
          # Serve for a moment after the decision to stop: the pod leaves its Service's endpoints
          # when deletion starts, kube-proxy learns that up to a second later, and the runtime
          # unbinds on SIGTERM at once — so without this, a command routed to the old pod in that
          # second is refused. The operator renders the same hook on every service.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
      # Whole Secrets, never subPath: a rotated certificate reaches the pod only through a volume.
      volumes:
        - name: ankka-cluster-tls
          secret:
            secretName: ankka-controlplane-cluster-tls
        - name: ankka-service-tls
          secret:
            secretName: ankka-controlplane-service-tls
