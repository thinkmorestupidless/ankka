apiVersion: apps/v1
kind: Deployment
metadata:
  name: nakka-controlplane
  namespace: nakka-controlplane
  labels:
    app.kubernetes.io/managed-by: nakka
    app.kubernetes.io/name: nakka-controlplane
spec:
  # One. Sharding forms a single-node cluster per pod today (see the operator's own note on
  # nakka.join-self-if-no-seed-nodes) — the same constraint that caps every nakka service at
  # one replica applies to the control plane itself, since it is a nakka application too.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nakka-controlplane
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: nakka
        app.kubernetes.io/name: nakka-controlplane
    spec:
      # Its own identity, distinct from the operator's — see controlplane-rbac.yaml for why
      # the two must never share a ServiceAccount: this one cannot touch a workload at all.
      serviceAccountName: nakka-controlplane
      # The control plane does not retry an r2dbc connection refused at startup — it fails
      # deep inside actor-system initialization, past the point a clean restart is triggered,
      # so the pod is left half-alive rather than crash-looping into a fix. Applying the CNPG
      # Cluster and the control plane together (one kubectl apply -k) starts both at once with
      # no ordering guarantee, so this waits for the *port*, not just the Service existing.
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          env:
            - name: NAKKA_DB_HOST
              valueFrom:
                secretKeyRef: { name: nakka-controlplane-db-app, key: host }
            - name: NAKKA_DB_PORT
              valueFrom:
                secretKeyRef: { name: nakka-controlplane-db-app, key: port }
            - name: NAKKA_DB_USER
              valueFrom:
                secretKeyRef: { name: nakka-controlplane-db-app, key: username }
          command:
            - sh
            - -c
            - until pg_isready -h "$NAKKA_DB_HOST" -p "$NAKKA_DB_PORT" -U "$NAKKA_DB_USER"; do sleep 1; done
      containers:
        - name: nakka-controlplane
          image: nakka-controlplane:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          envFrom:
            - secretRef:
                name: nakka-controlplane-token
          env:
            # Must match the operator's NAKKA_K8S_NAMESPACE_PREFIX. A mismatch presents as
            # every service reporting "no operator has reported on this service".
            - name: NAKKA_K8S_NAMESPACE_PREFIX
              value: "nakka"
            # CNPG's bootstrap.initdb generates this secret itself (contracts/credentials.md)
            # under its own key names, mapped one-for-one onto the runtime's NAKKA_DB_* — the
            # runtime cannot tell a CNPG-managed database from any other kind, which is exactly
            # what makes this mapping the whole migration.
            - name: NAKKA_DB_HOST
              valueFrom:
                secretKeyRef: { name: nakka-controlplane-db-app, key: host }
            - name: NAKKA_DB_PORT
              valueFrom:
                secretKeyRef: { name: nakka-controlplane-db-app, key: port }
            - name: NAKKA_DB_NAME
              valueFrom:
                secretKeyRef: { name: nakka-controlplane-db-app, key: dbname }
            - name: NAKKA_DB_USER
              valueFrom:
                secretKeyRef: { name: nakka-controlplane-db-app, key: username }
            - name: NAKKA_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: nakka-controlplane-db-app, key: password }
          readinessProbe:
            # tcpSocket rather than httpGet: every route needs the bearer token, and a probe
            # is not a place to duplicate it. The port only opens once HttpServer has bound,
            # which is a late enough signal that this is a reasonable proxy for "ready".
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
