# The control plane's own external address: https://api.<base domain>. The same mechanism as an
# exposed service's route, hand-written here because the control plane is installed, not deployed.
# `api` can never collide with a service's hostname: every one of those is <service>-<project>,
# which always contains a hyphen.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ankka-controlplane
  namespace: ankka-controlplane
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ankka
      namespace: ankka-gateway
      sectionName: https
  hostnames:
    - api.BASE_DOMAIN
  rules:
    - backendRefs:
        - name: ankka-controlplane
          port: 9000
