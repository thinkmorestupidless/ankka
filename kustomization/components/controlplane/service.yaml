apiVersion: v1
kind: Service
metadata:
  name: ankka-controlplane
  namespace: ankka-controlplane
  labels:
    app.kubernetes.io/managed-by: ankka
    app.kubernetes.io/name: ankka-controlplane
spec:
  selector:
    app.kubernetes.io/name: ankka-controlplane
  ports:
    # Named, so the gateway's BackendTLSPolicy can target it (feature 014).
    - name: http
      port: 9000
      targetPort: 9000
    # The keys machine tokens are signed with, for the broker and every service (feature 040).
    - name: keys
      port: 7629
      targetPort: 7629
