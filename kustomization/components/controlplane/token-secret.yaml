# The shared bearer token, matching `ankka.controlplane.auth.token` / ANKKA_CONTROLPLANE_TOKEN.
#
# A development default so the CLI can authenticate against a freshly deployed local cluster
# with no extra step. Replace before this touches anything beyond a local kind cluster — the
# control plane refuses to start with an empty token (see reference.conf), but "dev-local-token"
# is not meaningfully different from empty once this is anywhere reachable by anyone else.
apiVersion: v1
kind: Secret
metadata:
  name: ankka-controlplane-token
  namespace: ankka-controlplane
  labels:
    app.kubernetes.io/managed-by: ankka
type: Opaque
stringData:
  ANKKA_CONTROLPLANE_TOKEN: dev-local-token
