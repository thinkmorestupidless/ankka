# The AnkkaProject custom resource definition.
#
# One per project, in the project's namespace, named for the project: what the project declares
# that is not a service's. Today that is its topics on the installation's broker, which the control
# plane writes from the project's declarations and the operator makes, reporting each one's phase.
#
# This is the single copy, as ankkaservice.yaml is: the k3s suites install this exact file.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ankkaprojects.ankka.thinkmorestupidless.com
  labels:
    app.kubernetes.io/managed-by: ankka
spec:
  group: ankka.thinkmorestupidless.com
  scope: Namespaced
  names:
    kind: AnkkaProject
    listKind: AnkkaProjectList
    plural: ankkaprojects
    singular: ankkaproject
    shortNames:
      - aproj
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        # As for AnkkaService: the operator may write the status and never the declarations.
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                projectId:
                  type: string
                topics:
                  type: array
                  description: >-
                    The topics the project declares, each made on the installation's broker as
                    <project>.<name>. A topic no longer listed is no longer made, and is never
                    removed from the broker by the platform.
                  items:
                    type: object
                    required:
                      - name
                      - partitions
                    properties:
                      name:
                        type: string
                      partitions:
                        type: integer
                        minimum: 1
                      declaredAt:
                        type: string
                        description: >-
                          When the project declared it, RFC 3339. A topic the broker held before
                          this is reported recovered.
                      compacted:
                        type: boolean
                        description: >-
                          The broker keeps the last message under each key. Applied to a topic
                          already made as well as a new one.
                      contractName:
                        type: string
                        description: The contract the topic carries, which every side must state.
                      contractFingerprint:
                        type: string
                        description: >-
                          sha256 of the contract's schema document under RFC 8785, as every
                          component states the schema it was built against.
                      retentionMs:
                        type: integer
                        format: int64
                        description: >-
                          How long the topic keeps a message, in milliseconds; -1 keeps everything.
                          Absent, with every setting below, for a topic declared before topics
                          stated their settings.
                      retentionBytes:
                        type: integer
                        format: int64
                        description: How much each partition keeps, in bytes; -1 sets no limit.
                      cleanupPolicy:
                        type: string
                        enum:
                          - delete
                          - compact
                          - compact,delete
                      deleteRetentionMs:
                        type: integer
                        format: int64
                        description: How long a compacted topic keeps a deletion (its tombstone window).
                      minCompactionLagMs:
                        type: integer
                        format: int64
                      maxCompactionLagMs:
                        type: integer
                        format: int64
                      replicas:
                        type: integer
                        minimum: 1
                        description: >-
                          How many copies the broker keeps, fixed when declared. Absent for a topic
                          whose copies are the broker's.
                      minInsyncReplicas:
                        type: integer
                        minimum: 1
                        description: How many copies must hold a message before it is acknowledged.
                bucketLocation:
                  type: string
                  description: >-
                    Where the project's new buckets in Google Cloud Storage are made, in the
                    installation's own words. Absent means the installation's default. A bucket's
                    location is fixed when it is made.
                brokers:
                  type: array
                  description: >-
                    Brokers the project declares beside the installation's, which a component may
                    name for one topic. Every service of the project is given each one's address
                    and credential, on its platform container only.
                  items:
                    type: object
                    required:
                      - name
                      - bootstrap
                      - shape
                      - secretName
                    properties:
                      name:
                        type: string
                      bootstrap:
                        type: string
                      shape:
                        type: string
                        enum:
                          - certificate
                          - sasl
                      secretName:
                        type: string
                        description: The project secret holding the credential, mounted as a directory.
                      declaredAt:
                        type: string
                secrets:
                  type: array
                  description: >-
                    The project's secrets by name and entry, never a value: what the cloud provider
                    keeps the project's secrets in the cluster in step with, on the Secret Manager
                    backend.
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                      entries:
                        type: array
                        items:
                          type: string
                      entryGeneration:
                        type: integer
                        format: int64
                        description: >-
                          When the secret was last set, in epoch milliseconds: the generation the
                          cloud provider keeps the Secret in step with.
                secretsFingerprint:
                  type: string
                  description: >-
                    A fingerprint of the secrets and when each entry was last set; a service that
                    takes a variable from an entry waits until the provider has synced this one.
                database:
                  type: object
                  description: >-
                    The project database's settings (feature 041): replicas beside the primary,
                    synchronous replication, a retention longer than the installation's, and a
                    rehearsal schedule. Absent is a primary alone and the installation's retention.
                  properties:
                    replicas:
                      type: integer
                      minimum: 0
                    synchronous:
                      type: boolean
                    retentionDays:
                      type: integer
                      minimum: 1
                    rehearsalSchedule:
                      type: string
                      enum:
                        - daily
                        - weekly
                backups:
                  type: object
                  description: Raising credentialGeneration re-issues the backup credential.
                  properties:
                    credentialGeneration:
                      type: integer
                      minimum: 0
                restores:
                  type: array
                  description: >-
                    Every restore of the project asked for (feature 041): a cluster beside the
                    project database, at a moment of a line of history. Never removed.
                  items:
                    type: object
                    required:
                      - name
                      - line
                      - targetTime
                    properties:
                      name:
                        type: string
                      line:
                        type: string
                      targetTime:
                        type: string
                        description: RFC 3339, in UTC.
                      requestedAt:
                        type: string
                rehearsals:
                  type: array
                  description: >-
                    Rehearsals asked for and not yet reported: a restore into the project's
                    rehearsal namespace, checked, timed and removed.
                  items:
                    type: object
                    required:
                      - name
                      - line
                      - targetTime
                    properties:
                      name:
                        type: string
                      line:
                        type: string
                      targetTime:
                        type: string
                        description: RFC 3339, in UTC.
                      requestedAt:
                        type: string
                grants:
                  type: array
                  description: >-
                    The project's accepted grants: one grantee, a service of another project or a
                    registered machine, given one route, gRPC method, topic right or the erasure
                    right of this project's. A pending grant is never listed, so it opens nothing.
                    Rendered into every service's grants file and onto the grantee's broker user.
                  items:
                    type: object
                    required:
                      - id
                      - grantee
                      - kind
                    properties:
                      id:
                        type: string
                      grantee:
                        type: string
                        description: service:<project>/<name> or machine:<organization>/<name>.
                      kind:
                        type: string
                        enum:
                          - route
                          - method
                          - topic
                          - erasure
                      service:
                        type: string
                        description: The granting project's service, for a route or a method.
                      httpMethod:
                        type: string
                      path:
                        type: string
                        description: The route's path template.
                      method:
                        type: string
                        description: A gRPC method, as Service/Method.
                      topic:
                        type: string
                        description: The declared topic, as the project's components name it.
                      right:
                        type: string
                        enum:
                          - consume
                          - produce
                      decrypt:
                        type: boolean
                        description: A consume grant whose grantee may decrypt personal fields.
                      grantedAt:
                        type: string
            status:
              type: object
              properties:
                topics:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      phase:
                        type: string
                        enum:
                          - Waiting
                          - Provisioned
                          - Recovered
                          - Failed
                      partitions:
                        type: integer
                      detail:
                        type: string
                      compacted:
                        type: boolean
                      replicas:
                        type: integer
                      config:
                        type: object
                        additionalProperties:
                          type: string
                brokerNodes:
                  type: integer
                  description: How many broker nodes the installation's broker has, as its node pools say.
                # Feature 041. Every time below is RFC 3339.
                backups:
                  type: object
                  properties:
                    target:
                      type: string
                      enum:
                        - none
                        - object-store
                    detail:
                      type: string
                    lines:
                      type: array
                      items:
                        type: object
                        properties:
                          line:
                            type: string
                          cluster:
                            type: string
                          phase:
                            type: string
                            enum:
                              - NotBackedUp
                              - BackingUp
                              - Failing
                          lastBaseBackup:
                            type: string
                          firstRestorable:
                            type: string
                          lastRestorable:
                            type: string
                          archiveLagSeconds:
                            type: number
                          failing:
                            type: string
                          copiedAt:
                            type: string
                database:
                  type: object
                  properties:
                    cluster:
                      type: string
                    instances:
                      type: integer
                    readyInstances:
                      type: integer
                    primary:
                      type: string
                    synchronous:
                      type: boolean
                    writesWaitingOn:
                      type: string
                clusters:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      line:
                        type: string
                      phase:
                        type: string
                        enum:
                          - live
                          - restore
                          - left
                      services:
                        type: array
                        items:
                          type: string
                      since:
                        type: string
                      leftAt:
                        type: string
                restores:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      line:
                        type: string
                      targetTime:
                        type: string
                      phase:
                        type: string
                        enum:
                          - Restoring
                          - Verified
                          - Failed
                          - InUse
                      reachedAt:
                        type: string
                      detail:
                        type: string
                      services:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            present:
                              type: boolean
                            journalRows:
                              type: integer
                            stateRows:
                              type: integer
                            offsetRows:
                              type: integer
                            timerRows:
                              type: integer
                            highestSequence:
                              type: integer
                            changedSecrets:
                              type: array
                              items:
                                type: string
                rehearsals:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      targetTime:
                        type: string
                      outcome:
                        type: string
                        enum:
                          - Running
                          - Completed
                          - Failed
                          - NotRemoved
                      startedAt:
                        type: string
                      elapsedSeconds:
                        type: integer
                      detail:
                        type: string
                      services:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            present:
                              type: boolean
                            journalRows:
                              type: integer
                            stateRows:
                              type: integer
                            offsetRows:
                              type: integer
                            timerRows:
                              type: integer
                            highestSequence:
                              type: integer
                            changedSecrets:
                              type: array
                              items:
                                type: string
