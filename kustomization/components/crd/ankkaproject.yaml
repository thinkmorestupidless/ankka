# The AnkkaProject custom resource definition.
#
# One per project, in the project's namespace, named for the project: what the project declares
# that is not a service's. Today that is its topics on the installation's broker, which the control
# plane writes from the project's declarations and the operator makes, reporting each one's phase.
#
# This is the single copy, as ankkaservice.yaml is: the k3s suites install this exact file.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ankkaprojects.ankka.thinkmorestupidless.com
  labels:
    app.kubernetes.io/managed-by: ankka
spec:
  group: ankka.thinkmorestupidless.com
  scope: Namespaced
  names:
    kind: AnkkaProject
    listKind: AnkkaProjectList
    plural: ankkaprojects
    singular: ankkaproject
    shortNames:
      - aproj
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        # As for AnkkaService: the operator may write the status and never the declarations.
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                projectId:
                  type: string
                topics:
                  type: array
                  description: >-
                    The topics the project declares, each made on the installation's broker as
                    <project>.<name>. A topic no longer listed is no longer made, and is never
                    removed from the broker by the platform.
                  items:
                    type: object
                    required:
                      - name
                      - partitions
                    properties:
                      name:
                        type: string
                      partitions:
                        type: integer
                        minimum: 1
                      declaredAt:
                        type: string
                        description: >-
                          When the project declared it, RFC 3339. A topic the broker held before
                          this is reported recovered.
                      compacted:
                        type: boolean
                        description: >-
                          The broker keeps the last message under each key. Applied to a topic
                          already made as well as a new one.
                      contractName:
                        type: string
                        description: The contract the topic carries, which every side must state.
                      contractFingerprint:
                        type: string
                        description: >-
                          sha256 of the contract's schema document under RFC 8785, as every
                          component states the schema it was built against.
                brokers:
                  type: array
                  description: >-
                    Brokers the project declares beside the installation's, which a component may
                    name for one topic. Every service of the project is given each one's address
                    and credential, on its platform container only.
                  items:
                    type: object
                    required:
                      - name
                      - bootstrap
                      - shape
                      - secretName
                    properties:
                      name:
                        type: string
                      bootstrap:
                        type: string
                      shape:
                        type: string
                        enum:
                          - certificate
                          - sasl
                      secretName:
                        type: string
                        description: The project secret holding the credential, mounted as a directory.
                      declaredAt:
                        type: string
                grants:
                  type: array
                  description: >-
                    The project's accepted grants: one grantee, a service of another project or a
                    registered machine, given one route, gRPC method, topic right or the erasure
                    right of this project's. A pending grant is never listed, so it opens nothing.
                    Rendered into every service's grants file and onto the grantee's broker user.
                  items:
                    type: object
                    required:
                      - id
                      - grantee
                      - kind
                    properties:
                      id:
                        type: string
                      grantee:
                        type: string
                        description: service:<project>/<name> or machine:<organization>/<name>.
                      kind:
                        type: string
                        enum:
                          - route
                          - method
                          - topic
                          - erasure
                      service:
                        type: string
                        description: The granting project's service, for a route or a method.
                      httpMethod:
                        type: string
                      path:
                        type: string
                        description: The route's path template.
                      method:
                        type: string
                        description: A gRPC method, as Service/Method.
                      topic:
                        type: string
                        description: The declared topic, as the project's components name it.
                      right:
                        type: string
                        enum:
                          - consume
                          - produce
                      decrypt:
                        type: boolean
                        description: A consume grant whose grantee may decrypt personal fields.
                      grantedAt:
                        type: string
            status:
              type: object
              properties:
                topics:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      phase:
                        type: string
                        enum:
                          - Waiting
                          - Provisioned
                          - Recovered
                          - Failed
                      partitions:
                        type: integer
                      detail:
                        type: string
                      compacted:
                        type: boolean
