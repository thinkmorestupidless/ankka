# The AnkkaService custom resource definition.
#
# This is the single copy. The k3s test suites install this exact file, so a manifest that
# does not work cannot pass CI — the same rule the runtime's DDL follows.
#
# The schema is deliberately not exhaustive: it pins the fields the operator cannot act
# without, and leaves the rest to the validation in controlplane-api, which runs on both the
# CLI and the server and produces a message an operator can act on. What the API server adds
# is a third check neither process can bypass, including a `kubectl apply` by hand.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ankkaservices.ankka.thinkmorestupidless.com
  labels:
    app.kubernetes.io/managed-by: ankka
spec:
  group: ankka.thinkmorestupidless.com
  # Namespaced, and that is load-bearing: owner references only work within a namespace, and
  # the resource living beside the objects it owns is what makes cascade deletion structural
  # rather than something the operator has to implement.
  scope: Namespaced
  names:
    kind: AnkkaService
    listKind: AnkkaServiceList
    plural: ankkaservices
    singular: ankkaservice
    shortNames:
      - asvc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        # Status is a subresource so the operator's RBAC can grant `ankkaservices/status:
        # update` without granting `ankkaservices: update`. An operator bug then cannot
        # rewrite desired state.
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.lifecycle
        - name: Ready
          type: string
          jsonPath: .status.readyInstances
        - name: Desired
          type: string
          jsonPath: .status.desiredInstances
        - name: Gen
          type: integer
          jsonPath: .spec.generation
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - projectId
                - serviceName
                - generation
                - image
              properties:
                projectId:
                  type: string
                  description: The project this service belongs to. Also the namespace suffix.
                serviceName:
                  type: string
                generation:
                  type: integer
                  format: int64
                  description: >-
                    ankka's generation, bumped on every apply and restart. Distinct from
                    metadata.generation, which the API server owns.
                paused:
                  type: boolean
                image:
                  type: string
                env:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                      secretName:
                        type: string
                      secretKey:
                        type: string
                labels:
                  type: object
                  additionalProperties:
                    type: string
                annotations:
                  type: object
                  additionalProperties:
                    type: string
                instanceType:
                  type: string
                  description: >-
                    Informational. The operator renders cpuMillis and memoryMiB; this is
                    carried so `kubectl describe` reads in the vocabulary an operator used.
                cpuMillis:
                  type: integer
                memoryMiB:
                  type: integer
                autoscaling:
                  type: object
                  description: >-
                    Recorded but not honoured. The operator renders one replica and no
                    autoscaler, because each pod joins itself as a single-node cluster and a
                    second replica would be a second writer to the same journal. Present so
                    that enabling multi-replica support later is not a breaking change.
                  properties:
                    minInstances:
                      type: integer
                    maxInstances:
                      type: integer
                    targetCpuPercent:
                      type: integer
                processCpuMillis:
                  type: integer
                  description: The process container's CPU, in millicores, for a process-hosted service.
                processMemoryMiB:
                  type: integer
                  description: The process container's memory, in MiB, for a process-hosted service.
                progressDeadlineSeconds:
                  type: integer
                database:
                  type: string
                  enum:
                    - platform
                    - supplied
                    - none
                  description: >-
                    Whose database the service has: the platform's, one its descriptor supplies,
                    or none at all, for a service of consumers alone; nothing is provisioned for
                    none, and its runtime refuses a stateful component.
                provisionDatabase:
                  type: boolean
                  description: >-
                    Whether the platform should provision this service's database. false means
                    the descriptor supplied its own connection details (the escape hatch) and
                    the operator renders no CNPG objects and no schema-init container.
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  description: >-
                    The port the workload serves HTTP on, already resolved by the control plane.
                    Absent means it serves none: no container port, no readiness probe and no
                    Service are rendered. Present means all three, plus ANKKA_HTTP_PORT, from
                    this one value.
                restarts:
                  type: integer
                  minimum: 0
                  description: >-
                    How many restarts an operator has asked for. Carried on the pod template so
                    a restart rolls the pods; the generation is not, so a scale does not.
                hosting:
                  type: string
                  enum: [embedded, process, wasm, web]
                  default: embedded
                  description: >-
                    embedded: the image is an ankka service and its JVM is the node. process: the
                    image is a developer's process in another language, and the operator runs the
                    sidecar — ankka's own runtime — beside it in the same pod. The sidecar's image
                    is the operator's, never this resource's. wasm: the image carries a WebAssembly
                    module, run once as an init container to copy it into a shared volume, and the
                    pod's one container is ankka's runtime with that module loaded into it. web:
                    the image is any program that serves HTTP, and the operator runs the platform's
                    proxy beside it; it has no database and forms no cluster.
                mounts:
                  type: array
                  description: >-
                    A web-hosted service's mounts: a path, and the name of a service in the same
                    project that answers requests under it. The proxy passes such a request to that
                    service, which is told it came from the internet.
                  items:
                    type: object
                    required:
                      - path
                      - service
                    properties:
                      path:
                        type: string
                      service:
                        type: string
                callers:
                  type: array
                  description: >-
                    The services a web-hosted service's proxy admits beside the internet and
                    itself: a name, a project and a name, or * for every service of its project.
                  items:
                    type: string
                processPort:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  description: >-
                    The port a web-hosted service's program listens on, told to it as PORT. Absent
                    for every other hosting.
                provisionBroker:
                  type: boolean
                  description: >-
                    Whether the platform should know this service on the installation's broker.
                    false when the descriptor names a broker of its own, and for a web-hosted
                    service.
                exposed:
                  type: boolean
                  description: >-
                    Whether the service answers at its platform-derived hostname. The hostname
                    itself is never in the resource: the operator derives it.
                imagePullSecret:
                  type: string
                  description: >-
                    The name of a dockerconfigjson Secret in this namespace that the kubelet
                    authenticates to the image's registry with. The name only: the Secret is the
                    control plane's to write from a credential a project member supplied, and the
                    operator names it on the pod without ever reading it. Absent when the project
                    has no registry credential, and then no pull secret is named at all.
                grpcPort:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  description: >-
                    The port the workload serves gRPC on, already resolved by the control plane.
                    Absent means it serves none, and nothing about gRPC is rendered. Present means a
                    container port and ANKKA_GRPC_PORT, a second port on the service's address, a
                    headless address, a network policy and, when exposed, a route rule for gRPC.
                provisionObjectStorage:
                  type: boolean
                  description: >-
                    Whether the platform gives this service a bucket in the installation's object
                    store and a storage credential that reaches it alone. Set by the control plane
                    from the descriptor. A service with an object store of its own says so with an
                    ANKKA_S3_ variable in env, which the operator reads.
                exposeObjectStorage:
                  type: boolean
                  description: >-
                    Whether that bucket is reachable from the internet, for URLs the service signs.
                    The bucket's name and address are never in the resource: the operator derives
                    them.
                storageCredentialGeneration:
                  type: integer
                  minimum: 1
                  description: >-
                    The generation of the storage credential a cloud provider issues for that
                    bucket (feature 044). Raising it asks for a new credential in the same Secret.
                    Absent means 1; the control plane never sets it.
            status:
              type: object
              properties:
                generation:
                  type: integer
                  format: int64
                observedGeneration:
                  type: integer
                  format: int64
                lifecycle:
                  type: string
                  enum:
                    - NotDeployed
                    - UpdateInProgress
                    - Ready
                    - PartiallyReady
                    - Unavailable
                    - Paused
                    - Failed
                readyInstances:
                  type: integer
                desiredInstances:
                  type: integer
                detail:
                  type: string
                lastTransitionTime:
                  type: string
                route:
                  type: string
                  description: >-
                    The gateway's verdict on an exposed service's route: accepted, pending, or
                    "rejected: <reason>". Absent when the service is not exposed.
                database:
                  type: object
                  description: What the platform did about this service's database. Absent on
                    the escape-hatch path.
                  properties:
                    phase:
                      type: string
                      enum:
                        - Supplied
                        - Waiting
                        - Provisioned
                        - Recovered
                        - Failed
                    name:
                      type: string
                    cluster:
                      type: string
                    recovered:
                      type: boolean
                    detail:
                      type: string
                broker:
                  type: object
                  description: What the platform did about this service's credential on the
                    installation's broker. Absent for a web-hosted service, and in an installation
                    with no broker.
                  properties:
                    phase:
                      type: string
                      enum:
                        - Supplied
                        - Waiting
                        - Provisioned
                        - Recovered
                        - Failed
                    recovered:
                      type: boolean
                    detail:
                      type: string
                objectStorage:
                  type: object
                  description: What the platform did about this service's bucket. Absent only when
                    the service neither asks for one nor has an object store of its own.
                  properties:
                    phase:
                      type: string
                      enum:
                        - Supplied
                        - Waiting
                        - Provisioned
                        - Recovered
                        - Failed
                    bucket:
                      type: string
                    publicAddress:
                      type: string
                    recovered:
                      type: boolean
                    detail:
                      type: string
