# Development values, public in this repository: the cloud overlay deletes both Secrets.
#
# The RPC secret authenticates the store's nodes to each other; the admin token is the bearer token
# of the administration API. The same token is written twice, because a Secret is read only in its
# own namespace: once for the store, and once for the operator, which is the only client of the API.
#
# Given to the store as environment variables, not files: Garage refuses a secret file any other
# user can read, and a variable has no mode to get wrong.
apiVersion: v1
kind: Secret
metadata:
  name: garage-secrets
  namespace: garage-system
type: Opaque
stringData:
  rpc-secret: "3c1b6a9e0f5d4728b1e9a6c3d2f8e7b4a5c6d1e2f3a4b5c6d7e8f9a0b1c2d3e4"
  admin-token: "ankka-dev-object-store-admin"
---
apiVersion: v1
kind: Secret
metadata:
  name: ankka-object-store-admin
  namespace: ankka-operator
type: Opaque
stringData:
  token: "ankka-dev-object-store-admin"
