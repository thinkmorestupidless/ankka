apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: garage-system
  labels:
    app.kubernetes.io/name: garage
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
    spec:
      automountServiceAccountToken: false
      containers:
        - name: garage
          image: dxflrs/garage:v2.3.0
          imagePullPolicy: IfNotPresent
          # Lays out a cluster of this one node by itself; it refuses to run if others have joined.
          args: ["/garage", "server", "--single-node"]
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom: { secretKeyRef: { name: garage-secrets, key: rpc-secret } }
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: garage-secrets, key: admin-token } }
          ports:
            - { name: s3, containerPort: 3900 }
            - { name: rpc, containerPort: 3901 }
            - { name: admin, containerPort: 3903 }
          # The image has no shell. `garage status` asks the node over its own RPC port and exits
          # non-zero until it answers, so the probe opens no port to the kubelet.
          readinessProbe:
            exec:
              command: ["/garage", "status"]
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - { name: config, mountPath: /etc/garage.toml, subPath: garage.toml, readOnly: true }
            - { name: data, mountPath: /var/lib/garage }
      volumes:
        - name: config
          configMap: { name: garage-config }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
