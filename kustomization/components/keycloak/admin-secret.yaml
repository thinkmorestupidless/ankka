# Keycloak's bootstrap administrator, referenced by name from keycloak.yaml.
#
# A development default so a freshly deployed local cluster has an admin console to add users in
# with no extra step — the same role token-secret.yaml played before feature 008. Public in this
# repository, so the remote overlay *deletes* it rather than overriding it; the Keycloak resource
# names this secret explicitly, and with it absent the operator cannot create the instance until a
# real one is created out of band. A platform whose identity provider will not start is loud; one
# whose admin password is in a public repository is not.
apiVersion: v1
kind: Secret
metadata:
  name: ankka-keycloak-admin
  namespace: ankka-auth
  labels:
    app.kubernetes.io/managed-by: ankka
type: Opaque
stringData:
  username: admin
  password: admin
