# Tells the control plane that erasure is on, where the keyring is (it destroys keys and reads an
# erasure's progress there as ankka://platform/controlplane), and how it reaches the erasure log's
# second copy, the platform bucket `platform.erasure-log`, with the credential the operator writes
# into ankka-erasure-log in this namespace. Without the component it reports erasure off and refuses
# every descriptor that declares personal fields.
#
# The container's name must be the control plane's own, `ankka-controlplane`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ankka-controlplane
  namespace: ankka-controlplane
spec:
  template:
    spec:
      containers:
        - name: ankka-controlplane
          env:
            - name: ANKKA_ERASURE
              value: "on"
            - name: ANKKA_KEYRING_ADDRESS
              value: "https://keyring.ankka-keyring.svc:8443"
            - name: ANKKA_S3_ENDPOINT
              value: "http://garage.garage-system.svc.cluster.local:3900"
            - name: ANKKA_S3_REGION
              value: "garage"
            - name: ANKKA_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: ankka-erasure-log, key: ANKKA_S3_ACCESS_KEY }
            - name: ANKKA_S3_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: ankka-erasure-log, key: ANKKA_S3_SECRET_KEY }
