# The keyring's secret key: what its own secret store, which holds the installation's root key, is
# encrypted under. A DEVELOPMENT value, public in this repository; the cloud overlay deletes this
# Secret, and the keyring then refuses to start until the installation creates its own.
apiVersion: v1
kind: Secret
metadata:
  name: ankka-keyring-secret-key
  namespace: ankka-keyring
type: Opaque
stringData:
  key: "ZGV2ZWxvcG1lbnQta2V5cmluZy1zZWNyZXQta2V5ISE="
