apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: models
  namespace: models-system
  labels:
    app.kubernetes.io/name: models
spec:
  serviceName: models
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: models
  template:
    metadata:
      labels:
        app.kubernetes.io/name: models
    spec:
      # Nothing in the pod talks to the API server.
      automountServiceAccountToken: false
      containers:
        - name: ollama
          image: ollama/ollama:0.40.6
          imagePullPolicy: IfNotPresent
          env:
            # Loopback only, and no port declared: the keeper is the only way in.
            - { name: OLLAMA_HOST, value: "127.0.0.1:11434" }
            # Nothing is unloaded at idle; the keeper's load asks the same.
            - { name: OLLAMA_KEEP_ALIVE, value: "-1" }
            # Calls run at once; an overlay raises it, with ANKKA_KEEPER_PARALLEL to the same value.
            - { name: OLLAMA_NUM_PARALLEL, value: "1" }
            - { name: OLLAMA_MODELS, value: /var/lib/ollama }
            - { name: OLLAMA_NO_CLOUD, value: "true" }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "2", memory: 4Gi }
          volumeMounts:
            - { name: models, mountPath: /var/lib/ollama }
        - name: keeper
          # The overlay's images: block renames it to the registry and the release.
          image: ankka-model-keeper:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: ANKKA_KEEPER_OLLAMA, value: "http://127.0.0.1:11434" }
            - { name: ANKKA_KEEPER_DECLARATION, value: /etc/ankka/models/models.json }
            - { name: ANKKA_KEEPER_ADDRESS, value: "https://models.models-system.svc:8443" }
            # The same value as OLLAMA_NUM_PARALLEL: a call beyond it is counted as waiting.
            - { name: ANKKA_KEEPER_PARALLEL, value: "1" }
            # Where the keeper's spans and metrics go; empty sends nothing. The overlay replaces it
            # from ankka-platform.otlpEndpoint, as it does the operator's and the control plane's.
            - { name: ANKKA_OTLP_ENDPOINT, value: "" }
          ports:
            - { name: models, containerPort: 8443 }
            - { name: status, containerPort: 8080 }
            - { name: probe, containerPort: 7627 }
          # Ready once a pass has run against Ollama: the first fetch is minutes, and the Service
          # publishes the address before then so the status can say `fetching`.
          readinessProbe:
            httpGet: { path: /ready, port: probe }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /live, port: probe }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 192Mi }
            limits: { cpu: 250m, memory: 256Mi }
          volumeMounts:
            - { name: ankka-service-tls, mountPath: /var/run/secrets/ankka/service, readOnly: true }
            - { name: declaration, mountPath: /etc/ankka/models, readOnly: true }
      volumes:
        - name: ankka-service-tls
          secret: { secretName: ankka-models-tls }
        - name: declaration
          configMap: { name: models-declaration }
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
