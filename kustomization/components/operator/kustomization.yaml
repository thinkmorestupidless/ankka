# The operator: its namespace, ServiceAccount, ClusterRole, ClusterRoleBinding and Deployment.
#
# `operator.yaml` is symlinked from the same file the operator's own README section documents as
# the install manifest — see the kustomize load-restrictor trap in .claude/rules/kubernetes.md.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - operator.yaml
