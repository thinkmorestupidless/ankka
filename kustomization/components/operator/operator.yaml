# The ankka operator: identity, permissions, and the deployment itself.
#
# Single copy — the k3s suites apply this exact file, so a manifest that does not work
# cannot pass CI. Applying it twice is a no-op.
#
# Install the CustomResourceDefinition first:
#   kubectl apply -f ankka/crd/ankkaservice.yaml
#   kubectl apply -f ankka/install/operator.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: ankka-operator
  labels:
    app.kubernetes.io/managed-by: ankka
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ankka-operator
  namespace: ankka-operator
  labels:
    app.kubernetes.io/managed-by: ankka
---
# The permissions are the security property, so they are listed exhaustively and kept tight.
#
# Absences that are deliberate and load-bearing:
#
#   - No `update` or `patch` on ankkaservices itself, only on its status subresource. The
#     operator therefore cannot rewrite desired state, even with a bug.
#   - `secrets` has `create` and `patch`, and no `get`: the operator writes a Secret once and learns
#     from a conflict that one is already there, so it cannot read any Secret back — a credential
#     it wrote, or a key cert-manager issued. No `list` either, and no `delete` on `secrets` or on
#     the CNPG kinds below: nothing this
#     platform does may destroy a database or the credentials that unlock it. (`delete` *is*
#     granted on deployments and services, which hold no data.) A descriptor's *own* env-var secret references still go straight to the
#     kubelet, never through the operator, so "a status detail can never contain a value from one
#     of those" remains structural.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ankka-operator
  labels:
    app.kubernetes.io/managed-by: ankka
rules:
  - apiGroups: ["ankka.thinkmorestupidless.com"]
    resources: ["ankkaservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ankka.thinkmorestupidless.com"]
    resources: ["ankkaservices/status"]
    verbs: ["get", "update", "patch"]
  # A project's declared topics (feature 027): as for a service, the declarations are read-only to
  # the operator and only the status is written.
  - apiGroups: ["ankka.thinkmorestupidless.com"]
    resources: ["ankkaprojects"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ankka.thinkmorestupidless.com"]
    resources: ["ankkaprojects/status"]
    verbs: ["get", "update", "patch"]
  # A request to the installation's cloud provider (feature 044). The operator writes the request
  # by server-side apply ("patch" with "create": an apply is a PATCH even for a new object) and
  # reads the provider's answer. No "update" or "patch" on the status: the answer is the
  # provider's alone. No "delete": a request goes with its owner, by the garbage collector, and
  # nothing in a cloud goes with it.
  - apiGroups: ["ankka.thinkmorestupidless.com"]
    resources: ["cloudresources"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["ankka.thinkmorestupidless.com"]
    resources: ["cloudresources/status"]
    verbs: ["get"]
  # "patch" alongside "create": ensureNamespace writes via server-side apply, which is always
  # a PATCH even for an object that does not exist yet — "create" alone 403s on first use.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # A service's in-cluster address (feature 003). "patch" is required, not optional: every ensure
  # here is a server-side apply, which is a PATCH even for an object that does not exist yet.
  # "delete" IS granted, unlike on the CNPG kinds and secrets below — that withholding protects
  # *data*, and a Service holds none. It is used by exactly one action, which first checks the
  # Service is owned by the AnkkaService in hand and leaves anyone else's alone.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Read-only, and only to explain why a Deployment is not ready. Since feature 004 this is also
  # what lets the operator GRANT the same three verbs to a service (below): Kubernetes refuses to
  # let a principal create a Role granting what it does not itself hold, so no escalate/bind.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # The mover's Jobs, which copy a service's objects from Garage to Google Cloud Storage and check
  # them (feature 039). Owned by the AnkkaService and removed by their own time-to-live, so no
  # delete; "patch" because the ensure is a server-side apply. A Job names the service's Secrets
  # and holds no value, and runs as the service's own ServiceAccount, with no permission.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # A service's own identity and its one permission — reading its project's pods, so its nodes
  # can find each other (feature 004). All three are owned by the AnkkaService and go with it, so
  # no delete. "patch" because every ensure is a server-side apply, a PATCH even for a new object.
  # Proven under this ClusterRole's REAL identity by OperatorClusterSuite, not assumed: the suites
  # otherwise run the operator as admin, and this file has been wrong that way twice before.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # Database provisioning (feature 002). No delete anywhere below: nothing this platform does
  # may destroy a database, and withholding the verb makes that structural rather than a
  # promise the code keeps — retain reclaim policies are belt and braces on top of it.
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "databases", "databaseroles"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # create, to write a Secret once — a service's database location, its secret key, its storage
  # credential — and learn from a conflict that it is already there; patch, for server-side apply of
  # the telemetry Secret. No "get" and no "list": the operator writes credentials where a pod reads
  # them and can never read one back, its own included, nor an issued certificate's key. No
  # "delete": a credential, like the database it unlocks, is never destroyed.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch"]
  # The schema ConfigMap, one per project namespace.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # An exposed service's route (feature 005): one HTTPRoute in the service's namespace, attached
  # to the installer's Gateway. delete, because unexposing removes the route while the service —
  # its owner — stays. And its BackendTLSPolicy (feature 014), rendered and removed with the route,
  # telling the gateway to reach the service over TLS. Nothing on gateways, gatewayclasses,
  # referencegrants or envoyproxies: the operator cannot change where traffic enters.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "backendtlspolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # A service's custom hostnames (feature 045): one ListenerSet in its namespace, a listener per
  # hostname, which the Gateway admits by selector. Still nothing on gateways: a set can add a
  # listener for a hostname and cannot change the Gateway's own, and the operator renders none under
  # the base domain, whose names a more specific listener would take.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["listenersets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Read only: the authority's reason a custom hostname's certificate is not issued yet, which is
  # what a member is shown. cert-manager's own objects; the operator never writes one.
  - apiGroups: ["acme.cert-manager.io"]
    resources: ["challenges"]
    verbs: ["get", "list", "watch"]
  # Zero trust (feature 014). The operator *requests* each workload's certificates — cluster,
  # service, database — and a project's database authority, an Issuer over a self-signed root in
  # the project's namespace. It cannot read what cert-manager issues: its grant on Secrets has no
  # `get`. No clusterissuers: the installation's
  # authorities are the installer's, and the operator cannot replace one. delete, because a
  # certificate or policy belongs to its service and goes with it — and an owned object is only
  # ever deleted after an owner check.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Who may connect to a workload's ports: its own pods on the cluster ports, the gateway and ankka
  # workloads on its HTTP port, its project's workloads on a project's database (feature 014).
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Read-only, for one reason: a pod that is running and never ready says why only in its events —
  # a readiness probe refused, a certificate's Secret not issued yet — and `services get` should say
  # it in the kubelet's words rather than "the deadline passed" (feature 014).
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ankka-operator
  labels:
    app.kubernetes.io/managed-by: ankka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ankka-operator
subjects:
  - kind: ServiceAccount
    name: ankka-operator
    namespace: ankka-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ankka-operator
  namespace: ankka-operator
  labels:
    app.kubernetes.io/managed-by: ankka
    app.kubernetes.io/name: ankka-operator
spec:
  # One. The operator holds an informer cache and a work queue keyed by resource; a second
  # replica would be a second writer with no leader election between them. Horizontal scale
  # would mean adding a lease, which one cluster does not need.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ankka-operator
  strategy:
    # Never two operators at once, even briefly during a rollout.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: ankka
        app.kubernetes.io/name: ankka-operator
    spec:
      serviceAccountName: ankka-operator
      containers:
        - name: ankka-operator
          image: ankka-operator:latest
          imagePullPolicy: IfNotPresent
          env:
            # Must match the control plane's namespace-prefix. A mismatch presents as every
            # service reporting that no operator has reported on it.
            - name: ANKKA_K8S_NAMESPACE_PREFIX
              value: "ankka"
            # The domain every exposed service's hostname sits under; replaced by the overlay
            # from the ankka-platform ConfigMap. Must match the control plane's, which derives
            # the same hostname for display and refusals.
            - name: ANKKA_BASE_DOMAIN
              value: "BASE_DOMAIN"
            # The image the operator runs beside a `hosting: process` service (feature 009). The same
            # tag the other images use locally: built by `sbt docker:publishLocal`, loaded by
            # deploy-local.sh, never pulled. A registry deployment sets it with the others.
            - name: ANKKA_SIDECAR_IMAGE
              value: ankka-sidecar:latest
            # The platform's proxy, run beside a `hosting: web` service's process (feature 021). The
            # same local tag and the same rule as the sidecar's.
            - name: ANKKA_PROXY_IMAGE
              value: ankka-proxy:latest
            # The program a move of a service's bucket runs as a Job (feature 039). The same local tag
            # and the same rule as the sidecar's.
            - name: ANKKA_STORAGE_MOVER_IMAGE
              value: ankka-storage-mover:latest
            # The port the gateway's HTTPS listener is reached on, so a web-hosted service's proxy
            # can tell the process the address a browser used. Replaced by the overlay from
            # ankka-platform.httpsPort, as the control plane's is.
            - name: ANKKA_HTTPS_PORT
              value: "443"
            # Where every workload the operator renders exports its telemetry, and what it sends
            # with it: rendered onto each service's runtime container. The address is replaced by
            # the overlay from ankka-platform.otlpEndpoint; empty names no collector, and nothing
            # is exported. The headers are a credential, from the installation's own
            # ankka-telemetry Secret in this namespace when the collector wants one; the operator
            # writes them into each service's own Secret and never onto a Deployment.
            - name: ANKKA_OTLP_ENDPOINT
              value: ""
            # The ClusterIssuer every custom hostname's certificate is asked of (feature 045).
            # Replaced by the overlay from ankka-platform.hostnameIssuer; empty renders none.
            - name: ANKKA_HOSTNAME_ISSUER
              value: ""
            - name: ANKKA_OTLP_HEADERS
              valueFrom:
                secretKeyRef: { name: ankka-telemetry, key: headers, optional: true }
            # The store new buckets are made in, garage or gcs, Google Cloud Storage's bucket name
            # prefix and its soft-delete window (feature 039). Replaced by the overlay from
            # ankka-platform; an empty store is Garage when the garage component is installed.
            - name: ANKKA_OBJECT_STORE_BACKEND
              value: ""
            - name: ANKKA_OBJECT_STORE_PREFIX
              value: ""
            - name: ANKKA_OBJECT_STORE_SOFT_DELETE_DAYS
              value: "7"
            # The installation's cloud (feature 044): which provider fulfils its cloud requests, the
            # account and default location they are made in, its one wrapping key, how long a
            # request may go unanswered before a service says so, and the rotation grace a provider
            # honours. Replaced by the overlay from ankka-platform; "none" writes no request.
            - name: ANKKA_CLOUD_PROVIDER
              value: "none"
            - name: ANKKA_CLOUD_ACCOUNT
              value: ""
            - name: ANKKA_CLOUD_LOCATION
              value: ""
            - name: ANKKA_CLOUD_KMS_KEY
              value: ""
            - name: ANKKA_CLOUD_ACKNOWLEDGEMENT_BOUND
              value: "2m"
            - name: ANKKA_CLOUD_ROTATION_GRACE
              value: "1h"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
