# What the collector does with what it receives: prints every span and metric to its own log, in
# detail — the ids, the names and the attributes — and keeps none of it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: ankka-telemetry
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          exporters: [debug]
