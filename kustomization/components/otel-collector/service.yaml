# The address the installation's telemetry settings name:
# http://otel-collector.ankka-telemetry.svc.cluster.local:4318
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: ankka-telemetry
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
