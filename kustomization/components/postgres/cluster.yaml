# The control plane's own database, managed the same way as every service's from this point on
# — durable storage via a real PVC, not the emptyDir the hand-rolled Deployment this replaces
# used to run on.
#
# The one CNPG Cluster in this codebase that uses bootstrap.initdb: it hosts exactly one
# well-known database, so it does not need the per-service Database/DatabaseRole machinery the
# operator uses for everything else. bootstrap.initdb makes CNPG generate the credential secret
# itself (named "ankka-controlplane-db-app"), so there is no generated password to manage here
# either — see contracts/credentials.md for the exact keys that secret carries.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ankka-controlplane-db
  namespace: ankka-controlplane
  labels:
    app.kubernetes.io/managed-by: ankka
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: ankka
      owner: ankka
      # ankka's own schema, applied once at bootstrap as the database owner — CNPG's
      # declarative equivalent of docker-compose's docker-entrypoint-initdb.d mount, which a
      # CNPG-managed Postgres image does not expose. Refs are processed in array order, so
      # this preserves the same 10/20/30 ordering the DDL's own filenames encode. The
      # ConfigMap is generated by this component's configMapGenerator from ddl/, the DDL's
      # canonical copy (see kustomization.yaml for why it lives here).
      # CNPG runs every one of these as the "postgres" superuser, not as the "owner" role above
      # — so without the trailing 99-grants.sql, every table the DDL creates is owned by
      # "postgres" and unreadable by "ankka", the role the control plane actually connects as.
      # Found by deploying this for real: startup succeeded, then every write timed out with
      # "permission denied for table projection_management". 99-grants.sql is a literal in the
      # generator, not part of the single-copy DDL itself, since it is purely a consequence of
      # how CNPG's bootstrap mechanism runs SQL.
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: ankka-controlplane-schema
            key: 10-journal-postgres.sql
          - name: ankka-controlplane-schema
            key: 20-projection-postgres.sql
          - name: ankka-controlplane-schema
            key: 30-timers-postgres.sql
          - name: ankka-controlplane-schema
            key: 99-grants.sql
