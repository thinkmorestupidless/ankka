# The installation's broker, sized for the cluster it runs on. The broker component's values are a
# laptop's: one node, a 2Gi volume and a 512MB heap. Set each value marked SET.
#
# A new installation that wants three nodes lists components/broker-three-nodes after the broker and
# the control plane: it sets the node count and every setting that counts copies, the internal
# topics' included, and the control plane's default copies, together. Leave replicas below at the
# component's 3 when it is listed. It is not a way to grow a running single-node broker, whose node
# is its controller quorum too, and topics made before keep the copies they have.
#
# Strimzi's images come from quay.io; a cluster that pulls only through a cache of its own needs
# that cache to mirror quay.io/strimzi as well.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  namespace: ankka-broker
spec:
  replicas: 1 # SET: nodes, each both controller and broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi # SET: each node's storage
        deleteClaim: false
        kraftMetadata: shared
  jvmOptions:
    -Xms: 256m # SET
    -Xmx: 512m # SET: the heap, well inside the memory limit
  resources:
    requests:
      memory: 768Mi # SET
      cpu: 250m # SET
    limits:
      memory: 1Gi # SET
