# An example production overlay: ankka's control plane and operator on a real Kubernetes cluster,
# with a load balancer, a domain you control and images pulled from a registry. Copy this directory
# into the repository that describes your installation, set every value marked SET, and point the
# component paths at a checkout of this repository's `kustomization/` at the release you run.
#
# It is rendered by RemoteOverlaySuite on every build, so it stays in step with the components —
# a change to overlays/local that a production overlay needs too fails there, not on a cluster.
#
# The same components as overlays/local — the CRD, the operator, the control plane and its RBAC,
# CNPG, cert-manager, Envoy Gateway, the Gateway and the identity provider are not local-specific
# and are not copied here. What differs is only what *has* to:
#
#   * the gateway gets a LoadBalancer instead of pinned node ports   (loadbalancer.yaml)
#   * certificates come from a real CA over DNS-01, not a self-signed root   (acme-issuer.yaml)
#   * the base domain is a real one and HTTPS is on 443   (platform-configmap.yaml)
#   * Keycloak's development admin secret is *removed* rather than overridden   (see `patches` below)
#   * images come from a registry rather than `kind load`   (see the note on images below)
#
# This is not applied by deploy-local.sh, which refuses any context that is not the local kind
# cluster — deliberately, and that guard is worth keeping. Apply a copy by hand, against a context
# you have checked:
#
#   kubectl config current-context          # look at it. really look at it.
#   kubectl apply -k kustomization/components/cnpg --server-side --force-conflicts
#   kubectl apply -k kustomization/components/certmanager --server-side --force-conflicts
#   kubectl apply -k kustomization/components/envoy-gateway --server-side --force-conflicts
#   kubectl apply -f kustomization/components/broker/namespace.yaml --server-side
#   kubectl apply -k kustomization/components/broker/strimzi --server-side --force-conflicts
#   # wait for those four controllers to be Ready, then the one thing here that is not kustomize:
#   helm repo add certmanager-webhook https://puzzle.github.io/cert-manager-webhook-dnsimple
#   helm install cert-manager-webhook-dnsimple \
#     certmanager-webhook/cert-manager-webhook-dnsimple \
#     --namespace cert-manager --version 0.1.17 --set dnsimple.token='<DNSIMPLE_API_TOKEN>'
#   # then:
#   kubectl apply -k <your-overlay> --server-side --force-conflicts
#
# Or from a GitOps tool such as Flux, which is how a production installation should be applied: the
# overlay carries everything, so the same render works either way.
#
# CNPG, cert-manager and Envoy Gateway go first for the same reason deploy-local.sh installs them
# first: each brings CRDs that later resources are instances of, and `kubectl apply -k` gives no
# ordering guarantee between a CRD and a custom resource of that kind inside one invocation.
#
# The Helm step is the DNS-01 solver for DNSimple, which cert-manager does not implement natively —
# see acme-issuer.yaml for why that forces both a webhook and a ClusterIssuer. A DNS provider with a
# built-in solver needs neither.
#
# **Images.** Every component names an image without a registry (`ankka-controlplane:latest`) and
# sets `imagePullPolicy: IfNotPresent`, which is right for a node the image was copied onto and
# useless for a cluster that has to pull. The release workflow publishes every image to ghcr.io on
# each `v*` tag, public; the `images:` block below renames them there. A pull-through cache of
# ghcr.io in the cluster's own region is better still — pulls stay local, and a version it has
# fetched is still served when ghcr.io is down. The tag is the release; `latest` exists too and is
# never named here — a cluster runs a version that was built, tested and published as one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../components/cnpg
  - ../../components/certmanager
  - ../../components/trust-manager
  - ../../components/pki
  - ../../components/envoy-gateway
  - ../../components/crd
  - ../../components/gateway
  - ../../components/operator
  # The identity and settings an installation's cloud provider runs under (feature 044). Carried
  # whether or not a provider is named; with "none" nothing uses it.
  - ../../components/cloud-provider
  # The installation's broker, after the operator so its patch tells the operator where it is.
  # Strimzi's CRDs go first, as CNPG's do: apply components/broker/strimzi before the overlay.
  - ../../components/broker
  - ../../components/garage
  - ../../components/postgres
  - ../../components/keycloak-operator
  - ../../components/keycloak
  - ../../components/controlplane
  # After the control plane, whose Deployment it tells where the record of secret reads is kept.
  - ../../components/secret-reads
  - ../../components/console

resources:
  - platform-configmap.yaml
  - acme-issuer.yaml

# The release this cluster runs: the same version as the checkout of `kustomization/` the component
# paths above resolve to.
images:
  - name: ankka-controlplane
    newName: ghcr.io/thinkmorestupidless/ankka-controlplane
    newTag: "0.0.0" # SET: the release you run
  - name: ankka-operator
    newName: ghcr.io/thinkmorestupidless/ankka-operator
    newTag: "0.0.0" # SET
  - name: sample-shopping-cart
    newName: ghcr.io/thinkmorestupidless/sample-shopping-cart
    newTag: "0.0.0" # SET
  # The sidecar is not a container in any manifest here — the operator injects it beside every
  # process-hosted service — so the `images:` transformer never sees it. The operator learns the
  # name from ANKKA_SIDECAR_IMAGE, set by the patch below to the same registry and tag.
  - name: ankka-sidecar
    newName: ghcr.io/thinkmorestupidless/ankka-sidecar
    newTag: "0.0.0" # SET
  # The proxy, likewise: the operator runs it beside every web-hosted service's process, and learns
  # its name from ANKKA_PROXY_IMAGE, set by the patch below.
  - name: ankka-proxy
    newName: ghcr.io/thinkmorestupidless/ankka-proxy
    newTag: "0.0.0" # SET
  - name: ankka-console
    newName: ghcr.io/thinkmorestupidless/ankka-console
    newTag: "0.0.0" # SET

patches:
  # The sidecar image the operator injects, from the registry at this release's tag.
  - path: sidecar-image.yaml
    target:
      kind: Deployment
      name: ankka-operator
  # The proxy image the operator runs beside a web-hosted service's process, likewise.
  - path: proxy-image.yaml
    target:
      kind: Deployment
      name: ankka-operator
  # The broker sized for this cluster.
  - path: broker-size.yaml
    target:
      kind: KafkaNodePool
      name: dual
  # A real load balancer rather than the local overlay's pinned node ports.
  - path: loadbalancer.yaml
    target:
      group: gateway.envoyproxy.io
      version: v1alpha1
      kind: EnvoyProxy
      name: ankka

  # Remove Keycloak's development administrator outright. components/keycloak ships
  # `ankka-keycloak-admin` as admin/admin so a fresh local cluster has a console to add users in
  # with no extra step, and that value is public in this repository — patching it to something
  # else here would put the real password in git instead, which is worse. The Keycloak resource
  # names the secret explicitly, so with it deleted the operator cannot create the instance until
  # one exists, created out of band:
  #
  #   kubectl -n ankka-auth create secret generic ankka-keycloak-admin \
  #     --from-literal=username=admin --from-literal=password="$(openssl rand -base64 32)"
  #
  # An identity provider that will not start is a loud, immediate and obvious failure. One
  # reachable on the internet with an admin password published in a public repository is none of
  # those things. (The shared control plane token this patch used to delete no longer exists:
  # every caller is a Keycloak user, and there is no development user in the realm at all —
  # deploy-local.sh creates one, and only deploy-local.sh.)
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: ankka-keycloak-admin
        namespace: ankka-auth

  # The console's development secrets go the same way, for the same reason. Create the Secret out of
  # band once the realm exists (docs/platform/console.md gives the commands):
  #
  #   kubectl -n ankka-console create secret generic ankka-console-secrets \
  #     --from-literal=clientSecret="<the ankka-console client's secret, from Keycloak>" \
  #     --from-literal=sessionSecret="$(openssl rand -base64 48)"
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: ankka-console-secrets
        namespace: ankka-console

  # The object store's development secrets go the same way. Create both out of band, with one token
  # in both namespaces (docs/platform/install-cloud.md gives the commands); until they exist the
  # store and the operator do not start.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: garage-secrets
        namespace: garage-system
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: ankka-object-store-admin
        namespace: ankka-operator

  # The console's realm client, without the development secret and without the address a laptop's
  # console signs in from. With no secret in the import, Keycloak generates one; nothing secret is
  # ever written into this overlay. The client is the second in realm-import.json's list, which
  # RemoteOverlaySuite checks.
  - target:
      kind: KeycloakRealmImport
      name: ankka-realm
    patch: |-
      - op: test
        path: /spec/realm/clients/1/clientId
        value: ankka-console
      - op: remove
        path: /spec/realm/clients/1/secret
      - op: replace
        path: /spec/realm/clients/1/redirectUris
        value: ["https://CONSOLE_AUTHORITY/*"]

# Identical in mechanism to overlays/local: the base domain and HTTPS port are each written once,
# above, and copied into every place that must agree. Where the target holds a prefixed form
# (`*.BASE_DOMAIN`, `api.BASE_DOMAIN`), the replacement swaps only the label after the first dot,
# so the prefix survives.
replacements:
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.baseDomain
    targets:
      - select:
          kind: Certificate
          name: ankka-wildcard
        fieldPaths:
          - spec.dnsNames.0
        options:
          delimiter: "."
          index: 1
      - select:
          kind: Gateway
          name: ankka
        fieldPaths:
          - spec.listeners.[name=https].hostname
        options:
          delimiter: "."
          index: 1
      - select:
          kind: HTTPRoute
          name: ankka-controlplane
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: "."
          index: 1
      # The identity provider's route and its own idea of its hostname — the latter is what every
      # token's issuer names, and the control plane derives the same string from ANKKA_BASE_DOMAIN.
      - select:
          kind: HTTPRoute
          name: ankka-keycloak
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: "."
          index: 1
      - select:
          kind: Keycloak
          name: ankka-keycloak
        fieldPaths:
          - spec.hostname.hostname
        options:
          delimiter: "."
          index: 1
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_BASE_DOMAIN].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_BASE_DOMAIN].value
      - select:
          kind: HTTPRoute
          name: ankka-console
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: "."
          index: 1
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.consoleAuthority
    targets:
      - select:
          kind: Deployment
          name: ankka-console
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-console].env.[name=ANKKA_CONSOLE_AUTHORITY].value
      - select:
          kind: KeycloakRealmImport
          name: ankka-realm
        fieldPaths:
          - spec.realm.clients.[clientId=ankka-console].redirectUris.0
        options:
          delimiter: "/"
          index: 2
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.httpsPort
    targets:
      - select:
          kind: HTTPRoute
          name: https-redirect
        fieldPaths:
          - spec.rules.0.filters.0.requestRedirect.port
      - select:
          kind: HTTPRoute
          name: ankka-keycloak
        fieldPaths:
          - spec.rules.0.filters.0.requestHeaderModifier.set.0.value
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_HTTPS_PORT].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_HTTPS_PORT].value
  # Where every workload exports its telemetry: the operator renders it onto each service, and the
  # control plane exports there itself. Empty, as this example ships, names no collector.
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.otlpEndpoint
    targets:
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_OTLP_ENDPOINT].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_OTLP_ENDPOINT].value
  # The installation's secret store settings (feature 038): the operator passes them
  # to each service's platform program, the control plane chooses its project secret writer and
  # refuses secret-manager without a cloud provider. Unset or default renders nothing.
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.secretBackend
    targets:
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_SECRET_BACKEND].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_SECRET_BACKEND].value
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.secretMove
    targets:
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_SECRET_MOVE].value
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.secretVersionsKept
    targets:
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_SECRET_VERSIONS_KEPT].value
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.secretRecordRetention
    targets:
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_SECRET_RECORD_RETENTION].value
  # The installation's cloud (feature 044), written once in ankka-platform and copied onto the
  # operator, the control plane and the provider's settings, so the three cannot disagree about the
  # account they work in. The control plane has no use for the two durations.
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.cloudProvider
    targets:
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_CLOUD_PROVIDER].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_CLOUD_PROVIDER].value
      - select:
          kind: ConfigMap
          name: ankka-cloud
        fieldPaths:
          - data.ANKKA_CLOUD_PROVIDER
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.cloudAccount
    targets:
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_CLOUD_ACCOUNT].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_CLOUD_ACCOUNT].value
      - select:
          kind: ConfigMap
          name: ankka-cloud
        fieldPaths:
          - data.ANKKA_CLOUD_ACCOUNT
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.cloudLocation
    targets:
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_CLOUD_LOCATION].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_CLOUD_LOCATION].value
      - select:
          kind: ConfigMap
          name: ankka-cloud
        fieldPaths:
          - data.ANKKA_CLOUD_LOCATION
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.cloudKmsKey
    targets:
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_CLOUD_KMS_KEY].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_CLOUD_KMS_KEY].value
      - select:
          kind: ConfigMap
          name: ankka-cloud
        fieldPaths:
          - data.ANKKA_CLOUD_KMS_KEY
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.cloudAcknowledgementBound
    targets:
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_CLOUD_ACKNOWLEDGEMENT_BOUND].value
      - select:
          kind: ConfigMap
          name: ankka-cloud
        fieldPaths:
          - data.ANKKA_CLOUD_ACKNOWLEDGEMENT_BOUND
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.cloudRotationGrace
    targets:
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_CLOUD_ROTATION_GRACE].value
      - select:
          kind: ConfigMap
          name: ankka-cloud
        fieldPaths:
          - data.ANKKA_CLOUD_ROTATION_GRACE
