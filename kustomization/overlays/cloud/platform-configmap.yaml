# The one place this installation's base domain is written; kustomization.yaml's replacements copy
# it into the wildcard certificate, the Gateway's listener, both Deployments' environment and the
# control plane's own route, so the five places that must agree cannot disagree. Same mechanism as
# overlays/local, different values.
#
# `baseDomain` must be a domain whose DNS you control: a service exposed by this platform is
# reachable at <service>-<project>.<baseDomain>, the gateway serves one wildcard certificate for
# *.<baseDomain>, and issuing that certificate needs a DNS-01 challenge (see acme-issuer.yaml) —
# which is only possible for a zone you can write TXT records into.
#
# One label deep, and that is load-bearing. An exposed service is `<service>-<project>.example.com`
# — `cart-checkout.example.com`, not `cart.checkout.example.com` — because a wildcard covers
# exactly one label, for the certificate and for the Gateway listener alike. `Hostnames` in the
# `crd` module is the single derivation of that name, and expose-time refuses the two cases it
# cannot serve: a label over 63 characters, and a collision between hyphenated names.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ankka-platform
  namespace: ankka-gateway
data:
  baseDomain: example.com # SET
  # 443, unlike the local overlay's 8443: nothing is remapping ports here, the load balancer
  # listens on the real one. This is what the http->https redirect puts in its Location header, so
  # a wrong value sends every plain-HTTP caller somewhere that does not answer.
  httpsPort: "443"
  # The console's address as a browser reaches it: console.<baseDomain>, with :<httpsPort> unless it
  # is 443. Written out because a replacement cannot join the two above; RemoteOverlaySuite fails if
  # it disagrees with them.
  consoleAuthority: console.example.com # SET
  # The OpenTelemetry collector every service exports its spans and metrics to:
  # http://host:4318 or https://host. Empty exports nothing. When the collector wants a credential,
  # put it as name=value,name=value under the key `headers` of a Secret named ankka-telemetry in
  # both ankka-operator and ankka-controlplane, out of band; the operator copies it into each
  # service's own Secret. The platform installs no collector and no store here: they are the
  # installation's.
  otlpEndpoint: "" # SET to export
  # Where service secrets and project secrets are kept: postgres (each service's own database and
  # the cluster's Secrets) or secret-manager (Google Secret Manager; needs cloudProvider gcp and a
  # cloudAccount). The installation's to say, once.
  secretBackend: postgres # SET
  # A move from postgres to secret-manager, one phase at a time: copy, check, then remove. Each
  # service performs the phase when it next starts and reports it in its status. Empty: no move.
  secretMove: ""
  # On secret-manager, how many versions of a service secret are kept; older ones are destroyed.
  secretVersionsKept: "2"
  # How long the record of each read of a secret is kept before it is removed.
  secretRecordRetention: 365d
  # The installation's cloud provider (none, or gcp) and the cloud account and default location
  # its resources live in. secret-manager is refused while the provider is none.
  cloudProvider: none # SET
  cloudAccount: "" # SET
  cloudLocation: ""
