# The local platform with the installation's model server (feature 053). Rendered by
# `ANKKA_LOCAL_MODELS=on ./kustomization/deploy-local.sh` (`just deploy-models`) in place of
# `overlays/local`; nothing else differs. The first start fetches the declared model, about 520 MB
# for `qwen3:0.6b`, so the deploy waits minutes for the model server to be ready.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../local
components:
  - ../../components/models
replacements:
  # The keeper exports where the rest of the installation does.
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.otlpEndpoint
    targets:
      - select:
          kind: StatefulSet
          name: models
        fieldPaths:
          - spec.template.spec.containers.[name=keeper].env.[name=ANKKA_OTLP_ENDPOINT].value
