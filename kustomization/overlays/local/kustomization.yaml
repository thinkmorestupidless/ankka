# Everything needed to run ankka's control plane and operator against a local Kubernetes
# cluster, with no image registry — see kustomization/deploy-local.sh.
#
# Deliberately not one flat `namePrefix`/`namespace` like a typical kustomize overlay: the CRD
# is cluster-scoped, the operator and control plane each need their own namespace and their own
# tightly scoped ServiceAccount (that split is the point — see controlplane-rbac.yaml), and
# every project's own namespace (`ankka-{projectId}`) is created later, at runtime, by the
# control plane. A blanket namespace transformer would either fight all of that or do nothing
# useful, so each component states its own namespace explicitly instead.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../components/cnpg
  - ../../components/certmanager
  - ../../components/trust-manager
  - ../../components/pki
  - ../../components/envoy-gateway
  - ../../components/crd
  - ../../components/gateway
  - ../../components/operator
  # The identity and settings an installation's cloud provider runs under (feature 044). Carried
  # whether or not a provider is named; with "none" nothing uses it.
  - ../../components/cloud-provider
  # After the operator: its patch tells the operator where the broker is.
  - ../../components/broker
  - ../../components/garage
  - ../../components/postgres
  - ../../components/keycloak-operator
  - ../../components/keycloak
  - ../../components/controlplane
  # After the control plane, whose Deployment it tells where the record of secret reads is kept.
  - ../../components/secret-reads
  - ../../components/console
  # Where a developer reads their services' traces, metrics and logs: https://grafana.<base domain>.
  # Not the otel-collector component, which keeps nothing; the two make one namespace.
  - ../../components/telemetry-store

resources:
  - platform-configmap.yaml
  - local-ca.yaml

# The base domain, written once in platform-configmap.yaml and copied everywhere it must match.
# Where the target holds a prefixed form (`*.BASE_DOMAIN`, `api.BASE_DOMAIN`), the replacement
# swaps only the label after the first dot, so the prefix survives.
replacements:
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.baseDomain
    targets:
      - select:
          kind: Certificate
          name: ankka-wildcard
        fieldPaths:
          - spec.dnsNames.0
        options:
          delimiter: "."
          index: 1
      - select:
          kind: Gateway
          name: ankka
        fieldPaths:
          - spec.listeners.[name=https].hostname
        options:
          delimiter: "."
          index: 1
      - select:
          kind: HTTPRoute
          name: ankka-controlplane
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: "."
          index: 1
      # The identity provider's route and its own idea of its hostname — the latter is what every
      # token's issuer names, and the control plane derives the same string from ANKKA_BASE_DOMAIN.
      - select:
          kind: HTTPRoute
          name: ankka-keycloak
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: "."
          index: 1
      - select:
          kind: Keycloak
          name: ankka-keycloak
        fieldPaths:
          - spec.hostname.hostname
        options:
          delimiter: "."
          index: 1
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_BASE_DOMAIN].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_BASE_DOMAIN].value
      - select:
          kind: HTTPRoute
          name: ankka-console
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: "."
          index: 1
      - select:
          kind: HTTPRoute
          name: grafana
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: "."
          index: 1
  # The console's own address, host and port together, which the realm client's redirect address
  # and the console's origin check both need whole. RemoteOverlaySuite holds it to its derivation.
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.consoleAuthority
    targets:
      - select:
          kind: Deployment
          name: ankka-console
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-console].env.[name=ANKKA_CONSOLE_AUTHORITY].value
      - select:
          kind: KeycloakRealmImport
          name: ankka-realm
        fieldPaths:
          - spec.realm.clients.[clientId=ankka-console].redirectUris.0
        options:
          delimiter: "/"
          index: 2
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.httpsPort
    targets:
      - select:
          kind: HTTPRoute
          name: https-redirect
        fieldPaths:
          - spec.rules.0.filters.0.requestRedirect.port
      - select:
          kind: HTTPRoute
          name: ankka-keycloak
        fieldPaths:
          - spec.rules.0.filters.0.requestHeaderModifier.set.0.value
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_HTTPS_PORT].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_HTTPS_PORT].value
  # Where every workload exports its telemetry: the operator renders it onto each service, and the
  # control plane exports there itself. Empty names no collector.
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.otlpEndpoint
    targets:
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_OTLP_ENDPOINT].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_OTLP_ENDPOINT].value
  # The installation's secret store settings (feature 038): the operator passes them
  # to each service's platform program, the control plane chooses its project secret writer and
  # refuses secret-manager without a cloud provider. Unset or default renders nothing.
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.secretBackend
    targets:
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_SECRET_BACKEND].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_SECRET_BACKEND].value
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.secretMove
    targets:
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_SECRET_MOVE].value
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.secretVersionsKept
    targets:
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_SECRET_VERSIONS_KEPT].value
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.secretRecordRetention
    targets:
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_SECRET_RECORD_RETENTION].value
  # The installation's cloud (feature 044), written once in ankka-platform and copied onto the
  # operator, the control plane and the provider's settings, so the three cannot disagree about the
  # account they work in. The control plane has no use for the two durations.
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.cloudProvider
    targets:
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_CLOUD_PROVIDER].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_CLOUD_PROVIDER].value
      - select:
          kind: ConfigMap
          name: ankka-cloud
        fieldPaths:
          - data.ANKKA_CLOUD_PROVIDER
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.cloudAccount
    targets:
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_CLOUD_ACCOUNT].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_CLOUD_ACCOUNT].value
      - select:
          kind: ConfigMap
          name: ankka-cloud
        fieldPaths:
          - data.ANKKA_CLOUD_ACCOUNT
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.cloudLocation
    targets:
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_CLOUD_LOCATION].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_CLOUD_LOCATION].value
      - select:
          kind: ConfigMap
          name: ankka-cloud
        fieldPaths:
          - data.ANKKA_CLOUD_LOCATION
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.cloudKmsKey
    targets:
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_CLOUD_KMS_KEY].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_CLOUD_KMS_KEY].value
      - select:
          kind: ConfigMap
          name: ankka-cloud
        fieldPaths:
          - data.ANKKA_CLOUD_KMS_KEY
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.cloudAcknowledgementBound
    targets:
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_CLOUD_ACKNOWLEDGEMENT_BOUND].value
      - select:
          kind: ConfigMap
          name: ankka-cloud
        fieldPaths:
          - data.ANKKA_CLOUD_ACKNOWLEDGEMENT_BOUND
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.cloudRotationGrace
    targets:
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_CLOUD_ROTATION_GRACE].value
      - select:
          kind: ConfigMap
          name: ankka-cloud
        fieldPaths:
          - data.ANKKA_CLOUD_ROTATION_GRACE
