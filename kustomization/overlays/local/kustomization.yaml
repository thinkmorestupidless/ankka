# Everything needed to run ankka's control plane and operator against a local Kubernetes
# cluster, with no image registry — see kustomization/deploy-local.sh.
#
# Deliberately not one flat `namePrefix`/`namespace` like a typical kustomize overlay: the CRD
# is cluster-scoped, the operator and control plane each need their own namespace and their own
# tightly scoped ServiceAccount (that split is the point — see controlplane-rbac.yaml), and
# every project's own namespace (`ankka-{projectId}`) is created later, at runtime, by the
# control plane. A blanket namespace transformer would either fight all of that or do nothing
# useful, so each component states its own namespace explicitly instead.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../components/cnpg
  - ../../components/certmanager
  - ../../components/envoy-gateway
  - ../../components/crd
  - ../../components/gateway
  - ../../components/operator
  - ../../components/postgres
  - ../../components/keycloak-operator
  - ../../components/keycloak
  - ../../components/controlplane

resources:
  - platform-configmap.yaml
  - local-ca.yaml

# The base domain, written once in platform-configmap.yaml and copied everywhere it must match.
# Where the target holds a prefixed form (`*.BASE_DOMAIN`, `api.BASE_DOMAIN`), the replacement
# swaps only the label after the first dot, so the prefix survives.
replacements:
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.baseDomain
    targets:
      - select:
          kind: Certificate
          name: ankka-wildcard
        fieldPaths:
          - spec.dnsNames.0
        options:
          delimiter: "."
          index: 1
      - select:
          kind: Gateway
          name: ankka
        fieldPaths:
          - spec.listeners.[name=https].hostname
        options:
          delimiter: "."
          index: 1
      - select:
          kind: HTTPRoute
          name: ankka-controlplane
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: "."
          index: 1
      # The identity provider's route and its own idea of its hostname — the latter is what every
      # token's issuer names, and the control plane derives the same string from ANKKA_BASE_DOMAIN.
      - select:
          kind: HTTPRoute
          name: ankka-keycloak
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: "."
          index: 1
      - select:
          kind: Keycloak
          name: ankka-keycloak
        fieldPaths:
          - spec.hostname.hostname
        options:
          delimiter: "."
          index: 1
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_BASE_DOMAIN].value
      - select:
          kind: Deployment
          name: ankka-operator
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-operator].env.[name=ANKKA_BASE_DOMAIN].value
  - source:
      kind: ConfigMap
      name: ankka-platform
      fieldPath: data.httpsPort
    targets:
      - select:
          kind: HTTPRoute
          name: https-redirect
        fieldPaths:
          - spec.rules.0.filters.0.requestRedirect.port
      - select:
          kind: HTTPRoute
          name: ankka-keycloak
        fieldPaths:
          - spec.rules.0.filters.0.requestHeaderModifier.set.0.value
      - select:
          kind: Deployment
          name: ankka-controlplane
        fieldPaths:
          - spec.template.spec.containers.[name=ankka-controlplane].env.[name=ANKKA_HTTPS_PORT].value
