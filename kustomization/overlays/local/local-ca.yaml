# A certificate authority for the local cluster, and the one wildcard certificate the gateway
# serves. deploy-local.sh exports the root (ankka-root-ca's ca.crt) to ~/.ankka/local-ca.crt so the
# CLI (`config set ca`) and curl (`--cacert`) can verify it — nothing is ever installed into the
# machine's trust store, and nothing is ever served with verification turned off.
#
# A real installation replaces this file with its own issuer (DNS-01 for a wildcard) or a supplied
# certificate in the ankka-wildcard-tls secret; the components reference only that secret.
#
# The root lives in cert-manager's namespace and `ankka-ca` is a ClusterIssuer, because a custom
# hostname's certificate is issued in the service's own namespace (feature 045) and a Certificate
# can name only an Issuer beside it or a ClusterIssuer. A ClusterIssuer reads its `ca.secretName`
# in cert-manager's namespace — the trap that once made a namespaced Issuer the right shape here —
# so the root moved there rather than the issuer staying put.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ankka-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: ankka local CA
  secretName: ankka-root-ca
  duration: 87600h # ten years; a local root, never renewed under a running platform
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: Issuer
---
# The installation's own authority, for the wildcard and for every custom hostname
# (ANKKA_HOSTNAME_ISSUER=ankka-ca in platform-configmap.yaml). Its secret is in cert-manager's
# namespace, where a ClusterIssuer looks.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ankka-ca
spec:
  ca:
    secretName: ankka-root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ankka-wildcard
  namespace: ankka-gateway
spec:
  secretName: ankka-wildcard-tls
  dnsNames:
    - "*.BASE_DOMAIN"
  issuerRef:
    name: ankka-ca
    kind: ClusterIssuer
