# The one place the local deployment's base domain is written. kustomization.yaml's replacements
# copy it into the wildcard certificate, the Gateway's listener, both Deployments' environment and
# the control plane's own route — so the five places that must agree cannot disagree.
#
# 127.0.0.1.sslip.io: a public wildcard-DNS convention that resolves any name ending in an
# embedded address to that address, so cart-checkout.127.0.0.1.sslip.io reaches this machine with
# no hosts-file edit. A real installation puts a real domain here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ankka-platform
  namespace: ankka-gateway
data:
  baseDomain: 127.0.0.1.sslip.io
  # The host port kind publishes the HTTPS NodePort on (kustomization/kind.yaml); the http→https
  # redirect must name it. A real installation serving on 443 leaves this at 443.
  httpsPort: "8443"
  # The console's address as a browser reaches it: console.<baseDomain>, with the port when it is not
  # 443. Derivable from the two above, and written out because a replacement cannot join them;
  # RemoteOverlaySuite fails if it ever disagrees with them.
  consoleAuthority: console.127.0.0.1.sslip.io:8443
  # Where every workload exports its spans and metrics: the telemetry store this overlay lists,
  # which a developer reads at https://grafana.<baseDomain>.
  otlpEndpoint: http://lgtm.ankka-telemetry.svc.cluster.local:4318
  # The installation's object store: Garage, the component this overlay lists. A machine has no
  # Google Cloud Storage; the prefix and the window are Google Cloud Storage's and unused here.
  objectStoreBackend: garage
  objectStorePrefix: ""
  objectStoreSoftDeleteDays: "7"
  # Where service secrets and project secrets are kept: postgres (each service's own database and
  # the cluster's Secrets) or secret-manager (Google Secret Manager; needs cloudProvider gcp and a
  # cloudAccount). The installation's to say, once.
  secretBackend: postgres
  # A move from postgres to secret-manager, one phase at a time: copy, check, then remove. Each
  # service performs the phase when it next starts and reports it in its status. Empty: no move.
  secretMove: ""
  # On secret-manager, how many versions of a service secret are kept; older ones are destroyed.
  secretVersionsKept: "2"
  # How long the record of each read of a secret is kept before it is removed.
  secretRecordRetention: 365d
  # The installation's cloud (feature 044): which cloud provider fulfils its cloud requests, the
  # account and default location they are made in, its one wrapping key, how long a request may go
  # unanswered before a service says so, and how long a replaced credential goes on working. A
  # local cluster has no cloud: "none" writes no request, and everything is served here.
  cloudProvider: none
  cloudAccount: ""
  cloudLocation: ""
  cloudKmsKey: ""
  cloudAcknowledgementBound: 2m
  cloudRotationGrace: 1h
