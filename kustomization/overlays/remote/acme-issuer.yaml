# The wildcard certificate the gateway serves, from Let's Encrypt, over DNSimple.
#
# This replaces overlays/local/local-ca.yaml, and the contract it has to satisfy is exactly one
# thing: a Secret named `ankka-wildcard-tls` in `ankka-gateway`, holding a certificate valid for
# `*.<baseDomain>`. components/gateway/gateway.yaml names that secret on its HTTPS listener and
# knows nothing else about how it got there. Any issuer producing it will do — which is why the
# local overlay can sign its own and this one cannot.
#
# **DNS-01, not HTTP-01, and that is forced rather than chosen.** The certificate is a wildcard,
# and no CA will issue a wildcard against an HTTP-01 challenge — proving control of one hostname
# says nothing about every other name under it. So cert-manager has to write a TXT record into the
# zone, which means a credential for the DNS provider, in-cluster.
#
# **DNSimple is not one of cert-manager's built-in solvers.** The built-in list is ACMEDNS, Akamai,
# AzureDNS, Cloudflare, Google CloudDNS, RFC-2136, Route53 and DigitalOcean; everything else is an
# out-of-tree *webhook*, which is a real deployment with its own API service and RBAC. So unlike
# every other component here, this one is installed with Helm rather than kustomize — hand-writing
# an aggregated API server's PKI and apiservice registration would be a copy to maintain for no
# gain:
#
#   helm repo add certmanager-webhook https://puzzle.github.io/cert-manager-webhook-dnsimple
#   helm install cert-manager-webhook-dnsimple \
#     certmanager-webhook/cert-manager-webhook-dnsimple \
#     --namespace cert-manager \
#     --version 0.1.17 \
#     --set dnsimple.token='<DNSIMPLE_API_TOKEN>'
#
# `--namespace cert-manager` is not a preference: the chart's RBAC binds into its release
# namespace, and the webhook has to be reachable by cert-manager's own ServiceAccount.
#
# **A ClusterIssuer, where the local overlay uses a namespaced Issuer — and that is forced too.**
# The webhook resolves `tokenSecretRef` with *its own* ServiceAccount, in the namespace of the
# challenge (`Secrets(namespace).Get(...)` in the solver). The chart grants it a Role scoped to its
# release namespace and pinned by `resourceNames` to its own token secret. A namespaced Issuer in
# `ankka-gateway` therefore sends the webhook looking for a secret it has no permission to read,
# and issuance fails with a `forbidden` on the *token*, which reads nothing like the wildcard
# certificate being the problem. A ClusterIssuer resolves against cert-manager's namespace, which
# is precisely where the chart put both the secret and the Role.
#
# That is the exact mechanic CLAUDE.md records as a trap — "a ClusterIssuer looks up its secret in
# cert-manager's own namespace, not the Certificate's" — inverted. It made a ClusterIssuer wrong
# for the local CA, whose secret lives beside the Certificate; it makes a ClusterIssuer the only
# thing that works here, whose secret lives beside cert-manager. Same property, opposite answer.
#
# Two values to set, both marked SET:
#   1. `email` — where Let's Encrypt sends expiry warnings.
#   2. `accountID` — required only if the DNSimple token is a *user* token rather than an account
#      token. The solver calls `whoami` to resolve it otherwise, and a user token returns no
#      account, failing with "you are most likely using a user token without configuring an
#      account ID". Find it in the DNSimple URL: /a/<accountID>/domains.
#
# **Issue against staging first.** Let's Encrypt rate-limits failed production issuance hard (5 per
# account per hostname per week), and a DNS-01 misconfiguration is discovered by failing. Staging
# issues an untrusted certificate, which proves the whole path — webhook reachable, token valid,
# TXT record written and observed — without spending the budget. Swap the server line back once a
# staging certificate reaches Ready.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ankka-acme
spec:
  acme:
    # server: https://acme-staging-v02.api.letsencrypt.org/directory   # prove it here first
    server: https://acme-v02.api.letsencrypt.org/directory
    email: SET-ME@example.com # SET
    privateKeySecretRef:
      # cert-manager creates this; it is the ACME account key, not something you supply.
      name: ankka-acme-account
    solvers:
      - dns01:
          webhook:
            # The API group the chart registers its aggregated API service under, and the solver's
            # own name (`Name()` in the webhook's source). Both are the chart's defaults; if it is
            # installed with a different `groupName`, this must match it or cert-manager will not
            # find the solver at all.
            groupName: acme.dnsimple.com
            solverName: dnsimple
            config:
              tokenSecretRef:
                # The chart's own secret, in cert-manager's namespace — its name defaults to the
                # release name, and its Role pins `resourceNames` to exactly this.
                name: cert-manager-webhook-dnsimple
                key: token
              # accountID: "SET-ME"   # SET, only for a user token — see above
---
# Named and shaped like the local overlay's, because deploy-local.sh, the k3s suites and anything
# else that waits on the gateway wait on `certificate/ankka-wildcard` in `ankka-gateway` being
# Ready. Only the issuer differs — and its kind, for the reason above.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ankka-wildcard
  namespace: ankka-gateway
spec:
  secretName: ankka-wildcard-tls
  dnsNames:
    # BASE_DOMAIN is replaced from platform-configmap.yaml; the replacement swaps the label after
    # the first dot, so the `*.` prefix survives.
    - "*.BASE_DOMAIN"
  issuerRef:
    name: ankka-acme
    kind: ClusterIssuer
