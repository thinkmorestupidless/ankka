# The keyring's database at the moment: the latest base backup of the line keyring-db before it,
# and its archive up to it, from the keyring's own backup bucket. The owner's credential is the one
# the keyring already holds, so the restored database accepts it unchanged. It archives nothing
# until archive/ adds that.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keyring-db-restored
  labels:
    app.kubernetes.io/managed-by: ankka
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    recovery:
      source: line
      database: keyring
      owner: keyring
      secret:
        name: keyring-db-app
      recoveryTarget:
        targetTime: SET
  externalClusters:
    - name: line
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: ankka-backups
          serverName: keyring-db
