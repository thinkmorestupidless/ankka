# For an installation's own overlay: the keyring reads the restored cluster. List it as a strategic
# merge patch beside the keyring component, with SET replaced by the restored cluster's name.
# `valueFrom: null` removes the Secret reference the host replaces; the password and the user are
# the restored cluster's owner's, which are the same.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ankka-keyring
  namespace: ankka-keyring
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-postgres
          env:
            - name: ANKKA_DB_HOST
              value: SET-rw
              valueFrom: null
      containers:
        - name: ankka-keyring
          env:
            - name: ANKKA_DB_HOST
              value: SET-rw
              valueFrom: null
