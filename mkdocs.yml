# The documentation site. The source is docs/, plain Markdown with YAML frontmatter; this file only
# says how MkDocs renders it for people. Everything machine-facing — llms.txt, llms-full.txt, raw
# Markdown per page, docs-index.json and the agent skill — is rendered from the same tree by
# tools/docs (`uv run --project tools/docs docs build`). See docs/contributing/documentation.md.
site_name: ankka
site_description: A serverless application platform for agentic AI on the actor model — Akka's component model in Scala 3 on Apache Pekko, with services in Scala, Python or TypeScript.
site_url: https://docs.ankka.cloud/
repo_url: https://github.com/thinkmorestupidless/ankka
repo_name: thinkmorestupidless/ankka
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: target/docs-site

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  logo: assets/ankka-mark.svg
  favicon: assets/ankka-mark.svg
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    # Content tabs, linked: clicking "Python" switches every tab set on the page with that label,
    # and the choice is remembered in localStorage (scoped to the site) so it holds across pages
    # and sessions. Material reads it back in partials/javascripts/content.html on every load.
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode

# Deliberately plain: no admonitions, no snippet syntax. A page must read correctly with no renderer
# at all, because that is how a model most often receives it.
#
# The one exception is the language tabs a component page uses to show the same example in Scala,
# Python and TypeScript, and it is `pymdownx.blocks.tab` rather than `pymdownx.tabbed` on purpose.
# `tabbed` indents its content four spaces, which would (a) break tools/docs/snippets.py, whose
# INCLUDE and OPEN_FENCE patterns are anchored to the start of a line, and (b) leave a model reading
# the raw Markdown an indented fence. The blocks syntax keeps the fence flush left, so the include
# machinery is untouched, and `render.py` flattens `/// tab | Python` back to a bold label for every
# machine-facing rendering — so the plainness rule above still holds off the site.
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.superfences
  - pymdownx.blocks.tab:
      alternate_style: true

extra:
  generator: false
  # What tools/docs needs to know about this repository. The tool is written for any repository whose
  # documentation follows docs/contributing/documentation.md and finds the repository by this file;
  # everything that names a path, a vocabulary or a target in *this* one is here rather than in its
  # code, so another repository can take the tool as a dependency and write its own block.
  docs:
    # Frontmatter keys beyond title, description, kind and related, with the values a page may use.
    facets:
      languages: [scala, python, typescript, rust]
      components:
        - event-sourced-entity
        - key-value-entity
        - view
        - consumer
        - workflow
        - timed-action
        - agent
        - autonomous-agent
        - http-endpoint
        - grpc-endpoint
    # The curated SKILL.md files, and where the rendered skills are written, committed and checked.
    # Giter8 reads `$` as template syntax, so the template's copy escapes it.
    skills:
      source: tools/docs/skill
      targets:
        - path: marketplace/plugins/ankka/skills
        - path: ankka.g8/src/main/g8/.claude/skills
          escape: giter8
    # Who owns each `generated:start <name>` block. `external` blocks are rewritten by Scala suites
    # (CliReferenceSuite, ControlPlaneRoutesReferenceSuite) under -Dankka.docs.update=true.
    generated:
      configuration:
        kind: hocon
        files:
          - { path: modules/runtime/src/main/resources/reference.conf, scope: every service }
          - { path: modules/http/src/main/resources/reference.conf, scope: every service }
          - { path: modules/grpc/src/main/resources/reference.conf, scope: a service that serves gRPC }
          - { path: modules/telemetry-otlp/src/main/resources/reference.conf, scope: a service that exports telemetry }
          - { path: modules/agent/src/main/resources/reference.conf, scope: a service with agents }
          - { path: modules/runtime/src/main/resources/ankka-cluster-local.conf, scope: local mode }
          - { path: modules/runtime/src/main/resources/ankka-cluster-kubernetes.conf, scope: kubernetes mode }
        prefix: ankka.
        described-on: reference/configuration.md
      protocol:
        kind: protobuf
        directory: protocol/src/main/protobuf/ankka/protocol/v1
      cli:
        kind: external
      control-plane-routes:
        kind: external
      # Written by console/package/test/docs-properties.test.ts from src/ui/tokens.ts.
      console-properties:
        kind: external
    # Files outside docs/ that link to the site. The site's first home, GitHub Pages' project address,
    # is dead; a link to it reads as correct and goes nowhere, so it is refused wherever the site is
    # linked from.
    site-links:
      retired-hosts: [thinkmorestupidless.github.io]
      files:
        - README.md
        - sdks/python/README.md
        - sdks/python/pyproject.toml
        - sdks/typescript/README.md
        - sdks/typescript/package.json
        - marketplace/plugins/ankka/.claude-plugin/plugin.json
        - marketplace/.claude-plugin/marketplace.json
        - marketplace/README.md

