# The documentation site. The source is docs/, plain Markdown with YAML frontmatter; this file only
# says how MkDocs renders it for people. Everything machine-facing — llms.txt, llms-full.txt, raw
# Markdown per page, docs-index.json and the agent skill — is rendered from the same tree by
# tools/docs (`uv run --project tools/docs docs build`). See docs/contributing/documentation.md.
site_name: ankka
site_description: A serverless application platform for agentic AI on the actor model — Akka's component model in Scala 3 on Apache Pekko, with services in Scala or Python.
site_url: https://docs.ankka.cloud/
repo_url: https://github.com/thinkmorestupidless/ankka
repo_name: thinkmorestupidless/ankka
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: target/docs-site

# Internal design treatments that feed feature specifications. Not for the people using ankka.
exclude_docs: |
  design/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  logo: assets/ankka-mark.svg
  favicon: assets/ankka-mark.svg
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode

# Deliberately plain. No admonitions, tabs or snippet syntax: a page must read correctly with no
# renderer at all, because that is how a model most often receives it.
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.superfences

extra:
  generator: false

