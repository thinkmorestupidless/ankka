ankka {
  agent {
    # MCP servers an agent lists. Each is connected when the service starts, and its tools are
    # read then; a server that does not answer within connect-timeout fails the start, naming it.
    # A call to one of its tools that takes longer than call-timeout reaches the model as the
    # tool's error.
    mcp {
      connect-timeout = 10s
      connect-timeout = ${?ANKKA_MCP_CONNECT_TIMEOUT}
      call-timeout = 60s
      call-timeout = ${?ANKKA_MCP_CALL_TIMEOUT}
    }
  }
}
