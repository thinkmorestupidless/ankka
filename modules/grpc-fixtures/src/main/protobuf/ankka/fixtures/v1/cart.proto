// The service definitions ankka-grpc's own tests serve. Small on purpose: every kind of method
// once, a second definition for a call that reaches the wrong endpoint, and a third that no test
// serves, for a call that reaches nothing.
syntax = "proto3";

package ankka.fixtures.v1;

service CartService {
  rpc GetCart (GetCartRequest) returns (Cart);
  rpc AddItem (AddItemRequest) returns (Cart);
}

service CartStreams {
  rpc WatchCart   (GetCartRequest)        returns (stream Cart);
  rpc ImportItems (stream AddItemRequest) returns (ImportSummary);
  rpc Converse    (stream Line)           returns (stream Line);
}

service OrderService {
  rpc GetOrder (GetOrderRequest) returns (Order);
}

message GetCartRequest  { string cart_id = 1; }
message AddItemRequest  { string cart_id = 1; string product = 2; int32 quantity = 3; }
message Cart            { string cart_id = 1; repeated Item items = 2; string caller = 3; }
message Item            { string product = 1; int32 quantity = 2; }
message ImportSummary   { int32 count = 1; }
message Line            { string text = 1; int32 sequence = 2; }
message GetOrderRequest { string order_id = 1; }
message Order           { string order_id = 1; }
