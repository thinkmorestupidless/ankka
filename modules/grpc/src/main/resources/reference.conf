ankka.grpc {
  # Where a service serves its gRPC endpoints. Set by the platform from the descriptor's
  # `grpcPort` when it is deployed; on a developer's machine, the developer's to choose.
  interface = "0.0.0.0"
  interface = ${?ANKKA_GRPC_INTERFACE}

  port = 9090
  port = ${?ANKKA_GRPC_PORT}

  # The largest request a call may send. A larger one is refused before any handler runs. How
  # large an answer a caller accepts is the caller's own client's limit.
  max-message-size = 4MiB

  # How long a caller's connection lasts before it is asked to reconnect. It is what puts an
  # instance added to a service into the rotation of callers that were already connected.
  max-connection-age = 2m

  # How long calls in progress, streams included, are given to finish when a connection reaches
  # its age or the service stops. What has not finished then is ended as unavailable.
  shutdown-grace = 5s

  # How often an idle connection is asked whether its peer is still there, and how long the
  # answer is waited for. A caller that went away without saying so is found within the two,
  # and its calls are cancelled.
  keepalive-time = 30s
  keepalive-timeout = 10s
}
