ankka.http {
  interface = "0.0.0.0"
  interface = ${?ANKKA_HTTP_INTERFACE}

  port = 9000
  port = ${?ANKKA_HTTP_PORT}

  # How long to wait for a request body to arrive in full.
  body-timeout = 10s

  # A socket route's limits. Behind a sidecar these are the sidecar's, which holds the socket.
  socket {
    # The largest frame a client may send, as UTF-8 bytes of the whole message. A larger one closes
    # the socket "too large" (1009) without being read.
    max-frame-size = 64KiB
    max-frame-size = ${?ANKKA_SOCKET_MAX_FRAME_SIZE}

    # How many frames may wait for a handler that has not received them. One more closes the socket
    # "unread" (1008): a handler that only sends must still drain.
    unread-frames = 64
    unread-frames = ${?ANKKA_SOCKET_UNREAD_FRAMES}

    # How long a socket may be quiet before the platform pings it. Must be shorter than the server's
    # idle timeout (pekko.http.server.idle-timeout), which otherwise cuts a quiet socket off; the
    # service does not start when it is not.
    keep-alive = 20s
    keep-alive = ${?ANKKA_SOCKET_KEEP_ALIVE}
  }
}

# The grants that name this service, which `Callers.granted` admits by. The platform sets the file
# on a deployed service; with none, no caller holds a grant, and a local run's callers are all
# admitted anyway.
ankka.grants {
  file = ""
  file = ${?ANKKA_PROJECT_GRANTS}

  # Where the project's declarations are; with no file named, the grants are read beside them,
  # which is where the platform puts them.
  declarations = ""
  declarations = ${?ANKKA_PROJECT_DECLARATIONS}

  # How often the file's modification time is looked at. A grant takes effect, and a revocation
  # ends what it admitted, within this of the file changing on the pod.
  reload-interval = 10s
}

# Where a machine's token comes from, and where its keys are (feature 040). A request through the
# gateway carrying a valid token from this issuer is that machine; with none set, `machines.json`
# beside the project's declarations is read, which is where the platform writes them; with neither,
# no token is verified and a bearer leaves the caller as it was.
ankka.machines {
  issuer = ""
  issuer = ${?ANKKA_MACHINE_ISSUER}
  jwks-url = ""
  jwks-url = ${?ANKKA_MACHINE_JWKS_URL}
  # The authority the keys' address is trusted by; unset, the service certificate's own `ca.crt`.
  jwks-ca = ""
  jwks-ca = ${?ANKKA_MACHINE_JWKS_CA}
}
