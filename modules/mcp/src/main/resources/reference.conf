# MCP endpoints: what a service's client keys and its sign-in broker need.
#
# Nothing here is read unless the service registers `McpRuntime()`; an MCP endpoint that admits only
# tokens or named workloads needs none of it.

ankka.mcp {

  client-keys {
    # How often a key's use is written down. A key used on every request is touched in memory, and
    # the sweep writes the latest use at most once per interval per key, so a busy assistant does
    # not write on every call.
    last-use-interval = 1 minute

    # The read journal the per-node index follows the keys' events with. A copy of the runtime's
    # own query plugin, sharing its connection pool (`use-connection-factory`), polling every 500ms
    # instead of the plugin's 3s: a revoked key must be refused on every instance within a second,
    # and the services that use client keys should not have every projection
    # poll that often to get it.
    query = ${pekko.persistence.r2dbc.query}
    query.refresh-interval = 500ms
  }

  sign-in {
    # The access token the broker mints for a brokered MCP endpoint.
    token-lifetime = 1 hour
    # The refresh token beside it, replaced each time it is used.
    refresh-lifetime = 30 days
    # A pending authorization, and the code it becomes, before it is used.
    grant-lifetime = 10 minutes
    # A registered client that has not been used.
    client-lifetime = 30 days
    # The broker's signing keys: a new one this often, each kept this long, never fewer than one.
    rotate-every = 30 days
    keep-for = 31 days
  }
}
