# The KUBERNETES overlay: peers are discovered through the API server.
#
# Chosen by ANKKA_CLUSTER_MODE=kubernetes, which the operator sets — never the person writing a
# descriptor. Every substitution below is REQUIRED (${X}, not ${?X}): a missing POD_IP must be a
# startup failure that names it, not a node that quietly binds loopback and joins nothing.

ankka.cluster.formation = bootstrap

# A node downed by the split-brain resolver must exit, so that Kubernetes restarts it into a clean
# rejoin. Without this its actor system stops and the JVM lives on: a pod that is Running, never
# ready, and never restarted — measured in a real partition (feature 004, research R9).
#
# Here and NOT in the base, though the first draft put it there: in this overlay a process is a
# node and exiting is the point. Anywhere else — a test JVM hosting many actor systems in turn, a
# developer's tooling — it turns the first stopped system into a dead process. The offline test
# suite died that way within seconds of it landing in reference.conf.
pekko.coordinated-shutdown.exit-jvm = on

# Here, joining self IS the split this whole mechanism exists to prevent.
ankka.join-self-if-no-seed-nodes = off

pekko.remote.artery.canonical {
  hostname = ${POD_IP}
  port = 17355
}

# Remoting is mutual TLS with the service's own certificate (feature 014). Pekko's rotating-keys
# engine reads tls.key/tls.crt/ca.crt from the mount, re-reads them as cert-manager renews them, and
# after the handshake refuses a peer whose certificate shares no subject name with its own — every
# instance of a service holds the same certificate, and an instance of any other service never does.
# The key must be RSA and the certificate issued by a root, not an intermediate: the engine's own
# limits, which is why the platform's cluster authority is a self-signed root.
pekko.remote.artery {
  transport = tls-tcp
  ssl.ssl-engine-provider = "org.apache.pekko.remote.artery.tcp.ssl.RotatingKeysSSLEngineProvider"
  # All three files by name, not just the mount point: Pekko's own reference.conf derives them from
  # secret-mount-point, but it arrives already resolved, so overriding the mount point alone leaves
  # the engine reading Pekko's default path — found by TlsClusterFormationSuite, as a missing ca.crt.
  ssl.rotating-keys-engine {
    secret-mount-point = "/var/run/secrets/ankka/cluster"
    key-file = "/var/run/secrets/ankka/cluster/tls.key"
    cert-file = "/var/run/secrets/ankka/cluster/tls.crt"
    ca-cert-file = "/var/run/secrets/ankka/cluster/ca.crt"
  }
}

ankka.tls {
  cluster-directory = "/var/run/secrets/ankka/cluster"
  service-directory = "/var/run/secrets/ankka/service"
}

# Every HTTP connection is mutual TLS, and the router reads the caller from the client certificate
# pekko-http attaches to the request as a synthetic header.
ankka.http.tls.enabled = on
pekko.http.server.parsing.tls-session-info-header = on

ankka.probe.enabled = on

# Each read, keep and removal of a secret is recorded by the control plane, which every deployed
# instance reaches over its own certificate at the platform's fixed address. A default here rather
# than a variable the operator renders, so the record changed no pod template; the variable still
# wins, for an installation that reaches its control plane elsewhere.
ankka.secrets.records-url = "https://ankka-controlplane.ankka-controlplane.svc:9000"
ankka.secrets.records-url = ${?ANKKA_SECRET_RECORDS_URL}

# The control plane reads a deployed instance's topology over this port, presenting its own
# certificate, and nothing else may open it: the operator's network policy admits the control
# plane's pods alone, and the listener refuses any other identity in the handshake.
ankka.observability.observe.enabled = on

pekko.management {
  http {
    hostname = ${POD_IP}
    bind-hostname = "0.0.0.0"
    port = 7626
  }
  # /ready is 200 only once the node is a cluster member (Cluster Bootstrap's own check) AND every
  # extension with an opinion agrees — the HTTP server, once it has bound. Without the second, a
  # pod is briefly ready before it can answer a request.
  health-checks.readiness-checks.ankka-extensions = "com.thinkmorestupidless.ankka.runtime.ExtensionsReadinessCheck"
  # GET /ankka/version — the runtime version this image carries, beside what its descriptor
  # declared (feature 006). Route providers live under `http.routes`, not `routes`: the wrong
  # key is silently ignored and the path is 404 — found on the first deployed external service.
  http.routes.ankka-version = "com.thinkmorestupidless.ankka.runtime.VersionRoute"

  # The deployed exposure of the recorder every component invocation writes to. Locally the console
  # reads an ephemeral loopback endpoint instead, because management does not run there — it binds
  # a fixed port two services on one laptop would fight over. One recorder, two exposures, chosen
  # by where the process runs, exactly as formation is.
  http.routes.ankka-metrics = "com.thinkmorestupidless.ankka.runtime.ObservabilityRoute"

  cluster.bootstrap.contact-point-discovery {
    discovery-method = kubernetes-api
    service-name = ${ANKKA_CLUSTER_SERVICE}
    # min(instances, 2), decided by the operator: one instance must be able to form alone, and
    # at nr = instances a single unschedulable pod would hold the whole service down.
    required-contact-point-nr = ${ANKKA_CLUSTER_CONTACT_POINTS}
  }

  # Left empty on purpose. With a CA path bootstrap builds its own client context, which trusts but
  # presents nothing, and a management port that requires a client certificate refuses it. Empty, it
  # uses pekko-http's default client context, which ClusterFormation sets to present this service's
  # cluster certificate before bootstrap starts.
  cluster.bootstrap.contact-point.http-client.ca-path = ""
}

# The same labels the Deployment and the Service select on, rendered k=v,k=v by the operator —
# so a node can never mistake another service's pods for its own, even in a shared namespace.
pekko.discovery.kubernetes-api.pod-label-selector = ${ANKKA_CLUSTER_POD_SELECTOR}
