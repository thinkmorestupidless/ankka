# The LOCAL overlay: peers are named, and default to oneself.
#
# Chosen by NAKKA_CLUSTER_MODE being unset or "local". Merged beneath the service's own
# application.conf and above reference.conf by ClusterConfig; this file says only how nodes find
# each other, and reference.conf says nothing about it.

nakka.cluster {
  # ClusterFormation reads this: seed nodes if any are given, otherwise join self.
  formation = join-self-or-seeds

  # Comma-separated node addresses (pekko://nakka@host:port) of an existing node or nodes to join.
  # Empty means join self, which is what makes a laptop run need no configuration at all.
  #
  # nakka's own key, and a string, on purpose: an environment variable cannot become a HOCON
  # list, so `pekko.cluster.seed-nodes = ${?ENV}` is a type error at load. The formation step
  # splits this and joins programmatically — the same call it makes to join itself.
  seed-nodes = ""
  seed-nodes = ${?NAKKA_CLUSTER_SEED_NODES}
}

nakka.join-self-if-no-seed-nodes = on

pekko.remote.artery.canonical {
  hostname = "127.0.0.1"
  # Random, so that several services — and several test suites — can share one machine without
  # knowing about each other. Fix it on the node that others will join:
  #   NAKKA_CLUSTER_PORT=17355 sbt shoppingCart/run
  #   NAKKA_CLUSTER_SEED_NODES=pekko://nakka@127.0.0.1:17355 NAKKA_HTTP_PORT=9001 sbt shoppingCart/run
  port = 0
  port = ${?NAKKA_CLUSTER_PORT}
}
