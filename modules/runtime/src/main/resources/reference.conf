# Defaults for an ankka service. Everything here is overridable by an application.conf.
#
# The aim is that `Ankka.service.register(...).start()` works against the bundled
# docker-compose Postgres with no configuration at all, while staying honest about being
# a real cluster — the same code path a multi-node deployment takes.
#
# This file is the BASE of a three-layer configuration and, on purpose, says nothing about how
# a node finds its peers. That lives in exactly one overlay per means of execution —
# ankka-cluster-local.conf, ankka-cluster-kubernetes.conf — chosen by ANKKA_CLUSTER_MODE and
# merged beneath the service's own application.conf by ClusterConfig. A test greps this file
# for the words that would break that rule.

ankka {
  # How long a ComponentClient call waits before failing with ErrorCode.Timeout.
  ask-timeout = 10s

  observability {
    # Every component invocation is recorded, always, with no sampling and no switch. The cost of
    # that decision is bounded by one number: this ring holds the most recent spans and overwrites
    # the oldest, so memory is fixed rather than a function of uptime or traffic. A trace whose
    # oldest spans have been overwritten is reported as partial; it is never returned as a tree
    # that merely looks complete.
    #
    # 4096 spans is a few hundred requests of a service that calls three or four components per
    # request — enough to explain what just happened, which is what the local console is for, and
    # far too few to be mistaken for a history.
    ring-capacity = 4096

    # There is deliberately no price table here yet.
    #
    # Token counts come from the model provider and are reported as they are; money does not, and
    # needs a price the platform is told. A `prices {}` block was drafted and removed rather than
    # shipped unread: configuration that looks like a feature and changes nothing is worse than
    # configuration that is absent, because the first time anyone notices is when they have set it
    # and are waiting for an effect.
    #
    # Until a price source exists, the console shows tokens and reports cost as *unknown* — never
    # as zero, which would be read as free. That path is already built and is what a model with no
    # configured price will go on using once there is a table to miss from.
  }
}

pekko {
  loglevel = "INFO"
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  actor {
    provider = cluster

    # One binding covers every runtime message, journal record and snapshot, because
    # they all extend AnkkaSerializable.
    serialization-bindings {
      "com.thinkmorestupidless.ankka.runtime.AnkkaSerializable" = jackson-cbor
    }
  }

  cluster {
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    # Stated rather than inherited: the guidance that instance counts should be odd, and that two
    # instances cannot both survive a partition, follows from this and nothing else.
    split-brain-resolver.active-strategy = keep-majority

    sharding {
      # Entities are cheap to rehydrate from their journal, so idle ones should not hold
      # heap. Two minutes is long enough that a conversational or request-response
      # workload keeps its entity warm.
      passivation {
        strategy = default-idle-strategy
        default-idle-strategy.idle-entity.timeout = 120s
      }
    }
  }

  persistence {
    journal.plugin        = "pekko.persistence.r2dbc.journal"
    snapshot-store.plugin = "pekko.persistence.r2dbc.snapshot"
    state.plugin          = "pekko.persistence.r2dbc.state"

    r2dbc {
      dialect = "postgres"
      connection-factory {
        driver   = "postgres"
        host     = "localhost"
        host     = ${?ANKKA_DB_HOST}
        port     = 5432
        port     = ${?ANKKA_DB_PORT}
        database = "ankka"
        database = ${?ANKKA_DB_NAME}
        user     = "ankka"
        user     = ${?ANKKA_DB_USER}
        password = "ankka"
        password = ${?ANKKA_DB_PASSWORD}
      }
    }
  }
}
