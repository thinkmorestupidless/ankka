# Defaults for an ankka service. Everything here is overridable by an application.conf.
#
# The aim is that `Ankka.service.register(...).start()` works against the bundled
# docker-compose Postgres with no configuration at all, while staying honest about being
# a real cluster — the same code path a multi-node deployment takes.
#
# This file is the BASE of a three-layer configuration and, on purpose, says nothing about how
# a node finds its peers. That lives in exactly one overlay per means of execution —
# ankka-cluster-local.conf, ankka-cluster-kubernetes.conf — chosen by ANKKA_CLUSTER_MODE and
# merged beneath the service's own application.conf by ClusterConfig. A test greps this file
# for the words that would break that rule.

ankka {
  # The service's name, for a run on a developer's machine. Each view or consumer that reads a topic
  # does so under a consumer group named for the service, so two services on one broker never share
  # one; with no name stated a group is named for its component alone, as it always was. A deployed
  # service's name is read from the certificate the platform issued it, and this is not read there.
  service.name = ""
  service.name = ${?ANKKA_SERVICE_NAME}

  # How long a ComponentClient call waits before failing with ErrorCode.Timeout.
  ask-timeout = 10s

  # The secret store: values a service keeps by name, each encrypted with the service's secret key
  # before it reaches the ankka_secrets table. The key is the standard base64 of exactly 32 bytes
  # (`openssl rand -base64 32`); on the platform the operator makes one per service. Empty: the
  # service starts, and keeping or reading a secret fails naming ANKKA_SECRET_KEY. Set and not 32
  # bytes of base64: the service does not start.
  secrets {
    key = ""
    key = ${?ANKKA_SECRET_KEY}
  }

  # A call to another service (`services(name)`): how long it waits for the answer before failing
  # with ServiceUnanswered. Connecting has five seconds of its own. There is no per-call timeout. A
  # service in another language sets it through ANKKA_SERVICE_CLIENT_TIMEOUT, which goes to the
  # sidecar that makes its calls.
  service-client {
    timeout = 30s
    timeout = ${?ANKKA_SERVICE_CLIENT_TIMEOUT}
  }

  # Mutual TLS (feature 014). Off here and on in the Kubernetes overlay, where the operator mounts a
  # platform-issued certificate for each purpose. Each directory holds the three files cert-manager
  # writes into a CA-issued Secret: tls.key, tls.crt and ca.crt. A laptop is its own perimeter, so a
  # locally-run service speaks plain HTTP and every caller reads as the local machine.
  tls {
    # Remoting's own engine reads this directory too, through its rotating-keys provider; the
    # management server and the client that probes a peer's management read it through ankka.
    cluster-directory = ""
    # The HTTP server's identity, and the one a service presents when it calls another.
    service-directory = ""
    # How often a changed file is noticed. A renewed certificate reaches new connections within this,
    # and the one it replaces stays valid for hours, so there is no race to lose.
    reload-interval = 1m
  }

  http.tls.enabled = off

  # The kubelet cannot present a client certificate, and TLS client authentication belongs to a
  # listener, not a route — so once the management port demands one, readiness needs a listener of
  # its own. It answers GET /ready and nothing else, with the same checks management answers with.
  probe {
    enabled = off
    port = 7627
  }

  observability {
    # Every component invocation is recorded, always, with no sampling and no switch. The cost of
    # that decision is bounded by one number: this ring holds the most recent spans and overwrites
    # the oldest, so memory is fixed rather than a function of uptime or traffic. A trace whose
    # oldest spans have been overwritten is reported as partial; it is never returned as a tree
    # that merely looks complete.
    #
    # 4096 spans is a few hundred requests of a service that calls three or four components per
    # request — enough to explain what just happened, which is what the local console is for, and
    # far too few to be mistaken for a history.
    ring-capacity = 4096

    # Beside the ring, every invocation is counted by component and handler, since the instance
    # started: the counts a telemetry exporter sends, which the ring cannot give because it forgets.
    # This many pairs of component and handler are counted by name; any beyond are counted together
    # as "(other)", so the counts never fail and never grow. Pairs are fixed by what a service
    # registers and declares, so the limit is a guard rather than a setting to tune.
    max-counted-handlers = 1024

    # Calls between components are counted over a recent window, not since the service started: a
    # topology says what the service has been doing, and a count that only grows says less each
    # hour. A call made before the window is forgotten, and a pair of handlers nothing in the window
    # touched is not shown.
    call-window = 10m

    # The window is kept as this many slices, each cleared as it comes round again, so memory is
    # the pairs of handlers that called each other times this number, whatever the traffic. More
    # slices forget in finer steps and cost more memory per pair.
    call-buckets = 60

    # A second exposure of the topology, for a deployed service: a mutual TLS listener on every
    # interface that admits one peer, the installation's control plane, and serves the service's
    # description and its topology, nothing else. Off here; the Kubernetes overlay turns it on, and
    # the operator renders the port and the network policy that go with it. Not part of readiness.
    observe {
      enabled = off
      port = 7628
      peer = "ankka://platform/controlplane"
    }

    # How many other services a topology shows by name. The name of a service being called can come
    # from a request, so it is not bounded by what the code says: the first ones called are named,
    # and calls to any further service are counted together as "other services".
    max-external-services = 32

    # How many gRPC methods of other services a call is recorded under by name. A method's name comes
    # from a compiled service definition, so it is bounded by code; it is limited all the same, since
    # nothing a recorder names may grow without bound, and calls to any further method are recorded
    # together as "(other methods)".
    max-external-methods = 256

    # There is deliberately no price table here yet.
    #
    # Token counts come from the model provider and are reported as they are; money does not, and
    # needs a price the platform is told. A `prices {}` block was drafted and removed rather than
    # shipped unread: configuration that looks like a feature and changes nothing is worse than
    # configuration that is absent, because the first time anyone notices is when they have set it
    # and are waiting for an effect.
    #
    # Until a price source exists, the console shows tokens and reports cost as *unknown* — never
    # as zero, which would be read as free. That path is already built and is what a model with no
    # configured price will go on using once there is a table to miss from.
  }
}

pekko {
  loglevel = "INFO"

  # The service's extensions start stopping when shutdown begins and are waited for in this phase
  # (AnkkaService.registerShutdown), the last before the actor system terminates. A gRPC server gives
  # calls in progress its shutdown grace (5s) and then up to 5s more to close; an HTTP server
  # likewise. The phase's default of 5s would cut that short and terminate the system under a call
  # still in its grace. 20s stays inside a pod's default 30s termination grace, after its 5s preStop
  # sleep, and runs alongside the cluster leaving rather than after it.
  coordinated-shutdown.phases.before-actor-system-terminate.timeout = 20s
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  actor {
    provider = cluster

    # One binding covers every runtime message, journal record and snapshot, because
    # they all extend AnkkaSerializable.
    serialization-bindings {
      "com.thinkmorestupidless.ankka.runtime.AnkkaSerializable" = jackson-cbor
    }
  }

  cluster {
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    # Stated rather than inherited: the guidance that instance counts should be odd, and that two
    # instances cannot both survive a partition, follows from this and nothing else.
    split-brain-resolver.active-strategy = keep-majority

    sharding {
      # Entities are cheap to rehydrate from their journal, so idle ones should not hold
      # heap. Two minutes is long enough that a conversational or request-response
      # workload keeps its entity warm.
      passivation {
        strategy = default-idle-strategy
        default-idle-strategy.idle-entity.timeout = 120s
      }
    }
  }

  persistence {
    journal.plugin        = "pekko.persistence.r2dbc.journal"
    snapshot-store.plugin = "pekko.persistence.r2dbc.snapshot"
    state.plugin          = "pekko.persistence.r2dbc.state"

    r2dbc {
      dialect = "postgres"
      connection-factory {
        driver   = "postgres"
        host     = "localhost"
        host     = ${?ANKKA_DB_HOST}
        port     = 5432
        port     = ${?ANKKA_DB_PORT}
        database = "ankka"
        database = ${?ANKKA_DB_NAME}
        user     = "ankka"
        user     = ${?ANKKA_DB_USER}
        password = "ankka"
        password = ${?ANKKA_DB_PASSWORD}

        # TLS, and a client certificate instead of a password (feature 014) — applied by ankka's
        # customizer, which the plugin calls with this block. Empty mode: no TLS, as before. The
        # operator sets all four for a provisioned database; a service supplying its own may too.
        connection-factory-options-customizer = "com.thinkmorestupidless.ankka.runtime.DatabaseTls"
        ssl {
          mode = ""
          mode = ${?ANKKA_DB_SSL_MODE}
          root-cert = ""
          root-cert = ${?ANKKA_DB_SSL_ROOT_CERT}
          cert = ""
          cert = ${?ANKKA_DB_SSL_CERT}
          key = ""
          key = ${?ANKKA_DB_SSL_KEY}
        }
      }
    }
  }
}
