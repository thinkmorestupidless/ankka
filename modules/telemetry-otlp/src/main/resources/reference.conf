# Telemetry export: what this module reads. It exports the spans an instance records and the
# invocations it counts to an OpenTelemetry collector, over OTLP on HTTP. Logs are never exported:
# they stay on stdout, where a line written inside a handler names its trace.
#
# On the platform the operator sets ANKKA_OTLP_ENDPOINT and ANKKA_OTLP_HEADERS from the
# installation's settings, and a descriptor may not. Anywhere else they are the environment's.

ankka.telemetry {
  # The collector's address: http://host:4318 or https://host[:port]. Empty exports nothing: no
  # thread is started and no connection is tried.
  endpoint = ""
  endpoint = ${?ANKKA_OTLP_ENDPOINT}

  # Sent with every export, as name=value,name=value: what a collector that asks for a credential
  # wants. On the platform it comes from a Secret, never a literal. Never logged.
  headers = ""
  headers = ${?ANKKA_OTLP_HEADERS}

  # How often recorded spans are read and sent. Sooner when the unread spans pass half the trace
  # window, so a busy instance loses fewer to the window's overwrite.
  interval = 1s

  # The most spans sent in one export.
  batch-size = 512

  # How long one export may take before it counts as a failure.
  export-timeout = 5s

  # While the collector cannot be reached the wait between tries doubles, from the interval up to
  # this. What the trace window overwrites meanwhile is lost, and counted.
  max-backoff = 30s

  # How often the invocation counts are sent. They count since the instance started.
  metric-interval = 10s

  # How long a stopping instance spends sending what it holds, collector or no collector.
  shutdown-timeout = 3s

  # Who the instance says it is, where it has no certificate to say so: a developer's machine, a
  # test. On the platform the certificate's ankka://<project>/<service> is used instead. Empty:
  # the actor system's name, and no project.
  service-name = ""
  project = ""
}
