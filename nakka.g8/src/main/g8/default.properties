# Parameters of the nakka service template. Expand with
#   sbt new thinkmorestupidless/nakka.g8 --name=orders
# or, with the CLI on PATH, `nakka init orders`.
#
# `nakka_version` is the platform version this template was released with: the artifact version
# the generated build resolves AND the runtime version the generated descriptor declares — one
# parameter, two places, so they cannot drift. Rewritten from the build's version by the
# `templateVersion` task on every release; `nakka init` passes its own version instead. Do not edit
# it by hand.
name=my-service
package=com.example.$name;format="word,lower"$
nakka_version=0.0.0
description=A nakka service
