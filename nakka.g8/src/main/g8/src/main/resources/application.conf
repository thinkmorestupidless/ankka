# Your service's configuration. Anything here sits above nakka's defaults (nakka-runtime's
# reference.conf, which documents every key) and above the platform's cluster overlay, so it wins.
#
# Nothing is needed to start. The database defaults to localhost:5432, nakka/nakka/nakka — what
# docker-compose.yml starts — and in a nakka deployment the platform sets NAKKA_DB_HOST,
# NAKKA_DB_PORT, NAKKA_DB_NAME, NAKKA_DB_USER and NAKKA_DB_PASSWORD from the database it provisioned.
# To point a local run elsewhere, set those variables rather than editing keys here.
#
# The HTTP port defaults to 9000 and is set by NAKKA_HTTP_PORT; the platform sets that too.
