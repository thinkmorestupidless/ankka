# The carts as a graph in Neo4j, with no program of ours in the pipeline.
#
# The shopping cart publishes graph deltas to `cart-graph` itself (CartGraph and CartContentsGraph).
# This ankka-flow pipeline is the built-in merge sink alone, reading that topic.
blueprint {
  name = cart-graph
  streamlets {
    # Built into ankka-flow's sidecar: no image, and a pod with only the sidecar in it.
    graph = builtin/neo4j-merge-sink
  }
  topics {
    # Declared as the pipeline's own, under the name the service publishes to, so ankka-flow creates
    # it — compacted, because it carries graph deltas — before the service writes its first record.
    # Deploy the pipeline first: a broker that creates topics on first use would make it uncompacted.
    cart-graph {
      topic.name = "cart-graph"
      consumers  = [graph.in]
      partitions = 3
      replicas   = 1
      consumer-config { auto.offset.reset = earliest }
    }
  }
}
