# How long a call through the component client waits, and how long the HTTP server holds a request
# open, when the descriptor says. The stock helper's turn on an installation model running on a
# processor takes minutes, longer than the platform's ten seconds and pekko-http's twenty; the
# platform's cluster suite sets all three above the model timeout, the request's above the call's
# and the idle timeout above the request's, or the idle timeout (sixty seconds) cuts the connection
# while the request waits.
ankka.ask-timeout = ${?CART_ASK_TIMEOUT}
pekko.http.server.request-timeout = ${?CART_REQUEST_TIMEOUT}
pekko.http.server.idle-timeout = ${?CART_IDLE_TIMEOUT}
