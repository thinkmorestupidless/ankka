// The callback service, served by the sidecar on loopback: what a process calls back for.
syntax = "proto3";

package ankka.protocol.v1;

import "ankka/protocol/v1/payload.proto";
import "ankka/protocol/v1/discovery.proto";
import "ankka/protocol/v1/endpoint.proto";

service Client {
  rpc Invoke       (InvokeRequest)   returns (InvokeReply);
  rpc InvokeStream (InvokeRequest)   returns (stream StreamToken);
  rpc Query        (QueryRequest)    returns (QueryReply);
  rpc Schedule     (ScheduleRequest) returns (Empty);
  rpc Cancel       (CancelRequest)   returns (Empty);

  // The service's secret store (protocol 1.6): named text values the runtime keeps in the
  // service's own database, encrypted with a key only the runtime holds. A refusal or a fault is
  // an Error in the reply, never a gRPC status, so that a module's import can carry it the same way.
  rpc GetSecret    (GetSecretRequest)    returns (GetSecretReply);
  rpc PutSecret    (PutSecretRequest)    returns (PutSecretReply);
  rpc DeleteSecret (DeleteSecretRequest) returns (DeleteSecretReply);

  // A call to another service, made by the runtime as this service (protocol 1.8). The runtime
  // resolves the service, presents this service's certificate and checks the other's; the process
  // never holds a key. A refusal or a fault is in the reply, never a gRPC status, so that a
  // module's import can carry it the same way.
  rpc Request (ServiceRequest) returns (ServiceReply);

  // A decision on an approval request (protocol 1.11): an agent's, answered as the handler that
  // waited would have been — the answer, or requests still or newly awaiting — or an autonomous
  // agent's, answered once it is recorded. A refusal is an Error in the reply.
  rpc Decide       (DecideRequest)       returns (InvokeReply);

  // A recurring timer (protocol 1.12): first due after the delay, then once every period, each due the
  // one before plus the period, until it is cancelled or replaced. `Cancel` cancels one. A runtime
  // older than 1.12 answers UNIMPLEMENTED, so a timer meant to recur is never scheduled as one that
  // fires once. A refusal is an Error in the reply, as for the secret store.
  rpc ScheduleRecurring (ScheduleRecurringRequest) returns (ScheduleRecurringReply);

  // Personal fields (protocol 1.15). The runtime holds the keyring's channel and its cache; a
  // process never reaches the keyring itself. `FetchSubjectKey` answers one fetch — a codec, which is
  // synchronous in every SDK, makes it as one blocking call on a miss — and `SubjectKeyEvents`, one
  // stream per process for its life, tells it of every subject erased so it drops its copy at once.
  rpc FetchSubjectKey  (KeyFetch) returns (KeyAnswer);
  rpc SubjectKeyEvents (Empty)    returns (stream SubjectDestroyed);
  // The lookup token of a value, made with the project's lookup key, which the process never holds.
  rpc LookupToken  (LookupTokenRequest)  returns (LookupTokenReply);
  // Deletes every object under `subjects/<subject>/` in the service's bucket. Only an erasure
  // handler calls it.
  rpc EraseObjects (EraseObjectsRequest) returns (EraseObjectsReply);
}

message KeyAnswer {
  oneof out {
    SubjectKey key = 1;
    SubjectDestroyed destroyed = 2;
    SubjectRefused refused = 3;
  }
}
// `create` only for a present value written in the process's own project.
message KeyFetch         { string subject = 1; string project = 2; bool create = 3; }
// `expires_millis`: how long the process may keep the key, so its copy expires with the runtime's.
message SubjectKey       { string subject = 1; string project = 2; bytes key = 3; int64 expires_millis = 4; }
// Erased: answered to a fetch, and sent on `SubjectKeyEvents` for every subject the runtime is told of.
message SubjectDestroyed { string subject = 1; string project = 2; string erasure_id = 3; }
// Not erased: this project may not read that one's subjects, the subject was never written, or
// the keyring could not be reached (`reason` says which; the process retries the last).
message SubjectRefused   { string subject = 1; string project = 2; string reason = 3; bool unavailable = 4; }

message LookupTokenRequest { bytes plaintext = 1; }
message LookupTokenReply   { oneof result { string token = 1; Error error = 2; } }

message EraseObjectsRequest { string subject = 1; }
message EraseObjectsReply   { oneof result { ErasedObjects erased = 1; Error error = 2; } }
message ErasedObjects { int64 count = 1; int64 final_at_millis = 2; }

message InvokeRequest {
  Kind kind = 1;
  string component_id = 2;
  string entity_id = 3;
  string name = 4;
  Payload payload = 5;
  Metadata metadata = 6;
}

message InvokeReply {
  oneof result {
    Outcome.Reply reply = 1;
    Error error = 2;
    ApprovalAwaited approval = 3;   // 1.11: an agent's turn waits for a person's decision
  }
}

message StreamToken {
  oneof token {
    string text = 1;
    Empty completed = 2;
    Error failed = 3;
    ApprovalAwaited approval = 4;   // 1.11: terminal, in place of completed
  }
}

// 1.11: the approval requests an agent's turn waits on.
message ApprovalAwaited { repeated ApprovalRequest requests = 1; }

message ApprovalRequest {
  string id = 1;
  string tool = 2;
  string arguments_json = 3;
  int64 requested_at_millis = 4;
  optional int64 expires_at_millis = 5;
}

message DecideRequest {
  Kind kind = 1;                  // AGENT or AUTONOMOUS_AGENT
  string component_id = 2;
  string entity_id = 3;           // the session, or the instance
  string name = 4;                // AGENT: the handler that was called, whose turn waits
  string approval_id = 5;
  bool approved = 6;
  string by = 7;                  // who decided; required
  optional string note = 8;
  Metadata metadata = 9;
}

// `metadata` (1.3): what the handler asking was given, as on `InvokeRequest`.
// `name` is "get", "all", or (1.13) one of the view's declared queries, asked with `values`.
message QueryRequest {
  string view_id = 1;
  string name = 2;
  Payload payload = 3;                 // the key, for "get"
  Metadata metadata = 4;
  map<string, string> values = 5;      // 1.13: a declared query's values
  optional uint32 limit = 6;           // 1.13: the most rows to read. Absent: 1000
}
message QueryReply   { oneof result { Payload rows = 1; Error error = 2; } }

message ScheduleRequest {
  string timer_id = 1;
  int64 delay_millis = 2;
  Kind kind = 3;
  string component_id = 4;
  optional string entity_id = 5;
  string name = 6;
  Payload payload = 7;
}

message CancelRequest { string timer_id = 1; }

// Both a delay and a period are given. There is no `kind` and no `entity_id`: a timer's target is a
// handler of a timed action. Scheduling again under a `timer_id` that already holds a recurring
// timer for the same `component_id`, `name` and `period_millis` keeps its next due and takes the
// payload, and `delay_millis` is not used; anything else under the id replaces it.
message ScheduleRecurringRequest {
  string timer_id = 1;
  int64 delay_millis = 2;    // from now to the first due; 0 or less is due at once
  int64 period_millis = 3;   // from each due to the next; from 1 to 36,500 days' worth
  string component_id = 4;   // a timed action
  string name = 5;           // one of its handlers
  Payload payload = 6;
}

message ScheduleRecurringReply { Error error = 1; }   // unset: scheduled

message GetSecretRequest { string name = 1; }

// Exactly one case is set. A reply with none is a fault, never "absent".
message GetSecretReply {
  oneof result {
    string value = 1;   // the secret; never empty
    Empty absent = 2;   // nothing is kept under the name
    Error error = 3;
  }
}

message PutSecretRequest { string name = 1; string value = 2; }
message PutSecretReply   { Error error = 1; }   // unset: kept

message DeleteSecretRequest { string name = 1; }
message DeleteSecretReply   { Error error = 1; }   // unset: removed, or there was nothing to remove

// A request to another service, by name: never an address, a host or a port.
message ServiceRequest {
  string service = 1;                         // the service's name
  optional string project = 2;                // absent: this service's own project
  string method = 3;                          // "GET", "POST", …
  string path = 4;                            // starts with "/"; the query is part of it
  repeated HttpRequest.Pair headers = 5;      // in order; the platform's own are removed
  optional string content_type = 6;
  optional bytes body = 7;                    // absent: no body
  Metadata metadata = 8;                      // what the handler asking was given
}

// Exactly one case is set. A reply with none is a fault.
message ServiceReply {
  oneof result {
    HttpResponse response = 1;                // the service answered, whatever its status
    ServiceFailure failure = 2;               // no answer came from the service
    Error error = 3;                          // the runtime refused to make the call
  }
}

message ServiceFailure {
  Reason reason = 1;
  string detail = 2;                          // what was tried, for the developer
  // UNANSWERED is zero on purpose: a reason a reader does not know reads as zero, and "no answer"
  // is the reading of an unknown failure that never sends anything twice.
  enum Reason {
    UNANSWERED = 0;                           // refused connection, broken, or no answer in time
    UNRESOLVABLE = 1;                         // no such service was found; nothing was sent
    IDENTITY_MISMATCH = 2;                    // what answered is not the service; nothing was sent
  }
}
