// Discovery: the first conversation. The developer's process describes its components and
// endpoints; the sidecar validates them and hosts exactly what it was told about.
syntax = "proto3";

package ankka.protocol.v1;

import "ankka/protocol/v1/payload.proto";

service Discovery {
  rpc Discover (SidecarInfo) returns (Spec);
  rpc ReportError (Problem) returns (Empty);   // why the sidecar refused; lands in the process's log
}

message SidecarInfo { string protocol_version = 1; string runtime_version = 2; }

message Spec {
  string protocol_version = 1;             // "1.0"
  SdkInfo sdk = 2;
  repeated Component components = 3;
  repeated Endpoint endpoints = 4;
}

message SdkInfo { string name = 1; string version = 2; }

enum Kind {
  EVENT_SOURCED_ENTITY = 0;
  KEY_VALUE_ENTITY = 1;
  WORKFLOW = 2;
  VIEW = 3;
  CONSUMER = 4;
  TIMED_ACTION = 5;
  AGENT = 6;
  AUTONOMOUS_AGENT = 7;           // protocol 1.2
}

message Component {
  Kind   kind = 1;
  string id = 2;
  repeated Handler handlers = 3;
  oneof detail {
    EventSourcedDetail event_sourced = 10;
    KeyValueDetail     key_value     = 11;
    WorkflowDetail     workflow      = 12;
    ViewDetail         view          = 13;
    ConsumerDetail     consumer      = 14;
    TimedActionDetail  timed_action  = 15;
    AgentDetail        agent         = 16;
    AutonomousAgentDetail autonomous_agent = 17;   // protocol 1.2
  }
}

message Handler { string name = 1; bool read_only = 2; bool streaming = 3; }

message EventSourcedDetail { int32 snapshot_every = 1; }          // 0: never
message KeyValueDetail {}
message WorkflowDetail {
  repeated string steps = 1;
  optional Settings settings = 2;              // absent: no overall limit, 30s a step, a failed step fails the workflow
  message Settings {
    optional int64 timeout_millis = 1;         // a ceiling on the whole workflow
    optional int64 default_step_timeout_millis = 2;
    optional Recovery default_recovery = 3;
    repeated StepSettings steps = 4;
  }
  message StepSettings { string step = 1; optional int64 timeout_millis = 2; optional Recovery recovery = 3; }
  message Recovery { int32 max_retries = 1; optional string failover_to = 2; }   // failover_to: a declared step, run with no input
}

message Source {
  oneof source { ComponentRef component = 1; string topic = 2; }
  message ComponentRef { Kind kind = 1; string id = 2; }
  // 1.7: where a topic source starts the first time its consumer group reads a partition. Only
  // with `topic`. Absent: a view starts at the earliest message; a consumer is refused.
  optional StartFrom start_from = 3;
  // 1.14, only with `topic`: the contract the component expects the topic to carry, checked at
  // start against the project's declaration; the declared broker the topic is on (absent: the
  // installation's); whether the partitions an instance holds are handled at once, each in order.
  optional Contract contract = 4;
  optional string broker = 5;
  optional bool parallel = 6;
  // 1.15, only with `topic`: the project whose topic this is, when it is not the service's own. The
  // broker refuses the subscription until that project grants the service consume on it; the
  // consumer group stays the service's own.
  optional string project = 7;
}

// 1.14: a name and the fingerprint of the schema document a component was built against:
// `sha256:` and the hex SHA-256 of the document under RFC 8785 (protocol/fixtures/contracts/).
message Contract { string name = 1; string fingerprint = 2; }

// 1.14: a topic a consumer publishes to, with the contract it states and the declared broker it is on.
// 1.15: `project` names another project's topic, which that project must grant produce on.
message Publication { string topic = 1; optional Contract contract = 2; optional string broker = 3; optional string project = 4; }

// 1.7
message StartFrom {
  oneof position {
    Named named = 1;
    int64 at_millis = 2;      // the first message published at or after this time, in ms since the epoch
  }
  enum Named {
    NAMED_UNSPECIFIED = 0;
    EARLIEST = 1;             // the oldest message the broker holds
    LATEST = 2;               // after the newest: only what is published from then on
  }
}

message ViewDetail {
  Source source = 1;              // a plain view's one source; absent for a keyed view
  string row_manifest = 2;
  repeated string queries = 3;
  // 1.7: with a topic source. 1.13: also with entity sources. A higher one rebuilds the view. Absent: 1
  optional uint32 version = 4;
  // 1.13: a keyed view's sources, each a component (an event sourced or a key value entity). When
  // present `source` is absent, the view's changes carry `source_id`, and its effects are `rows`.
  repeated Source sources = 5;
  // 1.13: the queries this view can be asked by name.
  repeated DeclaredQuery declared_queries = 6;
}

// 1.13: a statement over the view's own table. Its values are the `:name`s it holds.
message DeclaredQuery { string name = 1; string statement = 2; }
message ConsumerDetail {
  Source source = 1;
  optional string produces_to = 2;
  optional uint32 version = 3;    // 1.7: only with a topic source; a new one reads under a new group. Absent: 1
  // 1.14: the publication with its contract and broker; `produces_to` stays for a process that
  // states only the topic. Both present must name one topic.
  optional Publication produces = 4;
}
message TimedActionDetail {}

message AgentDetail {
  string role = 1;
  int32 max_tool_call_steps = 2;
  repeated Tool tools = 3;
  repeated string guardrails = 4;
  repeated McpServer mcp_servers = 5;        // 1.11: servers whose tools the sidecar offers the model
  repeated string result_guardrails = 6;     // 1.11: names the process answers CheckGuardrail RESULT for
}

message Tool {
  string name = 1;
  string description = 2;
  string input_schema_json = 3;
  optional Approval approval = 4;            // 1.11: unset, the tool runs when the model calls it
}

// 1.11: that a tool waits for a person's decision before it runs. With no time limit it waits until
// decided; with one, the platform refuses it when the limit passes.
message Approval { optional int64 within_millis = 1; }

// 1.11: an MCP server an agent lists. The sidecar connects to it when it starts, reads its tools and
// offers them as `mcp__<name>__<tool>`; the process is never asked to run one. Its address, and the
// value of each header, are read from the sidecar's own environment: a variable named here starts
// ANKKA_MCP_, and those reach only the platform's container.
message McpServer {
  string name = 1;                           // [a-z0-9-]+
  oneof address {                            // unset: ANKKA_MCP_<NAME>_URL must be set
    string url = 2;
    Service service = 3;
  }
  optional Approval approval = 4;            // every tool of the server
  repeated Header headers = 5;

  message Service { optional string project = 1; string name = 2; string path = 3; }
  message Header  { string name = 1; string variable = 2; }
}

// An autonomous agent's whole definition (protocol 1.2). There is nothing to plan per task: the
// sidecar runs the loop from this and asks the process only to run a tool (Agent.InvokeTool), check
// a guardrail (Agent.CheckGuardrail) and check a task rule (Agent.CheckTaskRule), each with the
// session id "task:<task id>".
message AutonomousAgentDetail {
  string description = 1;                   // required
  optional string instructions = 2;
  repeated Tool tools = 3;                  // never complete_task or fail_task, which are the sidecar's
  repeated string guardrails = 4;
  repeated TaskType task_types = 5;         // every type this agent accepts, declared once
  repeated TaskAcceptance accepts = 6;
  optional AutonomousSettings settings = 7;
  optional string model = 8;                // a name in the sidecar's configuration; absent: its default
  repeated McpServer mcp_servers = 9;       // 1.11
  repeated string result_guardrails = 10;   // 1.11

  message TaskType {
    string name = 1;                        // the wire name, written into every task of this type
    string description = 2;
    optional string result_schema_json = 3; // absent: the result is text
    repeated string rules = 4;              // names, checked in order
  }
  message TaskAcceptance {
    string task_type = 1;                   // a name in task_types
    int32 max_iterations = 2;               // at least 1
  }
  message AutonomousSettings {
    optional double approaching_budget_at = 1;          // 0.8
    optional int32 repeated_failure_at = 2;             // 3
    optional int32 max_consecutive_failures = 3;        // 5
    optional int64 dependency_stuck_after_millis = 4;   // 300000
  }
}

message Endpoint {
  string id = 1;                 // for log lines and the console; unique within the Spec
  string prefix = 2;             // as HttpEndpoint's prefix: "/carts"
  Acl    acl = 3;
  repeated Route routes = 4;
  // Read only when `acl` is CALLERS: the callers admitted, any one of which suffices (protocol 1.1).
  repeated CallerMatcher allow_callers = 5;
  enum Acl { ALLOW_ALL = 0; DENY_ALL = 1; AUTHENTICATED = 2; CALLERS = 3; }
}

// One kind of caller a CALLERS acl admits. A named service with no project means this service's own.
message CallerMatcher {
  oneof kind {
    Empty internet = 1;
    NamedService service = 2;
    Empty any_in_project = 3;
    Empty self = 4;
    // 1.15: a caller holding a grant, made by this service's project, on this route or method.
    Empty granted = 5;
  }
}

message NamedService { optional string project = 1; string name = 2; }

message Route {
  string id = 1;                 // unique within the endpoint; the sidecar sends it back on each request
  string method = 2;             // GET, POST, PUT, DELETE, PATCH
  string template = 3;           // HttpEndpoint's syntax: "/{cartId}/items"; relative to prefix
  bool   has_body = 4;
  bool   streaming = 5;          // served as SSE via Endpoint.HandleStream
  // This route's own acl, replacing the endpoint's for this route alone. `optional` so that
  // absent means "the endpoint's" rather than ALLOW_ALL, which is what lets a process built
  // against an earlier protocol keep the endpoint-wide behaviour it expects.
  optional Endpoint.Acl acl = 6;
  // The route's own callers, read only when its `acl` is CALLERS.
  repeated CallerMatcher allow_callers = 7;
  // Answered by opening a socket, via Http.HandleSocket (protocol 1.9). Always GET, never with a
  // body, never streaming; refused under an earlier minor and by a module.
  bool   socket = 8;
}

message Problem { string message = 1; }
