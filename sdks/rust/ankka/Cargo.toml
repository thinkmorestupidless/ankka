[package]
name = "ankka"
version = "0.0.0"
edition = "2024"
# 1.88, not edition 2024's 1.85: the testkit's container dependencies (time, darling) require it.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/thinkmorestupidless/ankka"
homepage = "https://github.com/thinkmorestupidless/ankka/tree/main/sdks/rust"
documentation = "https://docs.rs/ankka"
description = "Build ankka services in Rust, hosted as WebAssembly modules by the ankka runtime"
keywords = ["ankka", "wasm", "event-sourcing", "agents", "serverless"]
categories = ["wasm", "web-programming"]
include = ["src/**", "build.rs", "protocol/**", "Cargo.toml", "README.md"]

[lints]
workspace = true

# docs.rs builds default features only unless told otherwise, and the integration testkit is a feature.
[package.metadata.docs.rs]
all-features = true

[dependencies]
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A contract's fingerprint is the SHA-256 of its schema under RFC 8785 (feature 037).
serde_jcs = "0.1"
sha2 = "0.10"
# The integration testkit: Postgres and the runtime image in Docker. Only with `testkit`, so a
# service's dependencies never include Docker tooling unless it asks.
testcontainers = { version = "0.28", optional = true, features = ["blocking"] }
# The integration testkit's HTTP client: blocking, small, and only with `testkit`.
ureq = { version = "3.4", optional = true }

[dev-dependencies]
# The compile-fail cases: a query that tries to persist must not compile.
trybuild = "1.0.121"

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

# Random bytes outside a module, for a unit test: a module asks the runtime, and Rust's standard
# library has no source. For the native target only, so no module's dependencies include it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"

[features]
testkit = ["dep:testcontainers", "dep:ureq"]
