// Agents: the process plans (an AgentEffect as data) and runs tools; the sidecar runs the loop.
syntax = "proto3";

package ankka.protocol.v1;

import "ankka/protocol/v1/payload.proto";

service Agent {
  rpc Plan           (PlanRequest)      returns (PlanReply);
  rpc InvokeTool     (ToolRequest)      returns (ToolResult);
  rpc CheckGuardrail (GuardrailRequest) returns (GuardrailResult);
  rpc CheckTaskResult (TaskResultRequest) returns (TaskResultVerdict);   // protocol 1.2
}

message PlanRequest {
  string component_id = 1;
  string session_id = 2;
  string name = 3;
  Payload payload = 4;
  Metadata metadata = 5;
}

message PlanReply { oneof message { AgentPlan plan = 1; Failure failure = 2; } }

message AgentPlan {                             // AgentEffect, as data
  optional string model = 1;                    // a name in the sidecar's configuration
  optional string system = 2;
  optional string user = 3;
  repeated string context = 4;
  Memory memory = 5;
  repeated string tools = 6;                    // names declared in discovery
  ResponseShape response_shape = 7;
  repeated string guardrails = 8;               // names declared in discovery
  optional Error failure = 9;                   // effects.error(...): a refusal before any model call
  enum Memory { SESSION = 0; NONE = 1; }
  message ResponseShape {
    oneof shape { Empty text = 1; Json json = 2; }
    message Json { string schema_hint = 1; }
  }
}

// `metadata` (1.3): the trace the tool runs in and the agent's handler as the caller of whatever
// the tool calls, for the process to forward on those calls.
message ToolRequest  { string component_id = 1; string session_id = 2; string tool = 3; string arguments_json = 4; Metadata metadata = 5; }
message ToolResult   { oneof result { string ok = 1; string error = 2; } }   // FunctionTool.invoke's Either

message GuardrailRequest {
  string component_id = 1;
  string session_id = 2;
  string guardrail = 3;
  Stage stage = 4;
  string text = 5;
  Metadata metadata = 6;   // protocol 1.3: the trace, and the handler whose call this check is
  optional string tool = 7; // protocol 1.11: with RESULT, the MCP tool whose result this is
  // RESULT (1.11): what an MCP server's tool answered, checked by a result guardrail before the
  // model is told it.
  enum Stage { INPUT = 0; OUTPUT = 1; RESULT = 2; }
}

message GuardrailResult { oneof result { Empty pass = 1; string block = 2; } }

// An autonomous agent's result, as the model sent it to complete_task (protocol 1.2). The process
// decodes it as the task type's result and runs the type's rules in order: `malformed` when it does
// not decode (the model is told, as a tool error), `reject` naming the first rule that refuses it.
// A rule that throws is answered as a gRPC error, which the sidecar treats as a failed iteration and
// tries again — never as a rejection, since nothing was decided.
message TaskResultRequest {
  string component_id = 1;
  string task_id = 2;
  string task_type = 3;
  string result_json = 4;
  Metadata metadata = 5;   // protocol 1.3: the trace, and the handler whose call this check is
}

message TaskResultVerdict {
  oneof verdict {
    Empty accept = 1;
    string malformed = 2;
    Rejection reject = 3;
  }
  message Rejection { string rule = 1; string reason = 2; }
}
