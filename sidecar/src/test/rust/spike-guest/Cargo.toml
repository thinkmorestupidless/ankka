# The spike guest: a WebAssembly module answering discovery, one event sourced command and one
# fold, built to measure what an in-process host costs. See ankka-deployments design/wasm-hosting.md, "What the
# spike must answer". Not a PDK and not published; `build.sh` writes the module the spike loads.
[package]
name = "ankka-spike-guest"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
