// The spike's envelopes: what crosses linear memory for a stateless guest. The protocol's own
// messages carry everything but the state, which the host holds and passes with every call.
syntax = "proto3";

package ankka.spike;

import "ankka/protocol/v1/payload.proto";
import "ankka/protocol/v1/event_sourced.proto";

message HandleRequest {
  ankka.protocol.v1.Payload state = 1;                         // absent: the empty state
  ankka.protocol.v1.EventSourcedIn.Command command = 2;
}

message HandleReply {
  ankka.protocol.v1.EventSourcedOut.Reply reply = 1;
  ankka.protocol.v1.Payload state = 2;                         // after the reply's events
}

message FoldRequest {
  ankka.protocol.v1.Payload state = 1;
  ankka.protocol.v1.Payload event = 2;
}
