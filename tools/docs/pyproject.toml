[project]
name = "ankka-docs"
version = "0.0.0"
description = "Checks and renders ankka's documentation: the site, llms.txt, the page index and the agent skill."
requires-python = ">=3.12"
dependencies = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==12.1",
    "pyyaml==6.0.3",
]

[project.scripts]
docs = "ankka_docs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ankka_docs"]
